  /* ========================================================================
     走查器
     ======================================================================*/

  /* 路径求值。返回 { status, n, filled }
       status: "ok"    路径存在且有值
               "null"  路径在，值是 null（= 未提取 / 不适用）
               "miss"  路径不存在
               "empty" 是数组但一个元素都没有（**中性，不是错**）
               "type"  类型与契约声明不符
               "range" 数值越界
               "gated" 上游闸门没提供（由 check 的第二遍填） */
  function evalPath(data, spec) {
    var segs = String(spec.p).split(".");
    var cur = [data];

    for (var i = 0; i < segs.length; i++) {
      var seg = segs[i];
      var each = seg.slice(-2) === "[]";
      var key = each ? seg.slice(0, -2) : seg;
      var next = [];
      var sawEmpty = false;

      for (var j = 0; j < cur.length; j++) {
        var node = cur[j];
        if (node === null || node === undefined || typeof node !== "object") continue;
        var v = node[key];
        if (v === undefined) continue;

        if (each) {
          /* `[]` 自己就断言了「这里必须是数组」——
             risks 传成对象、sources 传成字符串都在这一行被抓住。
             所以契约里不用再写 t:"arr"，写了反而是错的：
             走查器已经把数组扇开了，叶子拿到的是**元素**不是数组。 */
          if (v === null) { next.push(v); continue; }          // null 交给叶子判定
          if (!Array.isArray(v)) {
            return { status: "type", n: 1, filled: 1, sample: v, want: "数组（" + spec.p + " 的 [] 段）" };
          }
          if (!v.length) { sawEmpty = true; continue; }
          for (var k = 0; k < v.length; k++) next.push(v[k]);
        } else {
          next.push(v);
        }
      }

      if (!next.length) return { status: sawEmpty ? "empty" : "miss", n: 0, filled: 0 };
      cur = next;
    }

    var filled = cur.filter(function (v) { return v !== null && v !== undefined; });

    if (!filled.length) return { status: "null", n: cur.length, filled: 0 };

    /* 类型与范围只对**叶子**检查：中间层是容器，类型由路径形状保证 */
    if (spec.t) {
      var bad = filled.filter(function (v) {
        if (spec.t === "num")    return !isFinite(Number(v)) || typeof v === "boolean";
        if (spec.t === "str")    return typeof v !== "string" || !v;
        if (spec.t === "arr")    return !Array.isArray(v);
        if (spec.t === "obj")    return typeof v !== "object" || Array.isArray(v);
        return false;
      });
      if (bad.length) return { status: "type", n: cur.length, filled: filled.length, sample: bad[0] };
    }

    if (spec.range) {
      var out = filled.filter(function (v) {
        var n = Number(v);
        return !isFinite(n) || n < spec.range[0] || n > spec.range[1];
      });
      if (out.length) return { status: "range", n: cur.length, filled: filled.length, sample: out[0] };
    }

    return { status: "ok", n: cur.length, filled: filled.length };
  }

  /**
   * 走查一份候选数据。
   *   raw   统一对象（D 的 unified.json）
   *   memo  投研简报绑定表（D 的 memo.json），页面 6 专用。不传则页面 6 全部记 gated
   * 返回逐路径结果的扁平数组。**不抛异常** —— 传 null / 非对象也照常出报告。
   */
  function check(raw, memo) {
    var roots = { "": raw, "memo": memo };
    var all = [];

    PAGES.forEach(function (pg) {
      pg.items.forEach(function (spec) {
        var rootKey = spec.root || "";
        var rootData = roots[rootKey];
        var r;
        if (rootData === null || rootData === undefined) {
          /* 整份数据源没给（比如根本没传 memo.json）——
             记 gated 而不是 miss，否则页面 6 的 22 条会一起报成缺口。
             一份文件没交，是**一件事**，不是 22 件事。 */
          r = { status: "gated", n: 0, filled: 0, gateStatus: "miss" };
        } else {
          r = evalPath(rootData, spec);
        }
        r.spec = spec;
        r.pageId = pg.id;
        r.pageTitle = pg.title;
        all.push(r);
      });
    });

    /* 第二遍：闸门。上游整块没提供时，子路径记 "gated" ——
       否则一个块一缺就立刻连报 N 条子路径，一条真缺口被 N 条噪音盖住。 */
    var byPath = {};
    all.forEach(function (r) { byPath[(r.spec.root || "") + "|" + r.spec.p] = r; });

    all.forEach(function (r) {
      var g = r.spec.gate;
      var pre = (r.spec.root || "") + "|";
      while (g) {
        var gr = byPath[pre + g];
        if (!gr) break;
        if (gr.status === "miss" || gr.status === "null" || gr.status === "empty" || gr.status === "gated") {
          r.status = "gated";
          r.gateStatus = gr.status;
          break;
        }
        g = gr.spec.gate;                     // 闸门本身也被闸住 → 继续往上找
      }
    });

    /* ==================================================================
       第三遍：not_applicable —— 「这一项对这家公司不成立」是一种**答复**，
       不是缺口。
       ------------------------------------------------------------------
       真例：茅台的 goodwill 是
         { value: null, status: "not_applicable", page: 57 }
       D 用 status 说了「年报的资产负债表上本来就没有这一行」。
       于是 `financials.goodwill` 这一族的四条路径（value / page /
       prior_value / prior_period）**都算已被答复**。

       不这么做的后果很具体：提醒条上会写着「【财务概览】缺 1 项：商誉 · 找 A」——
       让 E 去找 A 补一个**根本不存在**的数。一条指错的欠账，比没有欠账更坏。

       ★ 判据必须落在祖先对象的 `status` 上，**不能落在 `value === null`**。
         按 value 判会把「上游没抽到」一并放行 —— 而那正是这一页
         「数字必须可验证」要防的事：缺数据必须明说，不能不留白。
         这与 dataLoader.js 的 isNotApplicable 是同一条规矩的两端，改一处要看另一处。

       ⚠️ 只处理**不含 `[]` 的路径**。数组元素（risks[].xxx）没有「祖先对象」
         这个概念 —— 同一条路径上不同元素的状态各不相同，一个 status
         代表不了一族。现在没有需要它的数组路径，遇到再想。 */
    all.forEach(function (r) {
      if (String(r.spec.p).indexOf("[]") >= 0) return;
      var rootData = roots[r.spec.root || ""];
      if (rootData === null || rootData === undefined) return;

      var segs = String(r.spec.p).split(".");
      /* 从最贴近叶子的祖先往上找 —— 就近的那个才算数 */
      for (var i = segs.length - 1; i > 0; i--) {
        var node = nodeAt(rootData, segs.slice(0, i).join("."));
        if (node && typeof node === "object" && node.status === "not_applicable") {
          r.status = "na";
          r.naAt = segs.slice(0, i).join(".");
          break;
        }
      }
    });

    return all;
  }

  /* 按不含 `[]` 的点分路径取一个节点。取不到返回 undefined。 */
  function nodeAt(data, p) {
    var segs = String(p).split(".");
    var cur = data;
    for (var i = 0; i < segs.length; i++) {
      if (cur === null || cur === undefined || typeof cur !== "object") return undefined;
      cur = cur[segs[i]];
    }
    return cur;
  }

     ★ na（不适用）**不是**缺口 —— 上游明确答复了「这项不成立」。
       它是唯一一类「存在感为负」的状态：不该让人去找人补，也不该出现在欠账清单里。 */
  function isGap(r) {
    var s = r.status;
    return s === "miss" || s === "null" || s === "type" || s === "range";
  }

  /* ========================================================================
     汇总：把逐路径结果压成「页面 × 谁 × 什么」
     ======================================================================*/

  function summarize(results) {
    var byPage = {};
    results.forEach(function (r) {
      var id = r.pageId;
      byPage[id] = byPage[id] || {
        id: id, title: r.pageTitle,
        core: 0, opt: 0, open: 0, gated: 0, empty: 0, ok: 0, na: 0,
        coreMiss: [], openMiss: [], problems: []
      };
      var b = byPage[id];

      if (r.status === "gated") { b.gated++; return; }
      if (r.status === "empty") { b.empty++; return; }
      if (r.status === "ok")    { b.ok++;    return; }
      /* 不适用也算「这一条有交代了」，所以走 ok 那条路：不进 coreMiss、
         不进 problems、不影响「可否完整渲染」。单独计一个 na 只是为了让
         体检报告能说清楚「这几条不是漏，是不成立」。 */
      if (r.status === "na")    { b.na++; b.ok++; return; }

      if (r.status === "type" || r.status === "range") {
        b.problems.push(r);
        return;
      }

      /* 剩下的就是 miss / null，按 lv 归位 */
      if (r.spec.lv === "core")      { b.core++; b.coreMiss.push(r); }
      else if (r.spec.lv === "open") { b.open++; b.openMiss.push(r); }
      else                           { b.opt++;  b.openMiss.push(r); }
    });

    return PAGES.map(function (pg) { return byPage[pg.id]; }).filter(Boolean);
  }

  /* 按「谁欠着」重新切一刀 —— 这就是给队友的需求文档 */
  function byOwner(results) {
    var out = {};
    results.forEach(function (r) {
      /* na（不适用）也在这里被跳过 —— 它是答复，不是欠账。
         这份 byOwner 就是「发给队友的需求文档」，不该向谁要一个不存在的数。 */
      if (r.status === "gated" || r.status === "empty"
          || r.status === "ok" || r.status === "na") return;
      var w = r.spec.who;
      out[w] = out[w] || { who: w, core: [], open: [], opt: [], problems: [] };
      if (r.status === "type" || r.status === "range") out[w].problems.push(r);
      else if (r.spec.lv === "core") out[w].core.push(r);
      else if (r.spec.lv === "open") out[w].open.push(r);
      else                           out[w].opt.push(r);
    });
    return out;
  }

    PAGES: PAGES,
    INDICATORS: INDICATORS,
    GROUP_LABELS: GROUP_LABELS,
    FIN_KEYS: FIN_KEYS,
    FIN_LABELS: FIN_LABELS,
    evalPath: evalPath,
    check: check,
    isGap: isGap,
    summarize: summarize,
    byOwner: byOwner,

    /* 全部路径（工具和测试用来做覆盖自查）。
       带 root 前缀 —— 两个数据源里的同名路径要能分开数。 */
    allPaths: function () {
      var out = [];
      PAGES.forEach(function (pg) {
        pg.items.forEach(function (s) {
          out.push(s.root === "memo" ? "memo|" + s.p : s.p);
        });
      });
      return out;
    },

    /* 页面 6 用的那批路径（interface-check 靠它决定要不要去读 memo.json） */
    needsMemo: function () {
      var out = [];
      PAGES.forEach(function (pg) {
        pg.items.forEach(function (s) { if (s.root === "memo") out.push(s.p); });
      });
      return out;
    }
  };
})();

       ratios.growth.revenue_growth_yoy                ← ratios 字典的键
       risks[].involved_values[].metric = "revenue_growth"   ← 规则语言的键

     同一件事（营业收入同比）在两处叫两个名字。原因不难理解：ratios 是 B 算出来的
     指标台账，键名带口径后缀（_yoy / _weighted）；而风险规则写的是**触发条件**，
     用的是规则作者顺手起的短名。两边都不是错的，但 E 不能拿一张表去查两个地方。

     实测出现过的 5 个（600519 / 000333 两份数据的 risks 全集）：
       revenue_growth / net_income_parent_growth / roe_delta /
       ocf_to_net_income_parent / debt_to_assets
     ★ 这张表**只覆盖规则的取值**，不覆盖 ratios。页面 4 展示风险时查这里，
       页面 3 展示指标时查 RATIO_META —— 两条线不交叉。
     ★ 没登记的键一律原样显示英文（见 labelOfAny），不猜。
     ------------------------------------------------------------------------*/
  var RULE_META = {
    revenue_growth:           { label: "营业收入同比",                  kind: "pct" },
    net_income_parent_growth: { label: "归母净利润同比",                kind: "pct" },
    roe_delta:                { label: "ROE 变动",                      kind: "pct" },
    ocf_to_net_income_parent: { label: "净现比（经营现金流/归母净利润）", kind: "pct" },
    debt_to_assets:           { label: "资产负债率",                    kind: "pct" }
  };

  /* 解析指标中文名。词汇表里没有就原样返回英文键 ——
     **不猜**。显示成 net_margin_total 至少能让人一眼看出是 E 没登记，
     比默默编一个像模像样的中文名、事后没人发现要安全得多。 */
  function labelOf(key) {
    var m = RATIO_META[key];
    return m ? m.label : key;
  }

  /* 风险里出现的任意指标键 → 中文名。三张表依次查：
       RULE_META（规则语言）→ FINANCIAL_LABELS（财报科目）→ RATIO_META（指标台账）。
     顺序反过来的话，"ocf" 会先命中 RATIO_META 的「经营活动现金流净额」——
     其实两边名字一样，无所谓；但 "capex" 之类在两张表里都在，
     所以顺序只影响同义不同名的情况，这里按「风险场景优先」排。 */
  function labelOfAny(key) {
    if (RULE_META[key]) return RULE_META[key].label;
    if (FINANCIAL_LABELS[key]) return FINANCIAL_LABELS[key];
    if (RATIO_META[key]) return RATIO_META[key].label;
    return key;
  }

  /* 风险里的数值按它的口径渲染成文字。
     · unit 是 "元" / "万元" / "亿元" → money（归一后再显示）
     · unit 是 "%" / "倍" / "次" / "天" → 交给 fmt.metric 分派
     · unit 是 "小数"（混装桶）或没给 → 查 RULE_META / RATIO_META 的 kind；
       两张表都没有就**当裸数字显示**，不擅自 ×100（猜错会把 0.75 写成 75%） */
  function formatRiskValue(key, value, unit) {
    var f = FinScope.fmt;
    if (value === null || value === undefined) return f.MISSING;

    if (unit === "元" || unit === "万元" || unit === "亿元") {
      return f.money({ value: value, unit: unit });
    }
    if (unit && unit !== "小数") return f.metric({ value: value, unit: unit });

    var m = RULE_META[key] || RATIO_META[key];
    if (m && m.kind === "pct")      return f.percent({ value: value });
    if (m && m.kind === "money")    return f.money({ value: value, unit: "元" });
    if (m && m.kind === "multiple") return f.multiple({ value: value });
    if (m && m.kind === "times")    return f.times({ value: value });
    if (m && m.kind === "days")     return f.days({ value: value });
    return f.num({ value: value }, 4);
  }

  /* 按声明口径格式化一个比值项。
     - kind 缺失（词汇表没登记）→ 退回 fmt.metric() 按 unit 分派
     - 值是 null → 交给 fmt 返回破折号，页面据此不画条、不写数 */
  function formatRatio(key, item) {
    var f = FinScope.fmt;
    if (!item || typeof item !== "object") return f.MISSING;

    var m = RATIO_META[key];
    if (!m) return f.metric(item);

    switch (m.kind) {
      case "pct":      return f.percent({ value: item.value });
      case "money":    return f.money(item);
      case "multiple": return f.multiple({ value: item.value });
      case "times":    return f.times({ value: item.value });
      case "days":     return f.days({ value: item.value });
      default:         return f.num({ value: item.value }, 3);
    }
  }

  /* 对外的名字。format.js 的注释里把它写作 ratioValue()，
     含义是「按指标口径把一个比值项渲染成文字」—— 名字更贴近它做的事。 */
  function ratioValue(key, item) {
    return formatRatio(key, item);
  }

  /* 这个指标是不是「核心指标」（页面 3 的主行）。
     ★ 名单来自 js/contract.js 的 INDICATORS —— E 的消费端契约里那一份，
       不在这里另抄。D 的 ratios 一个维度有 10–18 项，全平铺等于没排；
       契约登记的 3–4 项是「读的人先要看的那几个」。
       contract.js 没加载（或该维度没登记）时一律返回 false ——
       于是页面 3 退化成「全部平铺」，是能用的，只是不如有主次。 */
  function isCoreRatio(groupKey, key) {
    var C = FinScope.contract;
    if (!C || !C.INDICATORS) return false;
    var list = C.INDICATORS[groupKey];
    return Array.isArray(list) && list.indexOf(key) >= 0;
  }

  /* 该维度的核心指标清单（按契约声明顺序）。契约里没登记这个维度 → null，
     调用方据此不排序，保持数据原序。 */
  function coreOrder(groupKey) {
    var C = FinScope.contract;
    if (!C || !C.INDICATORS) return null;
    var list = C.INDICATORS[groupKey];
    return Array.isArray(list) ? list : null;
  }

  /* --------------------------------------------------------------------------
     财报科目词汇表：字段名 → 中文名 + 归属报表 + 在报表里的层级
     --------------------------------------------------------------------------
     为什么要在前端排这个表：16 个科目平铺成一长串等于没排。
     三张报表各有自己的形状，压成同一个模板就会显得刻板 ——
       · 利润表是「收入 → 减成本费用 → 利润」的层级；
       · 资产负债表是「总资产（其中四个细项）／总负债／净资产」；
       · 现金流量表是三项净额的正负分流，资本开支是投资活动下的细项。
     所以这里除了分组，还要声明每行的 indent（缩进层级）与 op（前缀）。

     ⚠️ 严格区分两类字段：
       · key / label        —— 数据口径，随 D 的 Schema 变；
       · 分组 / indent / op / gap / headline —— **E 的呈现决定**，与数据口径无关。
     ⚠️ 这里只放「怎么显示」，不放任何数值。数值一律走 get("financials.xxx")。
     ------------------------------------------------------------------------*/
  var FINANCIAL_BOOK = [
    {
      label: "利润表", shape: "plain", headline: "net_income_parent",
      rows: [
        { key: "revenue" },
        { key: "operating_cost", indent: 1, op: "减：" },
        { key: "rnd_expense",    indent: 1, op: "减：" },
        /* gap：在这一行上面画一道分隔线。它不是算术等号 ——
           中间还隔着其他费用和税，本表列不全，所以**不能让人以为
           上面几行加起来就等于净利润**。分隔线只表示「以下是结论行」。

           D 多给了一个 net_income（净利润，含少数股东）。它和归母净利润
           是两个口径，本产品（以及 D 的简报、C 的估值）全程用归母，
           所以头条挂在归母上；净利润总额留着，因为下面两个「其中：」
           得有个被「其中」的父项，否而缩进是悬空的。 */
        { key: "net_income", gap: true },
        { key: "net_income_parent", indent: 1, op: "其中：" },
        { key: "net_income_excl_nonrecurring", indent: 1, op: "其中：" }
      ]
    },
    {
      label: "资产负债表", shape: "plain", headline: "total_assets",
      rows: [
        { key: "total_assets" },
        /* 「其中：」是报表里的标准写法，且这四个科目确实构成总资产 ——
           缩进表达的是构成关系，是真的，不是排版手感。 */
        { key: "cash_and_equivalents", indent: 1, op: "其中：" },
        { key: "accounts_receivable",  indent: 1 },
        { key: "inventory",            indent: 1 },
        { key: "goodwill",             indent: 1 },
        /* 总负债 / 归母净资产移到细项之后：放在中间会被读成「其中」的一部分。
           注意**不画「资产 = 负债 + 权益」的等号** —— 本表的归母净资产
           不含少数股东权益，真数据下这个等式不成立，画出来就是错的。 */
        { key: "total_liabilities", gap: true },
        { key: "equity_parent" }
      ]
    },
    {
      /* 三项现金流是**净额**，正负号表示流向，所以这一块用零点线分左右。
         资本开支是投资活动下的一个细项、且是流出额，与净额不是同一类数，
         所以放在分隔线之后、用普通幅度条，不参与左右分流。
         —— 因此它单独把 shape 覆写回 "plain"。**不翻符号**：
         真数据里 600519 的资本开支是 +31.3 亿，E 不许把它改成 -31.3
         来迁就图形，那是替 A 重算口径。形状服从数据，不是数据迁就形状。
         （2026-10-13 核实：D 交付的 9 家里资本开支全部为正，符号已一致。） */
      label: "现金流量表", shape: "diverging", headline: "cfo",
      rows: [
        { key: "cfo" },
        { key: "cfi" },
        { key: "cff" },
        { key: "capex", gap: true, shape: "plain" }
      ]
    }
  ];

  /* 科目键名 → 中文名。**键名以 D 的 Schema 为准**（对齐方案决定 #2：
     字段统一用 D 的，A/B/C 的名字映射过来）。
     与旧名的对应：cost_of_revenue→operating_cost、rd_expense→rnd_expense、
     net_income_attr→net_income_parent、net_income_deducted→
     net_income_excl_nonrecurring、equity_attr→equity_parent。 */
  var FINANCIAL_LABELS = {
    revenue:                      "营业收入",
    operating_cost:               "营业成本",
    rnd_expense:                  "研发费用",
    net_income:                   "净利润",
    net_income_parent:            "归母净利润",
    net_income_excl_nonrecurring: "扣非归母净利润",
    total_assets:                 "总资产",
    total_liabilities:            "总负债",
    equity_parent:                "归母净资产",
    cash_and_equivalents:         "货币资金",
    accounts_receivable:          "应收账款",
    inventory:                    "存货",
    goodwill:                     "商誉",
    cfo:                          "经营活动现金流净额",
    cfi:                          "投资活动现金流净额",
    cff:                          "筹资活动现金流净额",
    capex:                        "资本开支"
  };

  function finRow(spec, item) {
    return {
      key: spec.key,
      name: FINANCIAL_LABELS[spec.key] || spec.key,
      indent: spec.indent || 0,      // 0 / 1，页面 2 的缩进层级
      op: spec.op || null,           // 行前缀，如「减：」「其中：」
      gap: !!spec.gap,               // 本行之前画一道分隔线
      /* 逐行覆写所在块的形状。为空表示跟块走。
         用途只有一个：现金流量表里的资本开支（见上）。 */
      shape: spec.shape || null,
      /* 上期值。D 在每个财务科目上带了 prior_value / prior_period
         （如 revenue.prior_value = 170899152276.34, prior_period = "2024"）。
         ★ 这不是 E 算出来的同比，是 D 抽出来的上年同科目原值 ——
           页面 2 用它做「本期 / 上期」两列对照，**不显示增长率**：
           增长率的家在第 3 页的成长性维度，两处各算一次迟早对不上。
         单位为 null 表示 D 没给上期（新上市、科目首次出现等）。 */
      prior: priorOf(item),
      item: item
    };
  }

  /* 取上期值。D 给的是 prior_value + prior_period 两个平铺字段，
     这里打包成一个对象 —— 页面拿到的永远是「有或没有」，不用自己判两次。  */
  function priorOf(item) {
    if (!item || typeof item !== "object") return null;
    var v = item.prior_value;
    if (v === undefined || v === null) return null;
    return { value: v, period: item.prior_period || null, unit: item.unit };
  }

  /* 「这一格对这家公司不成立」—— D 在财务科目上用 status 表达这个意思：
     茅台的 goodwill 是 { value: null, status: "not_applicable", page: 57 }，
     也就是「年报的资产负债表上本来就没有『商誉』这一行」。
     这一类**不画进表**，而不是画一行破折号。

     ★ 判据必须是 status，**绝不能是 value === null**。两者差得很远：
       · status === "not_applicable"  → 这家公司没有这一项，不画；
       · value === null 且 status 不是 → **抽取失败**，照画一个灰破折号。
     按 value 判会把「上游没抽到」静默抹掉，那正是本页「数字必须可验证」
     这句话要防的事 —— 缺数据必须明说，不能不留白。
     这也是为什么这条判断写在这里（数据层、按 D 给的语义），
     而不是在页面里按科目名硬写一个「不画商誉」：换成一家真有商誉的公司
     （万华之类），硬写就会凭空少一行。 */
  function isNotApplicable(item) {
    return !!item && item.status === "not_applicable";
  }

  /* 按词汇表分组返回财报科目；**词汇表里没登记但数据里出现的科目兜进「其他」组**。
     宁可多显示一行，也不能因为前端没登记就把它静默藏起来 ——
     D 换了数据源、多抽了一个科目，前端不该假装它不存在。 */
  function financialGroups() {
    var fin = get("financials", {}) || {};
    var seen = {};
    var out = [];

    FINANCIAL_BOOK.forEach(function (g) {
      var items = [];
      g.rows.forEach(function (spec) {
        if (!Object.prototype.hasOwnProperty.call(fin, spec.key)) return;
        /* ★ 先登记 seen、再决定画不画。顺序不能反 ——
           反了的话，被跳过的科目会掉进下面的「其他」兜底组，
           以「词汇表没登记」的名义重新出现一次，等于没删。 */
        seen[spec.key] = true;
        if (isNotApplicable(fin[spec.key])) return;
        items.push(finRow(spec, fin[spec.key]));
      });
      if (!items.length) return;
      out.push({
        label: g.label,
        shape: g.shape || "plain",
        /* headline 指向该表的头条科目（页面上字号大一档的那一行）。
           头条科目缺数据时退回第一行，页面不该因此留一个空的大字位。 */
        headline: items.some(function (r) { return r.key === g.headline; })
                    ? g.headline : items[0].key,
        items: items
      });
    });

    /* 兜底组不参与报表结构：没有层级、没有头条，一律平铺。
       同样要滤掉 not_applicable —— 词汇表没登记不代表它就该出现。 */
    var extra = Object.keys(fin).filter(function (k) {
      return !seen[k] && !isNotApplicable(fin[k]);
    });
    if (extra.length) {
      out.push({
        label: "其他", shape: "plain", headline: extra[0],
        items: extra.map(function (k) { return finRow({ key: k }, fin[k]); })
      });
    }
    return out;
  }

  /* --------------------------------------------------------------------------
     【2026-10-13 已撤】主营构成 businessMix() 与多期趋势 history()
     --------------------------------------------------------------------------
     撤掉的理由：**没有源**。A 的抽取结果顶层只有
     company / financials / extraction_meta 三段，四个队友谁也不产出
     business_mix 或 history。E 原来按「A 以后会给」把这两块做完了、跑着 mock，
     但那是把不存在的接口当成既有接口在用 —— 演示时只能拿 mock 撑场面。
     按「A/B/C/D 没有的部分从 E 撤掉」处理，页面 2 相应改成用 D 真正给的东西
     （每个财务科目都带 prior_value / prior_period，见 financialGroups）。

     唯一值得回头追的一条：A 在每个抽取指标上确实带了一个 series 字段
     （含 3 年）。也就是说 history **是能低成本恢复的**，只差 D 把它透传出来。
     已记在 js/contract.js 文件末尾与 docs/INTERFACE_CONTRACT.md。
     ------------------------------------------------------------------------ */

  /* --------------------------------------------------------------------------
     【2026-10-13 已撤】公式代入层（CALC_INPUT_LABELS / buildEquation 一整套）
     --------------------------------------------------------------------------
     撤掉的理由：**D 已经把这活干完了，而且干得更好。**

     E 原来那套的做法是：B 给一个 formula 字符串 + 一个 inputs 对象，
     E 去拆字符串、按中文名反查每一侧对应哪个键、拼成「A 41.2% − B 18.4% = 22.8%」。
     难点全在「公式字符串和 inputs 对象的顺序不保证一致」，所以 E 写了
     一堆验证逻辑，拼不可靠就返回 null 让页面回落三行式 —— 很谨慎，但很绕。

     D 的 risks[].evidence_chain[] 直接给的就是**已经分好步骤的结构**：
       step: "数据" | "计算" | "出处" | "判断" | "归因" | "建议"
     每一步都自带字段（item / value / unit / formula / values / pages /
     result / severity / actions …），没有任何东西需要 E 再拆字符串。
     把一个结构化对象拆回字符串再拼回来，是纯粹的自找麻烦。

     页面 4 的「计算」层改为直接渲染 evidence_chain 里 step === "计算" 的那一步。
     ------------------------------------------------------------------------ */

  /* ------------------------------------------------------------------ */
  /* 安全取值                                                            */
  /* ------------------------------------------------------------------ */

  /**
   * 按路径取值，任何一层断掉都返回 fallback，不抛异常。
   *   FinScope.data.get("financials.revenue")
   *   FinScope.data.get("ratios.roe.value", null)
   */
  function get(path, fallback) {
    if (FinScope.fmt.isNil(path)) return fallback === undefined ? null : fallback;
    var node = ctx.raw;
    var keys = String(path).split(".");
    for (var i = 0; i < keys.length; i++) {
      if (node === null || node === undefined) return fallback === undefined ? null : fallback;
      node = node[keys[i]];
    }
    return node === undefined ? (fallback === undefined ? null : fallback) : node;
  }

  /* 取某个财务/指标数据项，顺带保证它是 {value,...} 结构 */
  function item(path) {
    var v = get(path, null);
    if (!v || typeof v !== "object") return null;
    return v;
  }

  /* 取某个单项数值（数据项里的 value） */
  function value(path, fallback) {
    var it = item(path);
    if (!it) return fallback === undefined ? null : fallback;
    var n = FinScope.fmt.toNum(it);
    return n === null ? (fallback === undefined ? null : fallback) : n;
  }

  /* ------------------------------------------------------------------ */
  /* 结构校验                                                            */
  /* ------------------------------------------------------------------ */

  /* 只有这六个是必须的。它们同时也是 D 的 Schema.json 里的顶层键
     （另有 D 自己加的 rules_evaluated，那是它的运行记录，E 只读不做校验门槛）。
     页面 6 的数据源不在这里 —— 它是另一份产物 memo.json，走 ctx.memo。 */
  var REQUIRED_TOP = ["company", "financials", "ratios", "risks", "valuation", "sources"];

  function warn(msg) {
    ctx.warnings.push(msg);
  }

  /* --------------------------------------------------------------------------
     契约驱动的走查（js/contract.js）
     --------------------------------------------------------------------------
     比下面那个浅检查准得多：浅检查只看得见「顶层少了哪个键」，
     看不见「17 个指标全缺 page」「risks 缺证据层」这类真缺口 ——
     而那恰恰是队友交付时最容易漏、E 最难自己发现的。

     ★ 一条关键取舍：**只报「缺口」，不报「欠账」。**
       lv = "open"（合同里挂着、现在肯定还没有）和 "opt"（纯加法字段）
       一律不进提醒条。理由是它们会长年不变 —— 进去就变成没人看的墙纸，
       反而把真正意外的缺口淹掉。这两类由页面内联提示和
       tools/interface-check.js 负责，那里才是看它们的地方。
     ------------------------------------------------------------------------*/
  function validateByContract(raw, memo) {
    var results = FinScope.contract.check(raw, memo);
    var groups = [];
    var byKey = {};

    function bucket(key, init) {
      if (!byKey[key]) { byKey[key] = init; groups.push(byKey[key]); }
      return byKey[key];
    }

    results.forEach(function (r) {
      var isBad = (r.status === "type" || r.status === "range");

      if (isBad) {
        /* 类型 / 范围不对是**脏数据**，不管它挂在哪一档都要报 */
        var g = bucket("!" + r.pageId, {
          pageTitle: r.pageTitle, who: r.spec.who, bad: [], labels: [], order: 0
        });
        g.bad.push(r);
        return;
      }

      if (r.spec.lv !== "core") return;          // 欠账与可选项不进条
      /* 这里只放行 miss / null 两档。**gated 也被这一行挡掉了**，是有意的：
         gated = 它依赖的那一段整块没交（比如 memo.json 没到场，页面 6 的
         22 条会一起变成 gated）。一份文件没交是**一件事**，不是 22 件事 ——
         页面 6 自己会显示整块空状态，提醒条不必数 22 遍。 */
      if (r.status !== "miss" && r.status !== "null") return;

      var g2 = bucket(r.pageId + "|" + r.spec.who, {
        pageTitle: r.pageTitle, who: r.spec.who, bad: [], labels: [], order: 1
      });
      /* 「营业成本」和「营业成本 的页码」是同一件事的两半，
         摘要里只留一条，否则「缺 4 项」会看着像「缺 8 项」。 */
      var lab = String(r.spec.label || r.spec.p).replace(/\s*的页码$/, "");
      if (g2.labels.indexOf(lab) < 0) g2.labels.push(lab);
    });

    /* 脏数据排最前 —— 它是唯一一类「页面会显示错东西」的问题，
       缺数据只是显示成空状态，脏数据是显示成假的。 */
    groups.sort(function (a, b) { return a.order - b.order; });

    groups.forEach(function (g) {
      if (g.bad.length) {
        g.bad.slice(0, 3).forEach(function (r) {
          warn("【" + g.pageTitle + "】" + r.spec.p + " 的值"
            + (r.status === "type" ? "类型不对" : "超出约定范围")
            + "（" + briefValue(r.sample) + "）· 找 " + r.spec.who);
        });
        if (g.bad.length > 3) {
          warn("【" + g.pageTitle + "】另有 " + (g.bad.length - 3) + " 处类型 / 范围问题，不逐条列出。");
        }
        return;
      }

      /* 三条以内全列出来；超过三条只列前三条并以省略号收尾 ——
         不要写「缺 5 项：a、b、c 等 5 项」，那个「等 5 项」和前面的
         「缺 5 项」是同一个数，读的人会以为一共有 10 项。 */
      var n = g.labels.length;
      var names = (n <= 3 ? g.labels : g.labels.slice(0, 3)).join("、") + (n > 3 ? " …" : "");
      warn("【" + g.pageTitle + "】缺 " + n + " 项：" + names + " · 找 " + g.who);
    });
  }

  /* 脏值摘要：截成一行，别让一个长对象把提醒条刷屏 */
  function briefValue(v) {
    var s;
    try { s = JSON.stringify(v); } catch (e) { s = String(v); }
    if (s === undefined) s = String(v);
    return s.length > 40 ? s.slice(0, 40) + "…" : s;
  }

  /* 兜底：js/contract.js 没加载时退回浅检查。
     保留它是为了让 dataLoader 单测能独立跑，**不是**说这层够用。 */
  function validateShallow(raw) {
    REQUIRED_TOP.forEach(function (k) {
      if (raw[k] === undefined || raw[k] === null) {
        warn("缺少顶层字段：" + k + "（对应模块将显示为空状态）");
      }
    });

    if (raw.risks !== undefined && !Array.isArray(raw.risks)) {
      warn("risks 应为数组，实际为 " + typeof raw.risks + "，已按空数组处理。");
    }

    if (raw.sources !== undefined && !Array.isArray(raw.sources)) {
      warn("sources 应为数组，实际为 " + typeof raw.sources + "，已按空数组处理。");
    }

    // 财务数据项逐个检查 value 是否存在
    var fin = raw.financials;
    if (fin && typeof fin === "object") {
      Object.keys(fin).forEach(function (k) {
        var it = fin[k];
        if (it === null || it === undefined) {
          warn("财务字段缺失：" + k);
        } else if (typeof it === "object" && FinScope.fmt.isNil(it.value)) {
          warn("财务字段无值：" + k);
        }
      });
    }
  }

  function validate(raw, memo) {
    ctx.warnings = [];

    if (!raw || typeof raw !== "object") {
      warn("数据结构无效：根对象不存在或不是对象。");
      return false;
    }

    if (FinScope.contract && typeof FinScope.contract.check === "function") {
      validateByContract(raw, memo);
    } else {
      validateShallow(raw);
    }

    return true;
  }

  /* ------------------------------------------------------------------ */
  /* 归一化：把不规范的输入削成前端能安全消费的形状                        */
  /* ------------------------------------------------------------------ */

  function normalize(raw) {
    var out = raw || {};
    out.company = out.company || {};
    out.financials = out.financials || {};
    out.ratios = out.ratios || {};
    out.valuation = out.valuation || {};
    if (!Array.isArray(out.risks)) out.risks = [];
    if (!Array.isArray(out.sources)) out.sources = [];

    // 指标分组保证存在，避免页面里到处写 if
    ["growth", "profitability", "solvency", "efficiency", "cashflow_quality"]
      .forEach(function (g) {
        if (!out.ratios[g] || typeof out.ratios[g] !== "object") out.ratios[g] = {};
      });

    return out;
  }

  /* ------------------------------------------------------------------ */
  /* 加载                                                                */
  /* ------------------------------------------------------------------ */

  /**
   * 加载数据。不传参则读取 window.FINSCOPE_DATA（由 data/*.js 赋值）。
   *   load()                          统一对象 + window.FINSCOPE_MEMO
   *   load(raw)                       只给统一对象，页面 6 记「未提供」
   *   load(raw, memo)                 两份都给（tools 与测试用）
   * 返回值：是否加载成功（**只看统一对象**；memo 缺不算加载失败，
   *        只是页面 6 退化成空状态 —— 它本来就是另一份产物）。
   */
  function load(source, memoSource) {
    var raw = source;

    if (!raw) {
      raw = window.FINSCOPE_DATA;
      ctx.sourceName = (window.FINSCOPE_DATA_SOURCE || "window.FINSCOPE_DATA");
    } else {
      ctx.sourceName = "(传入对象)";
    }

    /* memo 与统一对象**独立**：谁先到都能用。
       不传就退回 window.FINSCOPE_MEMO（由 data/memo_*.js 赋值）。 */
    ctx.memo = (memoSource !== undefined) ? memoSource : (window.FINSCOPE_MEMO || null);

    if (!raw) {
      ctx.raw = null;
      ctx.loaded = false;
      ctx.warnings = ["未找到数据源。请确认 index.html 里引入了 data/real_data.js"
                    + "（该文件由 tools/build-data.js 从 D 的交付物生成）。"];
      return false;
    }

    var ok = validate(raw, ctx.memo);
    ctx.raw = normalize(raw);
    ctx.loaded = ok;

    if (ok && ctx.warnings.length) {
      console.warn("[FinScope] 数据校验提醒：\n- " + ctx.warnings.join("\n- "));
    }
    return ctx.loaded;
  }

  /* ------------------------------------------------------------------ */
  /* 便捷访问器：六个页面共用                                            */
  /* ------------------------------------------------------------------ */

  var api = {

    load: load,
    get: get,
    item: item,
    value: value,

    /* 当前数据状态（调试用） */
    status: function () {
      return {
        loaded: ctx.loaded,
        sourceName: ctx.sourceName,
        warnings: ctx.warnings.slice()
      };
    },

    /**
     * 契约体检结果 —— 与 tools/interface-check.js 是同一份契约走出来的。
     * 提醒条只报「缺口」（意外），这里连「欠账」一起给：
     * 页面 1 的骨架自检卡用它显示「还有多少项在等队友」。
     * 返回 null 表示 contract.js 没加载。
     */
    contractStatus: function () {
      if (!FinScope.contract || !ctx.raw) return null;
      var results = FinScope.contract.check(ctx.raw, ctx.memo);
      var pages = FinScope.contract.summarize(results);
      var totals = { core: 0, open: 0, opt: 0, problems: 0, renderable: 0, gated: 0 };
      pages.forEach(function (p) {
        totals.core += p.core;
        totals.open += p.open;
        totals.opt += p.opt;
        totals.gated += p.gated || 0;
        totals.problems += p.problems.length;
        /* 「可完整渲染」的判据只看 core 与脏数据。
           gated（整块没交）不算 —— 页面会显示成空状态，本身是诚实的。 */
        if (p.core === 0 && !p.problems.length) totals.renderable++;
      });
      totals.pages = pages.length;
      return { totals: totals, pages: pages, byOwner: FinScope.contract.byOwner(results) };
    },

    /* 风险按严重度排序：high → medium → low。
       D 用 high / medium / low，早期契约用 high / attention / normal，两套都认。 */
    sortedRisks: function () {
      var order = { high: 0, medium: 1, attention: 1, low: 2, normal: 2 };

      /* 注意：这里不能用 order[s] || 9 —— high 的优先级是 0，是 falsy，
         会被兜底成 9 排到最后。必须显式判断键是否存在。 */
      function rank(s) {
        return Object.prototype.hasOwnProperty.call(order, s) ? order[s] : 9;
      }

      return (get("risks", []) || []).slice().sort(function (a, b) {
        return rank(a.severity) - rank(b.severity);
      });
    },

    /* 指标分组清单，供给页面3遍历渲染。
       ------------------------------------------------------------------
       五个固定维度 + **数据里出现的其他分组**（D 有个 ratios.banking，
       银行专用指标，目前是空的）。兜底那一条的道理和 financialGroups 的
       「其他」组一样：D 加了新维度，前端不该假装它不存在。
       空分组不返回 —— 空块是噪声，不是内容。 */
    ratioGroups: function () {
      var fixed = [
        { key: "growth",           label: "成长性" },
        { key: "profitability",    label: "盈利能力" },
        { key: "solvency",         label: "偿债能力" },
        { key: "efficiency",       label: "营运能力" },
        { key: "cashflow_quality", label: "现金流质量" }
      ];
      var out = [];
      var seen = {};

      fixed.forEach(function (g) {
        seen[g.key] = true;
        /* ★ 必须写 api.ratioItems —— ratioItems 是 api 的属性，
           不是函数声明，没有提升。写成裸名就是在 api 还没赋完值的时候
           去找一个全局的 ratioItems，一定 ReferenceError。 */
        if (api.ratioItems(g.key).length) out.push(g);
      });

      var all = get("ratios", {}) || {};
      Object.keys(all).forEach(function (k) {
        if (seen[k]) return;
        if (!all[k] || typeof all[k] !== "object") return;
        if (!api.ratioItems(k).length) return;
        out.push({ key: k, label: k });              // 未登记的分组，显示英文键名
      });

      return out;
    },

    /* 取某分组下所有指标项，自动跳过 _score 等元字段（D 已经不产出了，
       这个 guard 留给 mock 数据）。
       每项带 label（中文名）、text（按声明口径格式化好的值）、以及
       status / quiet / page / formula 等页面直接要用的字段。
       **页面不要自己去 fmt 这个值** —— 单位口径（该不该 ×100）只有这里知道。

       ★ 顺序：**核心指标排在前面**，其余保持数据里的原序跟在后面。
         D 一个维度有 10–18 项（ratioItems 全给），页面 3 靠 isCore 决定
         谁常显、谁折进「其余 N 项」。排序放在这里而不是页面里 ——
         排序规则是契约的一部分（INDICATORS 的顺序就是「先看哪个」的顺序），
         页面只负责画。 */
    ratioItems: function (groupKey) {
      var g = get("ratios." + groupKey, {}) || {};
      var out = [];
      Object.keys(g).forEach(function (k) {
        if (k.charAt(0) === "_") return;             // 跳过 _score 等元字段
        var it = g[k];
        if (!it || typeof it !== "object") return;

        var f = FinScope.fmt;
        var st = it.status === undefined ? null : it.status;
        out.push({
          key: k,
          item: it,
          label: labelOf(k),
          text: formatRatio(k, it),
          registered: !!RATIO_META[k],               // false = 词汇表没登记，中文名是英文键
          status: st,
          quiet: f.statusQuiet(st),                  // true = 不值得挂状态胶囊
          page: (it.page === undefined ? null : it.page),
          formula: (typeof it.formula === "string" && it.formula) ? it.formula : null,
          isCore: isCoreRatio(groupKey, k)
        });
      });

      var seq = coreOrder(groupKey);
      if (seq) {
        out.sort(function (a, b) {
          var ia = seq.indexOf(a.key), ib = seq.indexOf(b.key);
          if (ia < 0) ia = seq.length;               // 没登记的排在登记项之后
          if (ib < 0) ib = seq.length;
          return ia - ib;
        });
      }
      return out;
    },

    /* 只取 E 的契约登记为「核心」的那几项，供给页面 3 的主行。
       ★ 名单不在这里另写一份 —— 直接读 js/contract.js 的 INDICATORS，
         一份契约两个消费者（运行时校验 + 页面排序），改了不会两边不一致。 */
    ratioCore: function (groupKey) {
      return api.ratioItems(groupKey).filter(function (x) { return x.isCore; });
    },

    /* 指标字段名 → 中文显示名 */
    ratioLabel: function (key) {
      return labelOf(key);
    },

    /* 按指标声明口径把比值项渲染成文字。("roe_weighted", {value:0.3446,…})
       → "34.5%"。★ 页面拿到比率项后**必须走这个函数**，不要用 fmt.metric ——
       D 的 unit "小数" 是个混装桶，fmt.metric 分不出该不该 ×100，
       会把 34.5% 显示成 "0.345"。 */
    ratioValue: function (key, item) {
      return ratioValue(key, item);
    },

    /* 风险里出现的指标键 → 中文名。查三张表（规则语言 / 财报科目 / 指标台账），
       都没有就原样返回英文键。页面 4 用。 */
    metricLabel: function (key) {
      return labelOfAny(key);
    },

    /* 风险里的数值 → 显示文字。页面 4 用。
       与 ratioValue 的区别：这里的"指标"可能是财报科目、可能是规则短名、
       也可能两者都不是，所以它先认 unit，unit 不可判时才查表。 */
    riskValue: function (key, value, unit) {
      return formatRiskValue(key, value, unit);
    },

    /* 财报科目按报表分组，供给页面2 的「主要财务数据」表。
       返回 [{ label:"利润表", items:[{key,name,item,prior,...}] }]，空分组不返回。
       每项带 prior：{ value, period } —— D 在每个财务项上给了上期值与上期期间，
       页面 2 因此能做「本期 / 上期」对照，不需要 history 字段。 */
    financialGroups: function () {
      return financialGroups();
    },

    /* 风险概览计数，供给页面 4 顶部概览条。
       认不出的 severity 归入 low —— 不猜、也不丢，条数永远对得上。
       ⚠️ 这里数的是 D 的 risks[]，它**已经被 D 按 status == "triggered"
          过滤过**，所以「未触发」那些不在此列。
          「一共检查了几条、触发了几条」由 rules_evaluated 回答，
          页面 4 从 rulesSummary() 取。 */
    riskSummary: function () {
      var list = get("risks", []) || [];
      var out = { total: list.length, high: 0, medium: 0, low: 0 };
      list.forEach(function (r) {
        if (r.severity === "high") out.high++;
        else if (r.severity === "medium" || r.severity === "attention") out.medium++;
        else out.low++;
      });
      return out;
    },

    /* 规则扫描的账：D 一共评估了几条规则、其中几条通过、几条无法判定。
       供给页面 4 顶部那句「已检查 N 条规则，触发 M 条」——
       没有这句话，「只有 2 条风险」会被读成「这家公司只有 2 个问题」，
       而实际上是「扫了 20 条，命中 2 条」。这是完全不同的两句话。
       返回 null 表示 D 没给 rules_evaluated。 */
    rulesSummary: function () {
      var list = get("rules_evaluated", null);
      if (!Array.isArray(list)) return null;
      var out = { total: list.length, triggered: 0, passed: 0, other: 0 };
      list.forEach(function (r) {
        var s = r && r.status;
        if (s === "triggered") out.triggered++;
        else if (s === "passed") out.passed++;
        else out.other++;
      });
      return out;
    },

    /* ------------------------------------------------------------------ */
    /* 页面 6 专用：D 的投研简报绑定表（memo.json）                        */
    /* ------------------------------------------------------------------ */
    /* memo 不是「报告正文」，是占位符 → 值的绑定表，结构见 js/contract.js
       的「关于页面 6」一节。三件事：
         · 每个值都已经由 D 格式化好了（"4,564.52 亿元"）——
           页面 6 是**唯一一页 E 不做数字格式化**的页面，直接用 formatted。
         · memo 与统一对象是**两份独立产物**，任一不到场另一份照常用。
         · E 不撰写报告内容 —— 页面 6 只搬 D 的字符串，不自己连句。 */

    /* memo 是否到场 */
    hasMemo: function () { return !!ctx.memo; },

    memoMeta: function () {
      return (ctx.memo && ctx.memo.meta) || null;
    },

    /* 七个章节标题，D 的 columns[] 原样返回 */
    memoColumns: function () {
      var c = ctx.memo && ctx.memo.columns;
      return Array.isArray(c) ? c.slice() : [];
    },

    /* 标量绑定表 → { placeholder: { formatted, source_path, raw_value } }。
       D 的 scalars[] 里同名 placeholder 会出现多次（如 blended_ps 在
       「⑤ 预测与估值」和抬头各绑一次），**取第一条**——
       它们的 formatted 是同一次渲染的产物，值必然相同。 */
    memoScalars: function () {
      var out = {};
      var list = (ctx.memo && ctx.memo.scalars) || [];
      if (!Array.isArray(list)) return out;
      list.forEach(function (s) {
        if (!s || typeof s !== "object" || !s.placeholder) return;
        if (out[s.placeholder]) return;
        out[s.placeholder] = s;
      });
      return out;
    },

    /* 单个标量的显示值，直出 D 的 formatted。没绑到就返回 null，
       页面据此决定这一格是「不显示」还是「显示占位」。 */
    memoValue: function (placeholder) {
      var s = api.memoScalars()[placeholder];
      return s ? s.formatted : null;
    },

    /* 具名列表 → { name: items[] } */
    memoCollections: function () {
      var out = {};
      var list = (ctx.memo && ctx.memo.collections) || [];
      if (!Array.isArray(list)) return out;
      list.forEach(function (c) {
        if (!c || typeof c.name !== "string") return;
        out[c.name] = Array.isArray(c.items) ? c.items : [];
      });
      return out;
    },

    memoCollection: function (name) {
      var items = api.memoCollections()[name];
      return items || [];
    },

    /* 一行 memo 表格的单元格取值：{ col: {formatted} } → { col: "文字" }。
       空单元格统一成 null（而不是空串），页面才好判断要不要留空格。 */
    memoRow: function (row, cols) {
      var out = {};
      cols.forEach(function (c) {
        var cell = row && row[c];
        var v = cell && typeof cell === "object" ? cell.formatted : cell;
        out[c] = (v === undefined || v === null || v === "") ? null : String(v);
      });
      return out;
    },

    /* D 自己的合规闸门结果。页面 6 把它顶在报告最上面 ——
       「这份简报可信吗」得先回答，再让人读内容。 */
    memoValidation: function () {
      if (!ctx.memo) return null;
      var v = ctx.memo.validation || null;
      var hits = (ctx.memo.compliance && ctx.memo.compliance.hits) || [];
      if (!v && !hits.length) return null;
      var violations = (v && Array.isArray(v.violations)) ? v.violations : [];
      return {
        passed: v ? v.passed !== false : null,
        allowedCount: v ? v.allowed_count : null,
        scannedTokens: v ? v.scanned_tokens : null,
        violations: violations,
        hits: Array.isArray(hits) ? hits : []
      };
    },

    /**
     * 按页码反查 sources[] 里的来源条目，拿到文件名 / 期间 / 取数时间。
     *

     *   —— 里面**没有 metric 字段**。E 原来按「指标名 + 页码」双键匹配，
     *   指标名那一半永远匹配不上，等于白写。现在只按页码，多命中取第一条。
     *   都中不了返回 null，页面据此显示灰色破折号（**不编一个链接出来**）。
     */
    findSource: function (metric, page) {
      var list = get("sources", []) || [];
      var hasPage = page !== null && page !== undefined;
      if (!hasPage) return null;

      for (var i = 0; i < list.length; i++) {
        if (list[i] && list[i].page === page) return list[i];
      }
      return null;

      /* metric 参数留着不删：调用点还照着老签名传，删了参数等于把
         一个静默的接口变更埋进页面里。哪天页面全改完可以再收。 */
    }
  };

  FinScope.data = api;
})();

           · tokenize.js 必须在 search.js 前面 —— 后者的 BM25 词表建在前者上
           · tokens_golden.js 给页面 1 的分词一致性自检当样本
         17 MB 的 a/data/shard_*.js **不在这里**。它们是按需注入的：
         用户点了哪家公司、或是点了哪道题，才读那一家的正文

         全量塞进来会让首屏卡住好几秒，而看板只用得到 95 KB 的 metrics.js。 -->
<script>
/* ================= a/tokenize.js ================= */
// 中文检索分词与哈希——必须与 src/tokenize_zh.py、src/build_index.py 完全一致。
// 任何一处改动都会让浏览器侧的 BM25 打分与 Python 侧对不上，索引必须重建。
//
// 对应用法：index.html 加载 web/data/tokens_golden.js 后，页面启动时会跑一遍
// 一致性自检，不一致就在页面上报警，而不是悄悄给出错的检索结果。

(function (global) {
  'use strict';

  var TOKENIZER_VERSION = 'zh-char-bigram-v1';

  var CJK_RE = /[一-鿿]+/g;
  var ALNUM_RE = /[a-z0-9]+/g;

  function tokenize(text) {
    var s = (text == null ? '' : String(text)).normalize('NFKC').toLowerCase();
    var out = [];
    var cjk = s.match(CJK_RE) || [];
    for (var i = 0; i < cjk.length; i++) {
      var seg = cjk[i];
      for (var j = 0; j < seg.length; j++) out.push(seg[j]);
      for (var k = 0; k + 1 < seg.length; k++) out.push(seg.slice(k, k + 2));
    }
    var alnum = s.match(ALNUM_RE) || [];
    for (var m = 0; m < alnum.length; m++) out.push(alnum[m]);
    return out;
  }

  // FNV-1a 32 位，按 UTF-16 码元；返回有符号 int32，与 Python 的 as_i32 对齐。
  function fnv1a(token) {
    var h = 2166136261;
    for (var i = 0; i < token.length; i++) {
      h ^= token.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h | 0;
  }

  function termFreq(text) {
    var toks = tokenize(text), tf = Object.create(null);
    for (var i = 0; i < toks.length; i++) {
      tf[toks[i]] = (tf[toks[i]] || 0) + 1;
    }
    return tf;
  }

  // 与 golden 用例比对；返回不一致的条目，供页面启动自检。
  function checkGolden(golden) {
    if (!golden || !golden.cases) return { ok: false, reason: '缺少 golden 用例' };
    var bad = [];
    for (var i = 0; i < golden.cases.length; i++) {
      var c = golden.cases[i];
      var got = tokenize(c.input).join('\u0001');
      if (got !== c.tokens.join('\u0001')) {
        bad.push({ input: c.input, expected: c.tokens, got: tokenize(c.input) });
      }
    }
    return { ok: bad.length === 0, version: TOKENIZER_VERSION, bad: bad };
  }

  global.FinTok = {
    version: TOKENIZER_VERSION,
    tokenize: tokenize,
    fnv1a: fnv1a,
    termFreq: termFreq,
    checkGolden: checkGolden
  };
})(window);

</script>
<script>
/* ================= a/search.js ================= */
// 浏览器侧检索：BM25（中文 char bigram）+ 向量余弦 + 融合排序。
// 全部离线跑，file:// 双击打开也能用；不依赖 fetch、WASM 或任何外部服务。

(function (global) {
  'use strict';

  // 分片文件会写 window.FINSCOPE_SHARDS["<code>"]，必须先把这个对象建出来，
  // 否则第一个分片一注入就抛 TypeError，整页检索全废。
  global.FINSCOPE_SHARDS = global.FINSCOPE_SHARDS || {};

  var K1 = 1.5, B = 0.75, RRF_K = 60;
  var COMPANY_BOOST = 1.8;   // 与 src/search_py.py 保持一致

  // ---- base64 -> 定型数组 ----
  function decodeTyped(b64, Ctor) {
    if (!b64) return new Ctor(0);
    var bin = atob(b64), n = bin.length;
    var buf = new ArrayBuffer(n);
    var bytes = new Uint8Array(buf);
    for (var i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
    var usable = Math.floor(n / Ctor.BYTES_PER_ELEMENT);
    return new Ctor(buf, 0, usable);
  }

  // 把分片里的 base64 索引解成可直接查询的结构，只做一次。
  function prepare(shard) {
    if (shard._ready) return shard;
    var b = shard.bm25;
    shard._termHashes = decodeTyped(b.term_hashes_b64, Int32Array);
    shard._df = decodeTyped(b.df_b64, Uint16Array);
    shard._postDoc = decodeTyped(b.post_doc_b64, Uint16Array);
    shard._postTf = decodeTyped(b.post_tf_b64, Uint8Array);
    shard._docLen = decodeTyped(b.doc_len_b64, Uint16Array);
    // 倒排按 token 分组存放，起始位置由 df 前缀和推出，省一个数组
    var n = shard._df.length;
    shard._offset = new Int32Array(n + 1);
    for (var i = 0; i < n; i++) shard._offset[i + 1] = shard._offset[i] + shard._df[i];
    shard._vec = decodeTyped(shard.vec.b64, Int8Array);
    shard._ready = true;
    return shard;
  }

  function lowerBound(arr, x) {
    var lo = 0, hi = arr.length;
    while (lo < hi) {
      var mid = (lo + hi) >>> 1;
      if (arr[mid] < x) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  // ---- BM25 ----
  function bm25Scores(shard, queryText) {
    prepare(shard);
    var N = shard.bm25.n_docs, avgdl = shard.bm25.avgdl || 1;
    var scores = new Float32Array(N);
    var tf = FinTok.termFreq(queryText);
    var th = shard._termHashes, df = shard._df, off = shard._offset;
    var pd = shard._postDoc, pt = shard._postTf, dl = shard._docLen;
    for (var term in tf) {
      var h = FinTok.fnv1a(term);
      var i = lowerBound(th, h);
      if (i >= th.length || th[i] !== h) continue;
      var dfq = df[i];
      if (!dfq) continue;
      var idf = Math.log(1 + (N - dfq + 0.5) / (dfq + 0.5));
      for (var p = off[i]; p < off[i] + dfq; p++) {
        var d = pd[p], f = pt[p], len = dl[d] || 1;
        scores[d] += idf * (f * (K1 + 1)) / (f + K1 * (1 - B + B * len / avgdl));
      }
    }
    return scores;
  }

  // ---- 向量余弦（query 已是单位向量，点积即余弦）----
  function vecScores(shard, qvec) {
    prepare(shard);
    var n = shard.meta.n_chunks, dim = shard.vec.dim, v = shard._vec;
    var out = new Float32Array(n);
    if (!qvec) return out;
    for (var i = 0; i < n; i++) {
      var s = 0, base = i * dim;
      for (var j = 0; j < dim; j++) s += qvec[j] * v[base + j];
      out[i] = s / 127;
    }
    return out;
  }

  function topK(scores, k) {
    var idx = [];
    for (var i = 0; i < scores.length; i++) if (scores[i] > 0) idx.push(i);
    idx.sort(function (a, b) { return scores[b] - scores[a]; });
    return idx.slice(0, k);
  }

  // ---- 融合 ----
  // RRF 对异构分数量纲不敏感（BM25 无上界、余弦在 [-1,1]），默认用它；
  // 另备归一化加权，便于对比两种融合的召回差异。
  function rrfFuse(rankLists, k) {
    k = k || RRF_K;
    var acc = new Map();
    rankLists.forEach(function (list, li) {
      list.forEach(function (doc, rank) {
        var cur = acc.get(doc) || { doc: doc, score: 0, ranks: {} };
        cur.score += 1 / (k + rank + 1);
        cur.ranks[li] = rank;
        acc.set(doc, cur);
      });
    });
    return Array.from(acc.values()).sort(function (a, b) { return b.score - a.score; });
  }

  function minmax(scores, ids) {
    var lo = Infinity, hi = -Infinity;
    ids.forEach(function (i) { if (scores[i] < lo) lo = scores[i]; if (scores[i] > hi) hi = scores[i]; });
    var span = (hi - lo) || 1;
    return function (i) { return (scores[i] - lo) / span; };
  }

  function weightedFuse(bm, vec, ids, alpha) {
    alpha = (alpha == null) ? 0.5 : alpha;
    var nb = minmax(bm, ids), nv = minmax(vec, ids);
    return ids.map(function (i) {
      return { doc: i, score: alpha * nb(i) + (1 - alpha) * nv(i), ranks: {} };
    }).sort(function (a, b) { return b.score - a.score; });
  }

  // ---- 对外：在单个分片上检索 ----
  // qvec 为 null 时退化为 BM25 单路（静态页对任意自由输入的情况）。
  function searchShard(shard, queryText, qvec, opts) {
    opts = opts || {};
    var pool = opts.pool || 200, topN = opts.topN || 8;
    var mode = opts.mode || 'rrf';
    prepare(shard);

    var bm = bm25Scores(shard, queryText);
    var bmIds = topK(bm, pool);
    var vec = null, vecIds = [];
    if (qvec) {
      vec = vecScores(shard, qvec);
      vecIds = topK(vec, pool);
    }

    var fused;
    if (qvec) {
      fused = (mode === 'weighted')
        ? weightedFuse(bm, vec, Array.from(new Set(bmIds.concat(vecIds))), opts.alpha)
        : rrfFuse([bmIds, vecIds]).map(function (r) {
            return { doc: r.doc, score: r.score, ranks: r.ranks };
          });
    } else {
      fused = bmIds.map(function (d, r) { return { doc: d, score: bm[d], ranks: { 0: r } }; });
    }

    var bmRank = new Map(bmIds.map(function (d, r) { return [d, r + 1]; }));
    var vecRank = new Map(vecIds.map(function (d, r) { return [d, r + 1]; }));

    return fused.slice(0, topN).map(function (r, i) {
      var c = shard.chunks[r.doc];
      return {
        chunk_id: c.chunk_id,
        company_code: shard.meta.code,
        company_name: shard.meta.name,
        section: c.section,
        printed_page: c.printed_page,
        pdf_index: c.pdf_index,
        is_table: c.is_table,
        text: c.text,
        fused_rank: i + 1,
        fused_score: r.score,
        bm25_rank: bmRank.get(r.doc) || null,
        bm25_score: bm[r.doc] || 0,
        vec_score: vec ? vec[r.doc] : null,
        vec_rank: vecRank.get(r.doc) || null
      };
    });
  }

  // ---- 对外：跨全部公司检索 ----
  function searchAll(shards, queryText, qvec, opts) {
    opts = opts || {};
    var topN = opts.topN || 8, pool = opts.pool || 200;
    var bmList = [], vecList = [];
    shards.forEach(function (sh, si) {
      prepare(sh);
      var bm = bm25Scores(sh, queryText);
      topK(bm, pool).forEach(function (d) { bmList.push([si, d, bm[d]]); });
      if (qvec) {
        var v = vecScores(sh, qvec);
        topK(v, pool).forEach(function (d) { vecList.push([si, d, v[d]]); });
      }
    });
    bmList.sort(function (a, b) { return b[2] - a[2]; });
    vecList.sort(function (a, b) { return b[2] - a[2]; });

    var rankBm = new Map(), rankVec = new Map();
    bmList.forEach(function (x, i) { rankBm.set(x[0] + ':' + x[1], i + 1); });
    vecList.forEach(function (x, i) { rankVec.set(x[0] + ':' + x[1], i + 1); });

    var acc = new Map();
    function bump(si, d, rank) {
      var key = si + ':' + d;
      var cur = acc.get(key) || { si: si, d: d, score: 0 };
      cur.score += 1 / (RRF_K + rank + 1);
      acc.set(key, cur);
    }
    bmList.forEach(function (x, i) { bump(x[0], x[1], i); });
    if (qvec) vecList.forEach(function (x, i) { bump(x[0], x[1], i); });

    // 问句里点名了公司就给该公司的块加权：八家年报科目名高度同质，
    // 「比亚迪2025年经营活动现金流」里的「比亚迪」只有三个 bigram，
    // 压不住「经营活动产生的现金流量净额」在另外七家上百次的出现。
    for (var bi = 0; bi < shards.length; bi++) {
      if (shards[bi].meta.name && queryText.indexOf(shards[bi].meta.name) >= 0) {
        acc.forEach(function (v) { if (v.si === bi) v.score *= COMPANY_BOOST; });
      }
    }

    return Array.from(acc.values()).sort(function (a, b) { return b.score - a.score; })
      .slice(0, topN).map(function (r, i) {
        var sh = shards[r.si], c = sh.chunks[r.d], key = r.si + ':' + r.d;
        return {
          chunk_id: c.chunk_id, company_code: sh.meta.code, company_name: sh.meta.name,
          section: c.section, printed_page: c.printed_page, pdf_index: c.pdf_index,
          is_table: c.is_table, text: c.text,
          fused_rank: i + 1, fused_score: r.score,
          bm25_rank: rankBm.get(key) || null, vec_rank: rankVec.get(key) || null
        };
      });
  }

  global.FinSearch = {
    K1: K1, B: B, RRF_K: RRF_K,
    prepare: prepare, decodeTyped: decodeTyped,
    bm25Scores: bm25Scores, vecScores: vecScores, topK: topK,
    rrfFuse: rrfFuse, weightedFuse: weightedFuse,
    searchShard: searchShard, searchAll: searchAll
  };
})(window);

</script>

    var out = F.fmt.grouped(n / 1e8, 2);
    /* ★ -9.89 元 ÷ 1e8 再留两位 = "-0.00"。
       一个负数被四舍五入到零，那个负号是纯粹的假信息：它说「这里是负的」，
       而真实含义是「这里小得看不见」。格力 2023 那一格就是这么来的
       （A 的 series 里存的是 -9.89，那是个百分数不是金额，见 dataNotes 一节）。
       抹掉负号只是不再撒谎，值本身一个字没改。 */
    if (/^-0(\.0+)?$/.test(out)) out = out.slice(1);
    return out;
  }

  /* ==================================================================== */
  /* 数据存疑自查                                                          */
  /* -------------------------------------------------------------------- */
  /* 为什么页面 1 需要这个、别的页不需要：
     页面 2/6 的数走 D 的接口，D 的值 E 与它交叉核对过（见 dataNotes 的 16/16）。
     页面 1 这一整块走 A 的 metrics.js，而 A 的 series 里混进了**明显不是金额**的格子。
     举三个当场能复现的（raw_text 里就写着答案）：
       · 格力   revenue.series["2023"] = -9.89      ← 这是同比百分数 −9.89%
       · 海康   revenue.series["2023"] =  0.01      ← 同上，0.01 是占比
       · 茅台   cash.series = {2024: 19.84, 2025: 17.01}
                raw_text 是「货币资金 51,690,610,946.50 17.01 59,295,822,956.89 19.84」
                A 取走了 17.01 / 19.84（那两个是**占比**），把 516.9 亿漏在左边。
     E 的规矩是绝不重算、也绝不替 A 改数。所以这里的做法只有一条：
     **一个数都不动，只在它旁边说一句「这个我看着不对」** ——
     就像 A 给的 status 不适用/未找到一样，是「把数据里的话说出来」，不是替数据下结论。
     ★ 三个判据都只用 A **自己给的数**互相比，不引任何外部数据、不引常识估算：
       ① 同一行三年里，某年与其余年份的中位数差 100 倍以上；
       ② 某年的值换算成亿元会显示成 0.00，而这家公司总资产在 10 亿元以上
          （资产负债表科目不可能是「17 元」这种量级）；
       ③ 跨行恒等式：营业成本 > 营业收入，或总负债 > 总资产（同一年）。
     判据 ①③ 是纯比较，阈值只有 100 倍这一个；判据 ② 是最保守的一条，
     只在「资产负债表科目 + 公司规模 ≥10 亿 + 值 < 100 万元」三条同时成立时触发。
     **三个判据都只产出一个标记，不产出任何数值** —— 这是 E 能做的极限。 */

  var SUSPECT_MIN_YUAN = 1e6;      // 100 万元：小于它、又不是 0，就是量级不对
  var SUSPECT_SCALE_YUAN = 1e9;    // 10 亿元：公司规模下限，用来否掉「这家本来就很小」
  var SUSPECT_TIMES = 100;         // 同一年列内相差 100 倍

  /* 一行自己的三年：给一行找可疑的年份，返回 { "2023": "理由", ... } */
  function suspectYearsByMagnitude(series, totalAssets) {
    var out = {};
    var yrs = ["2023", "2024", "2025"];
    var vals = yrs.map(function (y) {
      var v = series ? F.fmt.toNum(series[y]) : null;
      return v;
    });
    var nz = vals.filter(function (v) { return v !== null && v !== 0; })
                 .map(function (v) { return Math.abs(v); })
                 .sort(function (a, b) { return a - b; });
    var med = nz.length ? nz[Math.floor(nz.length / 2)] : null;

    yrs.forEach(function (y, i) {
      var v = vals[i];
      if (v === null || v === 0) return;
      var a = Math.abs(v);
      if (med !== null && nz.length >= 2 && (a > med * SUSPECT_TIMES || a < med / SUSPECT_TIMES)) {
        out[y] = "与同一行其余年份相差 " + SUSPECT_TIMES + " 倍以上，量级不对";
        return;
      }
      /* 判据 ②：换算成亿元是 0.00，而这家公司是十亿量级 —— 多半是 A 把
         「占比」那一列当成了金额（茅台货币资金 17.01 就是这么来的）。 */
      if (a < SUSPECT_MIN_YUAN && totalAssets !== null && Math.abs(totalAssets) >= SUSPECT_SCALE_YUAN) {
        out[y] = "只有 " + a + " 元，对这家公司的体量来说量级不对";
      }
    });
    return out;
  }

  /* 跨行恒等式：一年一年地查。返回 { 年份: { 键: 理由 } } */
  function suspectByIdentity(fin) {
    var out = {}, rev = fin.revenue, cost = fin.operating_cost,
        ta = fin.total_assets, tl = fin.total_liabilities;
    if (!rev || !cost || !ta || !tl) return out;
    ["2023", "2024", "2025"].forEach(function (y) {
      function g(f) {
        var v = f.series ? F.fmt.toNum(f.series[y]) : null;
        if (v === null && y === "2025" && f.status === "found") v = F.fmt.toNum(f.value);
        return v;
      }
      var r = g(rev), c = g(cost), A = g(ta), L = g(tl);
      if (r !== null && c !== null && r > 0 && c > r) {
        out[y] = out[y] || {};
        out[y].operating_cost = "营业成本 " + yi(c) + " 高于营业收入 " + yi(r) + "（亿元）";
        out[y].revenue = out[y].revenue || "营业收入低于营业成本（亿元）";
      }
      if (A !== null && L !== null && A > 0 && L > A) {
        out[y] = out[y] || {};
        out[y].total_liabilities = "总负债 " + yi(L) + " 高于总资产 " + yi(A) + "（亿元）";
        out[y].total_assets = out[y].total_assets || "总资产低于总负债（亿元）";
      }
    });
    return out;
  }

     index.html 少引一行 a/data/metrics.js，这一页该说「A 的数据没接上」，
     而不是留一片空白让人以为是 E 没做。 */
  function aReady() {
    return !!(window.FinSearch && window.FinTok &&
              window.FINSCOPE_MANIFEST && window.FINSCOPE_METRICS);

  function findMeta(code) {
    var man = manifest();
    if (!man || !man.shards) return null;
    for (var i = 0; i < man.shards.length; i++) {

     ------------------------------------------------------------------------
     ★ 为什么是**读** D 的 ticker 而不是写死 "600519"：
       写死会把「D 哪天多交付一家、或换了一家」变成一处**沉默的失配** ——

       而 A 的 FINSCOPE_METRICS 用裸代码 "600519" 作键。两边不是同一个串，
       必须先归一才能比。 */
  function dCompanyCode() {
    var t = (F.data && F.data.get) ? F.data.get("company.ticker") : null;

  /* 分片按需加载                                                          */
  /* ==================================================================== */

  /**
   * 注入一家公司的分片（1.2–2.2 MB），返回已 prepare 好的 shard。
   *
   * ★ 为什么是 document.createElement('script') 而不是 fetch：
   *   file:// 下 fetch 本地 .js 会被 CORS 拦掉，<script> 注入不受限。
   *   这正是 A 的原页面能在 file:// 下跑起来的原因（a/README.md ①）。
   *
   * ★ 为什么不让 app.js 直接 promise-cache 进 window.FINSCOPE_SHARDS 就完事：
   *   FinSearch.prepare() 会建词表与向量索引，那是 17 MB 里最贵的一步。
   *   每家只 prepare 一次，重问不重算 —— 所以这里另开一个 prepared 表，
   *   而不是每问一次就 prepare 一遍。
   */
  function loadShard(code) {
    if (prepared[code]) return Promise.resolve(prepared[code]);
    if (pending[code]) return pending[code];

    var meta = findMeta(code);
    if (!meta) return Promise.reject(new Error("a/data/manifest.js 里没有 " + code));

    var p = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = aBase() + "data/" + meta.file;
      s.onload = function () {
        var store = window.FINSCOPE_SHARDS || {};
        if (!store[code]) {
          /* 文件下下来了，但没有挂上 FINSCOPE_SHARDS —— 那是 a/search.js
             的 `global.FINSCOPE_SHARDS = global.FINSCOPE_SHARDS || {}` 没跑到，
             或者拿到的分片文件名对不上。这是**真故障**，不能吞掉。 */
          reject(new Error("分片已读入但没有挂上 window.FINSCOPE_SHARDS"));
          return;
        }
        prepared[code] = FinSearch.prepare(store[code]);
        resolve(prepared[code]);
      };
      s.onerror = function () { reject(new Error("分片文件读不到：" + meta.file)); };
      document.head.appendChild(s);
    });

    pending[code] = p.then(
      function (r) { delete pending[code]; delete shardErr[code]; if (onScopeChange) onScopeChange(); return r; },
      function (e) { delete pending[code]; shardErr[code] = e.message; if (onScopeChange) onScopeChange(); throw e; }
    );
    if (onScopeChange) onScopeChange();
    return pending[code];
  }

  function loadAll() {
    var man = manifest();
    if (!man || !man.shards) return Promise.resolve();
    return Promise.all(man.shards.map(function (s) {
      return loadShard(s.code).catch(function () { return null; });   // 单家失败不拖垮其余
    }));
  }

  function loadedCodes() {
    return Object.keys(prepared).sort();
  }

          var todo = need.filter(function (c) { return !prepared[c]; });
          clear(refs.qaStatus);
          if (todo.length) {
            refs.qaStatus.appendChild(ui.el("span", "qa-hint",
              todo.length === need.length
                ? ("这道题要读入 " + todo.length + " 家年报正文" +
                   (todo.length > 3 ? "（约 17 MB，首次会慢几秒）" : "") + "…")
                : ("这道题要读入 " + todo.length + " 家年报正文…")));
          }
          ensureScopeFor(p.q).then(function () { runQuery(p.q); });
        });
        row.appendChild(b);
      });
      refs.presetRow = row;
      box.appendChild(row);

      /* ---- 提问框 ---- */
      var form = ui.el("form", "qa-form");
      var input = ui.el("input", "qa-input");
      input.type = "text";
      input.placeholder = "也可以自己问一句，例如「存货跌价准备怎么计提的」";
      input.setAttribute("aria-label", "对年报正文提问");
      refs.qaInput = input;
      form.appendChild(input);

      var go = ui.el("button", "btn btn-primary", "提问");
      go.type = "submit";
      form.appendChild(go);
      form.addEventListener("submit", function (e) {
        e.preventDefault();

      /* ---- 检索状态 ---- */

      /* 分词器一致性自检。A 的 tokenize.js 必须与 Python 侧逐字一致，
         不一致则 BM25 词表整体错位、检索结果不可信 —— 这比「答得不准」
         严重得多，所以挂一条看得见的判定，而不是只在控制台打个日志。 */
      if (window.TOKENIZER_GOLDEN && FinTok.checkGolden) {

      if (man && man.index_version) {
        box.appendChild(ui.el("p", "qa-meta",
          "索引 " + man.index_version + " · 分词 " + man.tokenizer_version +
          " · 向量 " + (man.embedder_version || "?") +
          " · 语料共 " + (man.shards || []).reduce(function (a, s) { return a + s.n_chunks; }, 0) +
          " 个块（" + (man.shards || []).length + " 家年报）"
        ));

      box.appendChild(ui.note(
        "检索范围 = 已载入的公司（见上方看板的载入状态）。分片按需读取，" +

      if (cs) {

  function handleFile(file) {
    var out = refs.uploadResult;
    if (!out) return;
    clear(out);

    if (!file) {
      picked = null;
      return;
    }

    var name = file.name || "(没有文件名)";

    /* 两道校验。accept=".pdf" 只过滤**选择框**里的条目，
       拖进来的文件它管不着，所以类型必须在这里再判一次。 */
    if (!/\.pdf$/i.test(name) && file.type !== "application/pdf") {
      picked = null;
      out.appendChild(ui.note("这不是 PDF：「" + name + "」。这一格只收 .pdf。", "warn"));
      return;
    }
    if (file.size > MAX_BYTES) {
      picked = null;
      out.appendChild(ui.note(
        "「" + name + "」有 " + mib(file.size) + "，超过 50 MB 上限。" +
        "年报 PDF 一般 3–15 MB，先确认一下是不是扫错了文件。", "warn"));
      return;
    }

    picked = file;

    /* 通过校验 → 出文件卡。显示的四项都是 File 对象上**真的有**的属性，
       没有一个是我们自己编出来的。 */
    var cardBox = ui.el("div", "file-card");
    var top = ui.el("div", "file-top");
    top.appendChild(ui.el("span", "file-badge", "PDF"));
    top.appendChild(ui.el("span", "file-name", name));
    cardBox.appendChild(top);

    var meta = ui.el("div", "file-meta");
    meta.appendChild(ui.el("span", null, "体积 " + mib(file.size)));
    meta.appendChild(ui.el("span", null, "最后修改 " +
      new Date(file.lastModified).toLocaleString("zh-CN")));
    meta.appendChild(ui.el("span", null, "类型 " + (file.type || "未标明")));
    cardBox.appendChild(meta);

    var foot = ui.el("div", "file-foot");
    foot.appendChild(ui.el("span", "file-verdict",
      "✓ 类型与体积都通过 —— 校验到此为止，文件没有离开这台机器"));
    var rm = ui.el("button", "btn-link", "移除");
    rm.type = "button";
    rm.addEventListener("click", function () {
      picked = null;
      clear(out);
      var inp = refs.uploadResult && refs.uploadResult.parentNode
        ? refs.uploadResult.parentNode.querySelector(".upload-input") : null;
      if (inp) inp.value = "";
    });
    foot.appendChild(rm);
    cardBox.appendChild(foot);

    out.appendChild(cardBox);
  }
