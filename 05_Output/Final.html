/* ================= css/base.css ================= */
/* ============================================================================
 * base.css —— 设计令牌 + 归零
 * ----------------------------------------------------------------------------
 * 全站唯一的调色板和字号表。任何页面不许写死颜色值，一律用 var(--xxx)。
 * 改这里 = 改全站。
 *
 * 【两套颜色系统，不要混用】
 *   1. 健康度 status（本项目主色调）
 *      good 绿  /  watch 橙  /  bad 红   —— 表示财务指标好不好
 *      （2026-10-12 改版：watch 由黄 #c9922f 换成橙 #e2761e，
 *        同时橙成为**全站唯一暖色**，兼任全站的强调色。一色一义。）
 *   2. 涨跌 tone（备用）
 *      up 红    /  down 绿              —— A 股惯例，表示数值方向
 *   两套系统里红色含义相反（危险 vs 上涨），同时出现会让人懵。
 *
 * 【使用范围（2026-10-10 定案，不要擅自扩大）】
 *   status：全站主色系统。风险、诊断、概览一律用它。
 *           **页面 5 估值分析是全站唯一不用 status 的页**（2026-10-12 定案）。
 *           理由两条：① 估值区间没有好坏 —— 区间宽表示两法分歧大，那是
 *           **信息**不是缺陷（页面 5 定案原话：「分歧本身就是个值得讲的发现」）；
 *           ② 该页主题就是价格，绿 / 红在那里会被直接读成**涨跌**，
 *           恰恰是最容易踩中上面那条「红绿双义」禁忌的地方。
 *           结论块改用主色（`--c-primary`，改版后是灰蓝）。**这是定案，不是遗漏** ——
 *           审计工具 ②矩阵 里页面 5 的 status 一格是 0，属预期值。

 *   tone  ：**当前全站零使用 —— 六页都不用**。
 *           页面 2 曾计划给三个大数配同比涨跌色，定案时否掉了：那张卡的顶边和
 *           右上角健康度标签已经在用 status 色，再加一套红涨绿跌，同一张卡上
 *           红色会同时表示「上涨」和「差」。同比归页面 3 的成长性维度讲。
 *           页面 4/5 的数字是水平值（应收账款 38.7 亿元、估值 18.9 元/股），
 *           不是涨跌，用红=高风险表达「这一项把风险推高」才准确。
 *           三件套（.tone-up / .tone-down / .tone-flat 与 fmt.tone /
 *           fmt.signedPercent）保留待用：真要做多期趋势图时它们才派得上。
 *           一旦启用，必须配 ↑↓ 箭头，且不得与 status 同屏。
 *
 * 【--c-accent 不存在的历史（2026-10-12，必读）】
 *   曾有一个 --c-accent: #c9922f，与 --c-watch 同色。它把「名字写着强调、
 *   实际是需关注黄」的陷阱摆进颜色表里 —— 页面 6 目标价就这么被涂成过黄卡色，
 *   是本项目唯一一处自己踩自己约定的地方。当天删掉了。
 *   同日的改版把 watch 从黄换成橙、并让橙兼任全站唯一的强调色，
 *   于是**看起来又需要 accent 了**。但做法不是把名字加回来，而是:
 *   橙只有一个令牌名 --c-watch，语义统一在「需要你注意」这一件事上
 *   （status 的 watch、.sev-attention、唯一暖强调，其实是同一语义的三种外形）。
 *   要「比主色更重的强调」用 --c-primary-dark；要给大数压场用 --c-ink。
 *   **仍然不要把它加回来。**
 *
 * 【零重值不变式】
 *   :root 里**没有任何两个颜色令牌的值相同**。tests/render.test.js 有一条断言
 *   直接查这件事 —— 它守的就是上面那个 --c-accent 的坑，防止将来复活。
 * ==========================================================================*/

/* --------------------------------------------------------------------------
   1. 设计令牌
   -------------------------------------------------------------------------- */
:root {
  /* 【2026-10-12 改版定案：主色调 = 灰蓝 / 黑 / 橙，三色分工】
     起因：页面 4 有 13 处、页面 5 有 10 处都用同一个蓝，什么都是蓝等于什么都没强调。
     原话是「一堆没有分辨度的数据让人没有仔细看的耐心」。
     现在三色各有各的活，**不要串用**：
       灰蓝 --c-primary*  → 结构 / 可点 / 参考（导航、链接、浮层、估值标尺）
       黑   --c-ink       → 内容焦点（品牌字、要读的那个大数）
       橙   --c-watch*    → 强调 = 可行动 + 需关注。**全站唯一暖色**
     预算是橙的命根子：**每屏最多 1–2 处橙**。橙多了就退回改版前的「没有分辨度」。

     ★ 橙的语义在 2026-10-12 第二轮**扩宽过一次**（同日更早的版本里它只做警报色）：
     反馈是「我选择橙色作为主色的意思，是希望部分按钮等可以是橙色」。
     回头看，把橙钉死在「需关注」上会让它只在数据出错时出现 ——
     页面 2 这种浏览型页面永远一处橙也没有（status 字段全在 ratios 里，
     而那是页面 3 的数据）。参考图 2 里的橙本来也是品牌 / 行动色。
     所以现在是「强调」，但**预算不变**：主按钮 + 数据说要看的地方，
     其余照旧退回灰蓝和墨色。 */

  /* 灰蓝：结构 / 可点 / 参考 */
  --c-primary:        #4a6785;
  --c-primary-dark:   #35506b;
  --c-primary-soft:   rgba(74, 103, 133, 0.10);
  /* 主色浅底「重」一档。原先 .vr-band / .vr-bar / .vr-legend-key /
     .popover-open:hover 四处各写一遍 rgba(47,111,184,…)，透明度还三样都有，
     收成一个令牌。**这两个是深浅两档，不是同一个值**，见下方「零重值」不变式。 */
  --c-primary-soft-2: rgba(74, 103, 133, 0.18);
  /* 压在实底上的白字。用在 .btn-primary（**橙实底**）、.sug-tag（灰蓝实底），
     以及**深色侧边栏**（.nav 的导航文字、当前项、品牌字）。
     原来是各自写死的 `color: #fff`，收成令牌后「颜色零裸值」才查得干净。
     ★ 2026-10-13 第十轮：橙面（主按钮 / 关注胶囊 / 待核验胶囊）上的字
       也归到这里 —— 白就是这一档，不再为橙另开一个令牌。
       代价是橙底只有 2.29:1（低于 AA），取舍的完整理由见下面 --c-watch 的第十轮 ①。 */
  --c-on-primary:     #ffffff;

  /* 黑：内容焦点，兼**深色侧边栏的底**。
     __作为文字__：五维得分大数、页面 6 的评级与目标价 —— 凡是「要读的那个数」。
     它「响而不着色」：能重复出现而不变噪，这正是彩色做不到的。
     __作为底面__：2026-10-12 第二轮起，.nav 用它当底色（侧栏改黑底白字）。
     一个值两个角色（字 / 面）不算重复 —— 「零重值」不变式管的是
     两个**令牌**同值，不是禁止一个令牌被用两次。
     ★ 主按钮同日从这里改成橙了，见 css/components.css §7；
       品牌字也从这里改成反白 --c-on-primary（它压在黑侧栏上了）。 */
  --c-ink:            #0f151d;

  /* 橙：全站唯一暖色 / 强调（可行动 + 需关注） */
  /* 接替原来的 --c-watch: #c9922f（黄）。
     **令牌名不改成 --c-accent**：整套语义都在用 watch 这个词 ——
     数据字段 `status: "watch"`、类名 .is-watch / .st-watch / .sev-attention。
     改名会重新造出「名字写着强调、实际是需关注」那种陷阱，
     正是当初删掉 --c-accent 的原因（见文件尾部的历史说明）。

     ★ 2026-10-13 第七轮改定：**色号按她指定的 #fa9205 重定（色相 34.5°）。**
     第六轮把橙提亮到 #f2831a（色相 29°）之后她仍指定了具体色号，
     所以这一轮不再自己挑亮度，直接采用她给的值，**并让配对深档同色相**：
       ① --c-watch = #fa9205（色相 34.5°，饱和度 96%）—— 就是她给的那个橙；
       ② --c-watch-ink = #aa6300（色相 **34.9°**，饱和 100%）——
          与 ① 几乎同一色相，是**这个色相上还能达 AA 的最鲜艳值**（白底 4.67:1）。
     上一轮踩过的坑仍然是这条：**深档必须和亮档同色相**，
     否则「亮橙条」和「深褐按钮」又会被读成两种橙。
     核对方式（改色号时照做）：把两个值都换算成 HSL，色相差应 < 1°。

     还有一条更管用的：**凡是「橙面」现在一律走 --c-watch**，
     主按钮、待核验胶囊、关注胶囊这三处最显眼的橙**和色条是同一个值**，肉眼不再分裂。
     —— 但「字用什么」这一半在第九轮被推翻了，见下面的 ③。

     ⚠️ 硬件约束（别再试了）：**橙越亮，当白底小字越差。**
       #fa9205 白底只有 **2.29:1**（比上一轮还低），连大字号的 3:1 都够不着；
       想「又亮又能当白底小字」在这套底色上无解 —— 这是算术，不是调参。
       所以 --c-watch-ink 这一档**只能留给白底橙字**（.is-watch / .warn-title），
       不能再扩散。**令牌名保留**，因为语义仍然分得清：
         --c-watch     面：画线 / 填充 / 色条 / 实底按钮 / 实底胶囊
         --c-watch-ink 只能当**字**，且只能在浅底上

     ★ 2026-10-13 第九轮（**已被第十轮推翻，留作过程记录**）：
     她否掉「橙面 + 墨黑字」，原话「现在橙色和黑色的按钮色彩搭配的很不好」。
     量因是色相不是明度：#fa9205 色相 **34.5°**，#0f151d 色相 **214.3°**，
     相差 **180°**，是色轮正对面 —— 一对互补色同处一块不大的色块上，
     读起来像**警示标签**（黄黑条纹就是这对）。当时的新增令牌
     `--c-watch-on: #502e00`（同色相压暗档，橙底 5.30:1）在第十轮被删掉了。

     ★ 2026-10-13 第十轮改定：**橙面上的字一律换成白（--c-on-primary）。**
     反馈原话：「**橙色按钮/标注的内部字体换成白色**」。
     这一轮的结论有两层，第二层是主要的：

     ① 决定用白。白字压在 ① 上的实测对比是 **2.29:1**（hover 压暗后 2.13:1），
        **低于 WCAG AA 的 4.5:1** —— 这是**知情的取舍**，不是漏算。
        取舍的理由：白在她这套 UI 里是「实底上的字」的既有语义
        （`--c-on-primary` 本来就是干这个的，见下面那条），
        12–14px 加粗白字压在饱和橙面上是行业里最普遍的橙色按钮长相，
        实机看过（1600 宽 ×3 放大）可读。**不要再把 2.29:1 当 bug 修** ——
        想「修好」它只有一条路：把橙面压深到 L ≤ 0.183，
        而那条路会撞上下面 ③ 记的坑（橙会掉成褐色，且按钮橙与色条橙分裂）。

     ② 顺带**删掉了 --c-watch-on**：白字不需要新令牌 ——
        `--c-on-primary`（纯白）的既有角色就是「压在实底上的白字」，
        第九轮那个专用令牌现在没有用户了，留着就是死令牌。
        家族从 6 个回到 5 个，「面 / 字」分工的结构不变：
         --c-watch     浅底上的**面**（画线 / 填充 / 色条 / 实底按钮 / 实底胶囊）
         --c-watch-ink 浅底上的**字**（.is-watch / .warn-title，白底 4.67:1）
         橙面上的**字** → 用 `--c-on-primary`（白），不再是橙的深档

     ⚠️ 硬件约束（第十轮重申）：**「橙够亮」和「橙面配白字达 AA」不能同时要。**
       ① 在 ① 上要够 4.5:1，① 的相对亮度必须 ≤ 0.183，那样得到的橙是
       `#b35f00` 这一带的**褐色**（4.61:1），她第七轮指定 #fa9205、
       第六轮要求「全篇只有一个橙」，都会被它推翻。实机对照过（见
       docs/E_PAGE_SPEC.md §2c），结论是维持 ① 不动、接受 2.29:1。

     核对方式（改色号时照做）：
       ① 换算成 HSL，② 与 ① 色相差应 < 8°（这条没变，仍由测试钉着）；
       ② 橙面上的字必须是 `--c-on-primary`，且 ① 必须仍是 #fa9205 ——
          一旦有人为了凑对比把 ① 压暗，「按钮橙」和「色条橙」就会裂成两种。
       实测：白 on #fa9205 = **2.29:1**（低于 AA，见 ①）。 */
  --c-watch:          #fa9205;
  --c-watch-ink:      #aa6300;
  --c-watch-bg:       rgba(250, 146, 5, 0.12);
  --c-watch-bg-2:     rgba(250, 146, 5, 0.20);
  --c-watch-bg-3:     rgba(250, 146, 5, 0.03);

  /* 健康度另外两色（status 系统） */
  --c-good:           #3f8f6b;
  --c-good-bg:        rgba(63, 143, 107, 0.10);
  --c-good-bg-2:      rgba(63, 143, 107, 0.20);
  --c-good-bg-3:      rgba(63, 143, 107, 0.03);
  --c-bad:            #bb463b;
  --c-bad-bg:         rgba(187, 70, 59, 0.10);
  /* ---- x-bg-2 / x-bg-3：三个等级各自的**透明渐变两端**（页面 4 风险卡）----
     ★ 2026-10-12 第二轮，红先落地：原来它从 --c-bad-bg 渐变到 --c-glass-strong
     （白玻璃），是**跨色相**的（红 → 白），叠在灰蓝底上就脏了。反馈原话：
     「高风险卡片的渐变很不自然，可以直接改成深红色透明渐变，不用刻意和底色做融合」。
     改成只在**同一色相**里走透明度：起 -2 浓（20%）→ 终 -3 几乎退净（3%），
     再叠在玻璃白底上 —— 不需要「融进」任何东西。

     ★ 2026-10-12 第四轮，橙 / 绿补齐：反馈「统一改为预警严重程度下对应的
     红/橙/绿透明渐变毛玻璃效果」。三个等级现在走同一套端点，只是色相不同，
     所以风险卡的外观只由 severity 一个变量决定。**-2 一律 20%、-3 一律 3%**，
     三色浓度必须完全一致 —— 哪一色更浓，读者就会以为那一级更严重。
     这是「一色一义」之外的第二条：**同级不同色，浓度必须齐平**。 */
  --c-bad-bg-2:       rgba(187, 70, 59, 0.20);
  --c-bad-bg-3:       rgba(187, 70, 59, 0.03);

  /* 涨跌两色（tone 系统，谨慎使用） */
  --c-up:             #bb463b;   /* A 股：红涨 */
  --c-down:           #3f8f6b;   /* A 股：绿跌 */

  /* 中性色 */
  --c-text:           #1e2530;
  --c-text-2:         #4c5666;
  /* 12px 注解（出处链接 / 单位 / 刻度 / 脚注）的颜色。
     原 #8a929e 在白底上只有 2.9:1。这是**内容**不是装饰，所以提到 4.3:1。 */
  --c-text-3:         #6a7484;
  --c-line:           #dfe4ec;
  --c-line-soft:      #eaeef4;

  /* 面。改版后三个「面」各有各的岗位，不要混：
       --c-bg        只剩「兜底实色」一个职责（渐变基色 / 降级 / 打印）。
                     画面本身由 css/layout.css 的 body::before 提供。
       --c-surface   **实底白**：卡内底板、打印、以及不支持 backdrop-filter 时的降级面。
                     ★ 它不再是卡片的背景 —— 卡片的背景是下面的 --c-glass。
       --c-surface-2 卡内的浅色块。★ **必须是半透明**：
                     它用在 .kv-cell / .note / .ratio-row:hover / .popover-foot，
                     这些全在玻璃**之内**。不透明的话会在磨砂卡上贴出一块块补丁。 */
  /* ★ 2026-10-12 第二轮：底色走过的弯路，留在这里免得再走一遍。
     起点是原始反馈「卡片看不出来是玻璃卡」。算账：卡片 rgba(255,255,255,0.60)
     压在旧中停 #f2f6fb 上合成 rgb(250,251,253) —— 和背景**只差 3%**。
     白玻璃压近白底，看不见是必然的。玻璃的前提是「背后有东西可以透过来」，
     而旧渐变末停 #fbfcfe 几乎就是纯白，内容区背后什么都没有。
     第一版矫枉过正压到 #bccbe0 / #cfdaea，反馈是「底色太深了，背景太平」。
     ★ 结论：**深浅要尽量浅，层次靠柔光补，不靠加深底色。**
     现值让卡片与背景差 ~5.5%（还看得出是玻璃卡，但已经接近下限）。
     ⚠️ 深浅和「玻璃看不看得见」是一对矛盾：底色越浅，色差越小，玻璃越隐形。
        如果哪天觉得玻璃又看不出来了，往上调这一组，而不是去动 --c-glass。 */
  --c-bg:             #e2e9f4;   /* 兜底实色（渐变没渲染出来时才用得到） */
  --c-bg-1:           #dbe4f0;   /* 斜向渐变：起（左上，灰蓝） */
  --c-bg-2:           #e8eef7;   /* 中停 */
  --c-bg-3:           #f4f8fc;   /* 末停（右下） */
  /* 两团**白色**柔光（不是橙 —— 橙曾经在这里，2026-10-12 删掉，
     见下方说明）。它们解决的是「背景太平」：纯线性渐变没有任何光照层次，
     而 backdrop-filter 模糊一个平滑渐变本来就什么也看不出来。
     柔光给背景造出明暗起伏，玻璃卡跨过起伏时才有「透光」可言。
     ★ 用白色而不是橙：白不改色调，也不占用「强调色」的名额。 */
  --c-sheen:          rgba(255, 255, 255, 0.62);
  --c-sheen-2:        rgba(255, 255, 255, 0.34);
  /* ★ 这里**没有**光晕令牌 —— 2026-10-12 第二轮曾有两团橙光晕
     （--c-glow / --c-glow-2，一度提到 alpha 0.20 / 0.14），同日删掉。
     反馈原话：「底色的橙色有点脏，我说的橙色作为主色是用在按钮里，不是用在背景色中」。
     这条是对的，而且理由比「好不好看」更硬：**橙的语义是「强调」，
     背景里铺一层橙，等于把橙稀释成底色** —— 满屏都是橙，橙就不再稀缺，
     「橙 = 可行动 / 需关注」立刻失效。一色一义的前提是这一色**限量**。
     删掉之后玻璃照样看得见：靠的是渐变本身的色差（见下面三个 --c-bg-*）
     和白色描边，不需要靠光晕。 */
  --c-surface:        #ffffff;
  /* ★ 2026-10-12 第二轮从 rgba(240,245,251,0.66) 改成偏深的蓝灰。
     它是「卡内的浅色块」（.kv-cell / .note / .ratio-row:hover / .popover-foot），
     而卡内所有东西都压在玻璃之上。旧值合成出来比玻璃卡只深 6.5 ——
     背景压深之后更是只剩 2.6，**这些块会集体隐形**。
     新值让它比玻璃卡深 ~14，在白底（降级/打印）上深 ~25，两边都立得住。 */
  --c-surface-2:      rgba(210, 222, 238, 0.55);

  /* 玻璃（悬浮卡片）。
     alpha 必须 < 1 否则 blur 看不见。0.60 跟着 2026-10-12 第二轮的深背景一起定：
     在 #cfdaea 底上合成 rgb(236,240,247)，与背景差 ~11% —— 一眼能看出是玻璃卡。
     **不嵌套玻璃**：玻璃里再放玻璃会互相取样，又难看又贵，卡内一律用底板/底纹。 */
  --c-glass:          rgba(255, 255, 255, 0.60);   /* 稀疏内容卡 */
  --c-glass-strong:   rgba(255, 255, 255, 0.82);   /* 载数据的壳：把背景透光压到 18% */
  /* 玻璃描边。玻璃的「边」是光不是墨 —— 用灰线会把它压回一张普通卡片。 */
  --c-glass-line:     rgba(255, 255, 255, 0.70);
  --glass-blur:       blur(16px) saturate(1.4);

  /* ---- 深色侧边栏上的字（2026-10-12 第二轮：侧栏改黑底白字）----
     侧栏底色直接用 --c-ink（那个「最深的墨」），不另开一个几乎同值的黑 ——
     那样会撞上「没有任何两个含义不同的令牌同值」这条不变式。
     主文字也用现成的 --c-on-primary（它就是「压在实底上的白字」），
     另外三档是「白的不同透明度」，值互不相同：
       -2    次级文字（品牌副标题 / 导航副标题 / 页脚数据源）
       -3    最弱一档（导航序号 / 页脚状态）
       soft  悬停底；soft-2 当前项底 —— 都靠白色叠出来，不引入第二种色相。 */
  --c-on-dark-2:      rgba(255, 255, 255, 0.72);
  --c-on-dark-3:      rgba(255, 255, 255, 0.50);
  --c-on-dark-soft:   rgba(255, 255, 255, 0.10);
  --c-on-dark-soft-2: rgba(255, 255, 255, 0.18);

  /* 比例条（页面 2 的主要财务数据表）。
     ★★ **令牌名和「不许用暖色」这两条都是硬约束**：tests/render.test.js
     直接读 CSS 文本断言 `.fin-bar` 规则里含 --c-bar 且**不含**
     --c-(good|watch|bad|up|down|accent)。把比例条改成橙会当场把测试打红。
     条长只表示「同一张表里的相对大小」，不是评价，也不是涨跌。
     现金流出也不是「坏」—— 负向条用中性灰，方向由零点线左右表达。 */
  --c-bar:            rgba(74, 103, 133, 0.34);
  --c-bar-neg:        rgba(88, 100, 120, 0.34);

  /* 字号阶梯
     【2026-10-12 定案：13px 这一档已拆掉，不要再加回来】
     起因：「一堆没有分辨度的数据让人没有仔细看的耐心」。用
     `node tools/layout-audit.js` 量出来，问题不在装饰不够，在**阶距不够** ——
     原 12 / 13 / 14 / 16 相邻只差 1.083 / 1.077 / 1.143，低于肉眼能分辨的 ≈1.14，
     四级读成一级。改法是**拆用法**（分析性正文 → 14，参考性注解 → 12），
     不是改数值：中文在 12–16 之间只有 4px 可用余量，硬拉要把整条阶梯上移，
     代价是每一处密排都要重排。
     现在的阶梯是 12 / 14 / 16 / 20 / 26 / 34，相邻比 1.167 / 1.143 / 1.250 /
     1.300 / 1.308 —— 全部过线。1.143 是 16 与 14 那一档，差 2px，且这两级
     常配不同字重（如 .fin-block-name 16/600 对表体 14/400），读得出。
     判读的线是 **1.14 不是 1.15**：真正读不出的是原来 13→12 的 1.083（只差 1px）。
     判「14 还是 12」的界：**分析性正文（读的）→ 14，参考性注解（查的）→ 12**，
     四条对照见 docs/E_PAGE_SPEC.md 页面 5 定案 8。
     收尾后全站 font-size **零裸值**（唯一一处脱档的页面 1 上传箭头已改走
     下面的 --icon-lg）。 */
  --fs-xs:            12px;
  --fs-md:            14px;
  --fs-lg:            16px;
  --fs-xl:            20px;
  --fs-2xl:           26px;
  --fs-3xl:           34px;

  /* 图形尺寸
     用文字字形画的图形（目前只有页面 1 的上传箭头 .upload-icon）。
     它**不是字号** —— 40 是「画成这样好看」，与文字层级无关，所以不挂在上面的
     阶梯里：挂上去的话，将来动 --fs-3xl 会把这个图标一起带走。
     放在这里是为了让「全站 font-size 全部走令牌、零裸值」这条不变式成立。 */
  --icon-lg:          40px;

  /* 间距 */
  --sp-1:             4px;
  --sp-2:             8px;
  --sp-3:             12px;
  --sp-4:             16px;
  --sp-5:             24px;
  --sp-6:             32px;
  --sp-7:             48px;

  /* 圆角与阴影 */
  --radius-sm:        4px;
  --radius:           8px;
  --radius-lg:        12px;
  /* 面板圆角（2026-10-12 新增）：只给**整屏两块面板**用。
     --radius-lg 的 12px 是给卡片定的，铺到 100vh 高的面板上折角会显得很方，
     所以单独开一档 20px。**只有 .nav 和 .main 用它**，卡片一律不用 ——
     一档尺寸一个用途，混用会让「大圆角 = 面板」这个信号失效。 */
  --radius-xl:        20px;
  /* 胶囊：标签 / 芯片 / 色条两端。6 处原先各写一遍 999px。 */
  --radius-pill:      999px;
  /* 正圆：状态点 / 刻度圆点。50% 是「取盒子的一半」，不是挑了一个尺寸 ——
     但立成令牌之后「border-radius 零裸值」这条才没有例外。 */
  --radius-circle:    50%;
  /* 阴影：改版时**颜色冷化 + 扩散放大**。
     原值 rgba(20,30,45,…) 发暖，压在冷灰蓝画面上发脏；扩散也偏小，托不住「悬浮」。
     改版后卡片要浮起来，所以给到 0 6px 18px 这一档。 */
  --shadow-sm:        0 1px 2px rgba(24, 38, 58, 0.06);
  --shadow:           0 6px 18px rgba(24, 38, 58, 0.10);
  --shadow-lg:        0 16px 40px rgba(24, 38, 58, 0.16);
  /* 玻璃卡顶部那道 1px 白色高光。**只靠投影的玻璃看起来像塑料片** ——
     这条给的才是「有厚度」的感觉，和 --shadow 一起用。 */
  --shadow-inset:     inset 0 1px 0 rgba(255, 255, 255, 0.65);

  /* ---- 字体（2026-10-12 第三轮：换字族，字号阶梯一个不动）----
     ★ 反馈原话：「现在网页用的是什么字体，我觉得这个字体有点太刻板了」。
       改之前先把「到底在渲染什么」查清楚 —— 结论和看起来的不一样：

         中文 = Microsoft YaHei
         数字 = **Arial**   ← 这行本来是个 bug。--font-num 首选 "DIN Alternate"，
                那是 macOS 独有字体，Windows 上根本不存在，一路落到 Arial。
                全站 .num / .metric-value / .kv-val / .fin-value
                一直是 Arial 在渲染，DIN 从没生效过。

     ★ 「刻板」的**机械原因不是字形，是字重断档**：
       微软雅黑只有 Light / Regular / Bold 三档，**没有 500 / 600**。
       而全站写了 500 × 10 处、600 × 27 处、700 × 12 处。
       按 CSS 字重回退规则，缺失的 500 取 400、600 取 700，于是这 37 处
       **全部空转**：
         · .nav-title(500) 和正文一样粗；
         · .nav-link.is-active .nav-title(600) 和 .brand-mark(700) 一样粗。
       层级实际只剩 400 / 700 两档硬跳，中间没有过渡 ——
       这才是「一眼看过去全是一个调子」的来源，不是雅黑长得难看。

     ★ 换 Noto Sans SC（**原以为**本机已装、是可变的 100–900 九档）之后，
       上面那 37 处**一个字符都不用改就生效**，500 和 600 各归各位。
       所以这次换字族的第一目的不是「换个字形好看点」，
       是**让已经写好的字重层级真的渲染出来**。
       字形变化（比雅黑更圆、更中性、字面略宽）是顺带的。

       ⚠️ **这一段的前提在 2026-10-13 第五轮被实测推翻**（详见下面 ★★㈠）：
         本机装的是 "Noto Sans SC Medium"/"Light" 两个**单字重**字面，
         "Noto Sans SC" 这个整族名没被注册，所以：
           · 字体没换过 —— 全站中文一直是微软雅黑；
           · 那 37 处 500/600 **到今天仍然空转**，只有 400/700 两档。
         所以「字重断档」这条老账**还没还**，只是原因从「雅黑档位少」
         变成「想要的字体没命中，落回了雅黑」。留下这段原文是为了
         别让下一个人再照着它得出「已经修好了」的结论。

     ★ 回落链是刻意留的保险：
       Noto Sans SC 是「本机装了才有」的字体。演示机若没有，自动落到
       Microsoft YaHei —— **和今天一模一样，不会更差**。
       这符合本项目 file:// 双击打开、不引任何在线字体的硬约束（不能引 webfont），
       所以这里**只能**用系统字体，不要改成引在线字体。

     ★ --font-num 改走 Bahnschrift：Windows 10 起自带的**可变字重 DIN**，
       正是 "DIN Alternate" 的 Windows 正牌同血统字体。
       顺序写 Bahnschrift → DIN Alternate → Segoe UI 而不是倒过来：
       Windows 上取 Bahnschrift，macOS 上 Bahnschrift 缺席、自然落到 DIN Alternate，
       **两边都拿到 DIN，而不是 Arial**。

     ★ 2026-10-13：--font-num 的链尾补上 "Noto Sans SC", "Microsoft YaHei"。
       原来链尾是 Arial → sans-serif，而 Arial 没有汉字 —— 中文只能靠浏览器
       的**字体链接**兜底，Windows 上兜到微软雅黑。于是同一句「元/股」
       在正文里是 Noto、在 .num 里悄悄变成雅黑，两种字形肉眼分得出。
       现在把 CJK 明写在链尾：**整个栈可以安全地套到含中文的格子上**，
       拉丁数字仍取 Bahnschrift，汉字则和全站同一个字体。
       —— 这是下面「表格数字统一走 --font-num」那条能成立的前提，
          少了这一段，给整张表套数字字体会把表里的中文全部换成雅黑。

     ★★ 2026-10-13 第五轮：**数字不再单开字族，--font-num 直接引用 --font-sans。**
       反馈原话：「4. 字体不好看，大小很奇怪，重新调整。」

       先查「到底在渲染什么」，两条都和以为的不一样（headless Chrome 实测，
       量法见 docs/E_PAGE_SPEC.md 的《2026-10-13 定案（第五轮）：字体实测 · 间距加密》）：

       ㈠ **"Noto Sans SC" 在这台机器上根本不存在。**
          ① 与一个假字体名 `"__NoSuchFontZZZ__"` 比宽：拉丁串
             `Wgm1688.38` 两者都是 **595.88px**（小数点后两位都相同），
             → 名字没命中，走的是浏览器默认字体，不是 Noto。
          ② 本机 `C:/Windows/Fonts/` 里确实有 Noto Sans SC，但注册名是
             **"Noto Sans SC Medium" / "Noto Sans SC Light"**（文件就叫
             `Noto Sans SC Medium (TrueType).otf`），"Noto Sans SC" 这个
             整族名**没有被注册**。
          ③ 那么能不能改用 "Noto Sans SC Medium"？**不能。** 实测它
             在 weight 300/400/500/600/700/800/900 下渲染出的**宽度完全一样**
             （互异 1/7）—— 那是**单一字重**的静态字面，不是可变字体。
             换上去会把上面那 37 处 500/600 全部压平，正好毁掉第三轮
             换字族要救的东西。微软雅黑至少还有 3 档（互异 3/7）。
          ⇒ 结论：**这台机器上，全站中文一直是微软雅黑**，第三轮那次
             「换 Noto Sans SC」从未生效过。回落链本身没错（别的机器上
             有真 Noto 时它是对的），错的是「本机已装」这个前提 —— 已改。

       ㈡ **Bahnschrift 是窄体，而且不响应字重。** 这是「大小很奇怪」的真身。
          实测（字号 100px，tabular-nums）：
             · Bahnschrift  `1,688.38` = 364.66px，汉字「贵州茅台」= 400px
               → 数字只有汉字的 **91.2%**，而雅黑是 100.0%、Noto 是 97.2%
             · 数字高 89px，汉字高 94px → 又矮 5%
          两条叠起来：同一行「1,688.38 亿元」里，**数字比它后面的汉字
          既窄一圈又矮一截**，看着像两个不同字号拼起来的 —— 这正是反馈里
          「大小很奇怪」的来源，也是第三轮那个「同一句里两种字形肉眼分得出」
          的老问题没断根。
          更硬的一条：Bahnschrift 在 300–900 七个字重下宽度**也完全一样**
          （互异 1/7），所以 `.metric-value` 的 700、`.fin-value` 的 500
          写在 Bahnschrift 上**一个都没生效**，数字永远一个粗细。

       ⇒ 改法**不是再找一个「更好看的数字字体」**，而是**不再让数字和正文
         用两个字族**。层级改由**字号 + 字重 + 颜色**三样做，不靠换字族 ——
         换字族这条路上，能选到的系统字体没有一款既与中文同高、又能分字重。
         直接写 `var(--font-sans)` 而不是抄一份一样的字体栈：
         抄一份的话这两个令牌就永久同值，将来改 --font-sans 会漏掉数字，
         正是本项目「零重值」那条不变式要防的事。

       ⚠️ 副作用（已知并接受）：`--font-num` 的**令牌名保留**——
         `.num / .metric-value / .kv-val / .fin-value / .ratio-value / .calc-eq`
         六组选择器还在引用它（见 base.css 文件尾），删令牌要一起改六处，
         而它现在仍然表达一个真意思：「**这几处要表格数字对齐**」。
         真正的对齐保证在下一条 `font-variant-numeric: tabular-nums` 上，
         那是与字族无关的。 */
  --font-sans:        "Noto Sans SC", "Microsoft YaHei", "PingFang SC",
                      "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
  /* 数字 = 正文同一字族。改这一行就能让数字单独换族，但请先读完上面 ㈠㈡。 */
  --font-num:         var(--font-sans);

  /* 尺寸 */
  --nav-w:            248px;
  --content-max:      1080px;
}

/* --------------------------------------------------------------------------
   2. 归零：抹掉浏览器默认样式，避免不同浏览器长得不一样
   -------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: 1.65;
  color: var(--c-text);
  background: var(--c-bg);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  margin: 0;
  font-weight: 600;
  line-height: 1.35;
}

p {
  margin: 0;
}

ul, ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
}

table {
  border-collapse: collapse;
  width: 100%;
}

/* ---- 2026-10-13 撤：canvas { display: block } ----
   全站已经没有 <canvas> 了（Chart.js 连同 js/charts.js 一起撤，
   页面 2 的比例条、页面 5 的标尺都是 DOM + CSS 画的）。
   留一条给不存在元素的重置，正是那种「读起来像在防什么、其实什么也没防」
   的规则 —— 真要用 canvas 时它会自己回来。 */



/* 数字统一用等宽感更强的字体，方便纵向对齐对比。
   凡是成列出现的数字都要登记在这里，否则一列数字会左右跳。 */
.num,
.metric-value,
.kv-val,
.fin-value,
.ratio-value,
.calc-eq {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

/* --------------------------------------------------------------------------
   3. 颜色语义工具类
   -------------------------------------------------------------------------- */

/* 健康度（status） */
.is-good { color: var(--c-good); }
/* 橙**文字**走 ink 档（#aa6300，白底 4.67:1）。用 --c-watch(#fa9205) 只有 2.29:1，字小了看不清。
   ★ 这是「白底橙字」唯一还活着的地方（另一处是 .warn-title）。
     页面 4 概览条那三个大数挂的就是它 —— 34px 是「大字」，3:1 就够，
     但既然 ink 档同时也够 4.5:1，就不为这一处单开宽松标准。 */
.is-watch { color: var(--c-watch-ink); }
.is-bad { color: var(--c-bad); }

/* 涨跌（tone）—— 必须配箭头使用 */
.tone-up { color: var(--c-up); }
.tone-down { color: var(--c-down); }
.tone-flat { color: var(--c-text-2); }

/* 次要文字 */
.dim { color: var(--c-text-3); }
.strong { font-weight: 600; }

/* --------------------------------------------------------------------------
   4. 打印
   --------------------------------------------------------------------------
   ★ 打印相关的规则**只能写在这个文件里**，不要往 components.css 加 @media。
   理由：tools/layout-audit.js 的 ③(圆角阴影) / ④(裸值) 两项是用朴素正则拆
   CSS 的「选择器 + 声明块」的，工具自己的注释写明「components.css 里没有
   @media，所以这个朴素正则够用；哪天加了 @media，要改成先剥掉才行」。
   这个文件只被工具读 :root，所以放这里安全。
   -------------------------------------------------------------------------- */
@media print {
  html,
  body { background: #fff !important; }
  /* 关掉渐变和光晕：省墨，也免得被印成一大片灰底 */
  body::before { display: none !important; }

  /* ★ 2026-10-13 补：页面 1 那几件**只在屏幕上成立**的东西。
     它们是交互控件，不是内容：上传格（纸上是一片虚线空地）、

/* --------------------------------------------------------------------------

   ★ 为什么 .main 用 --c-surface-2 蓝灰底，**而不是也做成毛玻璃** ——

     全站最外层本来是背景渐变，卡片是玻璃，一层。现在中间插进来一层面板，

/* 两栏并排（Comps / DCF），窄屏自动堆叠。

   卡宽掉到 324px 时，内容区只剩 276px，Comps 卡里那张 6 列的同行倍数表
   塞不进去，右侧的 PS 列**整个压到隔壁 DCF 卡上**（重叠 31px），
   同时「可比公司」「五粮液」这些列被挤成一列一个字。

  grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));

  align-items: start;
}

.two-col > * {

}

/* 指标大数横排 */
.metric-row {
