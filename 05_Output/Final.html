  function renderChips() {
    var box = refs.chips;
    if (!box) return;
    clear(box);

    var man = manifest();
    if (!man || !man.shards) return;
    var M = metricsAll() || {};

    man.shards.forEach(function (s) {
      var m = M[s.code];
      var b = ui.el("button", "chip");
      b.type = "button";
      if (s.code === current) b.className += " is-on";
      if (prepared[s.code]) b.className += " is-loaded";
      if (pending[s.code]) b.className += " is-loading";
      if (shardErr[s.code]) b.className += " is-failed";

      b.appendChild(ui.el("span", "chip-name", (m && m.company && m.company.name) || s.name));
      b.appendChild(ui.el("span", "chip-meta", s.code + " · " + s.n_chunks + " 块"));
      /* 载入状态**写在 chip 上**，而不是只写在上方那行小字里 ——
         点一下公司名会读 1–2 MB 的文件，这件事必须当场看得见。 */
      b.appendChild(ui.el("span", "chip-load", chipLoadText(s.code)));

      b.addEventListener("click", function () { selectCode(s.code); });
      box.appendChild(b);
    });
  }

  function chipLoadText(code) {
    if (prepared[code]) return "已载入 · 可检索";
    if (pending[code]) return "载入中…";
    if (shardErr[code]) return "载入失败";
    return "点击载入语料";
  }

  function renderScope() {
    var box = refs.scopeLine;
    if (!box) return;
    clear(box);

    var man = manifest();
    var total = (man && man.shards) ? man.shards.length : 0;
    var n = loadedCodes().length;
    var chunks = loadedCodes().reduce(function (a, c) {
      return a + ((prepared[c].meta && prepared[c].meta.n_chunks) || 0);
    }, 0);

    box.appendChild(ui.el("span", "scope-text",
      n ? ("检索范围：已载入 " + n + " / " + total + " 家，共 " + chunks +
           " 个块（约 " + (chunks * 3.2 / 1000).toFixed(1) + " MB 正文）")
        : ("检索范围：0 / " + total + " 家 —— 点公司名读入那一家的年报正文后才能提问")
    ));

    var errs = Object.keys(shardErr);
    if (errs.length) {
      box.appendChild(ui.el("span", "scope-err",
        "有 " + errs.length + " 家读不进来：" + errs.map(function (c) {
          return c + "（" + shardErr[c] + "）";
        }).join("；")));
    }

    if (n < total) {
      var all = ui.el("button", "btn-link", "全部载入（" + total + " 家，约 17 MB）");
      all.type = "button";
      all.addEventListener("click", function () {
        all.disabled = true;
        all.textContent = "载入中…";
        loadAll();
      });
      box.appendChild(all);
    }
  }

  function selectCode(code) {
    current = code;
    renderChips();
    renderDashboard(code);
    if (!prepared[code] && !pending[code]) loadShard(code);
  }

  function statusBadge(st) {
    if (st === "found" || !st) return null;
    if (st === "not_applicable") {
      var a = ui.el("span", "badge na", "不适用");
      a.title = "命中了科目名，但值确实是空（这一项对这家公司不存在）";
      return a;
    }
    if (st === "not_found") {
      var b = ui.el("span", "badge nf", "未找到");
      b.title = "别名未命中 —— 可能是抽取失败，不是「这家没有」";
      return b;
    }
    return ui.el("span", "badge nf", st);
  }

  function renderDashboard(code) {
    var head = refs.boardHead, body = refs.boardBody;
    if (!head || !body) return;
    clear(head);
    clear(body);
    closeDrawer();

    var M = metricsAll();
    var m = M && code ? M[code] : null;
    if (!m) {
      head.appendChild(ui.el("div", "board-empty", "这一家没有指标数据（FINSCOPE_METRICS 里无 " + code + "）"));
      return;
    }

    /* ---- 抬头 ---- */
    var c = m.company, em = m.extraction_meta || {};
    var pm = em.pagemap || {};

    var nameRow = ui.el("div", "board-name-row");
    nameRow.appendChild(ui.el("span", "board-name", c.name || code));
    nameRow.appendChild(ui.el("span", "ticker", c.ticker || code));
    head.appendChild(nameRow);

    var meta = ui.el("div", "board-meta");
    [
      c.industry,
      c.report_period,
      em.pdf_pages ? ("年报 " + em.pdf_pages + " 页") : null,
      /* 页码映射覆盖率：A 用来声明「每个块都能对上印刷页码」的程度。
         它不是 E 算的，是 A 的 extraction_meta 直接读的。 */
      (pm.coverage != null) ? ("页码映射覆盖 " + Math.round(pm.coverage * 100) + "%") : null,
      (pm.n_missing ? (pm.n_missing + " 页未对上") : null),
      "指标 " + Object.keys(m.financials).length + " / " + Object.keys(m.financials).length
    ].forEach(function (t) {
      if (t) meta.appendChild(ui.el("span", "meta-chip", String(t)));
    });
    head.appendChild(meta);

    /* ---- 通向页面 2 的联动（① 方案 A） ----
       ------------------------------------------------------------------
       ★ **只在「这一家正好是 D 交付的那一家」时才给这个链接。**
         D 只交付 1 家（600519 茅台）。其余 8 家在页面 2 上**根本没有对应
         数据** —— 无条件给链接，点过去看到的还是茅台，那是**指错**，
         比不给链接更坏（同 EDGE_CASES #99「一条指错的欠账比没有欠账更坏」）。
       ★ 用 <a href="#p2"> 而不是调 app 的内部函数：全站切页就是靠
         hashchange（app.js 的 show(fromHash())），所以普通的锚点就是
         唯一正确的接法，也不给页面开一个「要认识 app 内部」的口子。
       ★ 箭头是**文字字形**不是图标字体（硬约束：零图标字体）。 */
    if (code === dCompanyCode()) {
      var jump = ui.el("a", "board-jump",
        "看这家公司的完整概览 →");
      jump.href = "#p2";
      jump.title = "页面 2 · " + (c.name || code) +
        "：核心指标 / 主要财务数据 / 估值。其余 8 家 D 未交付完整财务数据，不在页面 2 上。";
      head.appendChild(jump);
    } else {
      /* ★ 2026-10-13 第六轮：**把「为什么这一家没有那个入口」写在它缺席的地方。**
         反馈原话：「按理来说已经载入的 9 家公司都可以看到完整概览吧，
         但是只有茅台下面有『看这家公司的完整概览』的引导，我认为其它公司也可以加上」。

         边界是真实的：页面 2 读的是 D 的 window.FINSCOPE_DATA，
         而 D 只交付了 600519 一家（公司抬头 + 17 个科目 + ratios / risks /
         valuation）。A 的 window.FINSCOPE_METRICS 虽然 9 家都有，但它只有
         company / financials / extraction_meta 三段 —— 缺 ratios、缺 valuation，
         连科目键名都不一样（A 是 net_profit_attr，D 是 net_income_parent）。
         所以「给另外 8 家也加上那个链接」在这里做不到，
         硬做的话点过去看到的还是茅台 —— 那是指错，
         比不给入口更坏（EDGE_CASES #99）。

         既然做不到「都加上」，就不要让它**沉默**：把缺席的原因和覆盖范围
         写在这一行该在的位置上。读者看到的是「这家没有，因为 D 没交付，
         完整概览目前覆盖贵州茅台」，而不是「为什么这家没有链接」。
         这一行只在**非 600519** 的看板上出现 —— 有入口的那一家不需要解释。 */
      var dCode = dCompanyCode();
      var dM = (M && dCode) ? M[dCode] : null;
      var dName = dM && dM.company ? dM.company.name : null;
      var off = ui.el("div", "board-jump-off",
        "页面 2 的完整概览（核心指标 / 主要财务数据 / 估值）由 D 交付，"
          + "目前只覆盖 " + (dName && dCode ? dName + "（" + dCode + "）" : "贵州茅台（600519）")
          + " 一家；这一家的核心指标与三年原值在本表，但 ratios / risks / valuation "
          + "D 未交付，所以页面 2 上没有它。");
      head.appendChild(off);
    }

    /* ---- 表体 ---- */
    var ident = suspectByIdentity(m.financials);            // 跨行恒等式，一年一年算一次
    var tA = m.financials.total_assets;
    var totalAssetsYuan = tA ? F.fmt.toNum(tA.value) : null;  // 只用来判「这家是什么量级」
    var susRows = 0, susCells = 0;

    Object.keys(m.financials).forEach(function (key) {
      var f = m.financials[key];
      var s = f.series || {};

      var tr = ui.el("tr", "fin-row");

      var td0 = ui.el("td", "fin-label fin-name");
      td0.appendChild(document.createTextNode(f.label || key));
      var badge = statusBadge(f.status);
      if (badge) td0.appendChild(badge);

      /* 存疑标记。**不改任何数** —— 值照 A 给的画，只是在旁边说一句。
         徽标落在**科目名那一格**而不是数值格：数值格在 680 px 宽度下只剩 34 px 余量，
         塞一枚徽标就会把数字挤出去，那等于用一个显示缺陷去修一个数据缺陷。 */
      var sus = suspectYearsByMagnitude(s, totalAssetsYuan);
      Object.keys(ident).forEach(function (y) {
        if (ident[y][key]) sus[y] = ident[y][key];
      });
      var susYrs = Object.keys(sus).sort();
      if (susYrs.length) {
        susRows++; susCells += susYrs.length;
        var sb = ui.el("span", "badge suspect", "存疑");
        sb.title = susYrs.map(function (y) { return y + "：" + sus[y]; }).join("；")
                 + "。★ 这是 A 的抽取结果，E 只做展示、没有改数，也没有重算。";
        td0.appendChild(sb);
      }
      tr.appendChild(td0);

      /* 三年原值，全部来自 A 的 series。
         v2025 兜一层 f.value：series 缺 2025 但 status=found 时，
         value 就是 A 抽出来的本期值，不能显示成破折号。
         （全语料 153 格里有 2 格 series 为空，都是 not_applicable / not_found，
          这一层兜底是为将来 A 换了抽取结果准备的，不是为现在这两格。） */
      [["2023", "fin-prior"], ["2024", "fin-prior"], ["2025", "fin-value"]].forEach(function (p) {
        var v = s[p[0]];
        if (v == null && p[0] === "2025" && f.status === "found") v = f.value;
        tr.appendChild(ui.el("td", p[1], yi(v)));
      });

      var tdP = ui.el("td", "col-source");
      if (f.page != null) {
        var lk = ui.el("span", "page-link", F.fmt.page(f.page));
        lk.title = "点击查看这一页的原文";
        lk.addEventListener("click", function () { showPageEvidence(code, f.page); });
        tdP.appendChild(lk);
      } else {
        tdP.appendChild(ui.el("span", "board-dim", F.fmt.MISSING));
      }
      tr.appendChild(tdP);

      body.appendChild(tr);
    });

    /* ---- 存疑汇总 ----
       一处橙就够了，行内那几枚灰徽标只负责「让你在 17 行里找到它们」。
       全站的橙预算是一屏 1–2 处；这一条正好是「需要警觉」那一半。 */
    if (refs.boardWarn) {
      clear(refs.boardWarn);
      if (susRows) {
        refs.boardWarn.appendChild(ui.note(
          "这张表里有 " + susRows + " 行（共 " + susCells + " 个年份）的数据「自相矛盾」 —— " +
          "标了「存疑」的那些。判据只用 A 自己给的数互相比（同一行相差 100 倍以上、" +
          "营业成本高于营业收入、总负债高于总资产、资产负债表科目只有几十元），" +
          "没有引任何外部数据。「E 没有改任何数字，也没有重算」 —— " +
          "值照 A 的原文画，标记只是提醒你别直接引用。这属于 A 的抽取结果，要修得从那边修。",
          "warn"));
      }
    }
  }

  /* 点页码 → 把**该页所有命中的指标**的原样信息铺开：
     原始单位、原文字段、科目名匹配、口径、置信度。
     这一块的意义是让「1,688.38」能一路追回到年报第 6 页的那一行字。 */
  function showPageEvidence(code, page) {
    var box = refs.boardDrawer;
    if (!box) return;
    clear(box);

    var M = metricsAll();
    var m = M && M[code];
    if (!m) return;

    var hits = Object.keys(m.financials).filter(function (k) { return m.financials[k].page === page; })
      .map(function (k) { return m.financials[k]; });

    var head = ui.el("div", "drawer-head");
    head.appendChild(ui.el("span", "drawer-title",
      "该页原文 · " + (m.company.name || code) + " 年报 P." + page));
    var close = ui.el("button", "btn-link", "收起");
    close.type = "button";
    close.addEventListener("click", closeDrawer);
    head.appendChild(close);
    box.appendChild(head);

    if (!hits.length) {
      box.appendChild(ui.el("p", "block-sub", "这一页没有指标命中 —— 说明该页是正文叙述，不是财务指标表。"));
      box.classList.add("is-open");
      return;
    }

    hits.forEach(function (f) {
      var ev = ui.el("div", "ev");
      var h = ui.el("div", "ev-head");
      h.appendChild(ui.el("b", null, f.label));
      h.appendChild(ui.el("span", "ev-dim", "原始单位 " + (f.unit_raw || f.unit || "—")));
      if (f.section) h.appendChild(ui.el("span", "ev-dim", f.section));
      ev.appendChild(h);

      ev.appendChild(ui.el("div", "ev-raw", String(f.raw_text || "—")));

      var foot = ui.el("div", "ev-foot");
      [
        ["科目名匹配", f.alias_matched],
        ["口径", f.basis],
        ["置信度", f.confidence],
        ["所在表", f.table]
      ].forEach(function (p) {
        if (p[1] === null || p[1] === undefined || p[1] === "") return;
        foot.appendChild(ui.el("span", "ev-kv", p[0] + "：" + p[1]));
      });
      ev.appendChild(foot);
      box.appendChild(ev);
    });

    box.classList.add("is-open");
    scrollTo(box);
  }

  function closeDrawer() {
    var box = refs.boardDrawer;
    if (!box) return;
    box.classList.remove("is-open");
    clear(box);
  }

  /* ==================================================================== */
  /* 问答                                                                  */
  /* ==================================================================== */

  /* A 的预置题自带预计算向量（queries.js 每条都有 vec 字段）。
     静态页装不下 95 MB 的 ONNX 模型，所以只有这几句能走向量；
     自由提问拿不到向量，检索退回 BM25 单路 —— 页面会如实标出来，
     而不是假装「语义检索」了。 */
  function queryVector(text) {
    var presets = window.FINSCOPE_QUERIES || [];
    for (var i = 0; i < presets.length; i++) {
      if (presets[i].q === text) return toFloatVec(presets[i].vec);
    }
    return null;
  }

  function toFloatVec(b64) {
    var i8 = FinSearch.decodeTyped(b64, Int8Array);
    var f = new Float32Array(i8.length);
    for (var i = 0; i < i8.length; i++) f[i] = i8[i];
    return f;
  }

  /* 断句。★ 没有用 A 原来的 `split(/(?<=[。！？；\n])/)` ——
     那个后行断言（lookbehind）在 Safari 16.4 之前是语法错误，
     整段脚本会直接不执行。这一页要能在 Mac 上双击打开，所以换成手写扫描：
     逐字累积、碰到终止符就切一刀。语义与原来的正则一致。 */
  function splitSentences(text) {
    var out = [], buf = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      buf += ch;
      if (ch === "。" || ch === "！" || ch === "？" || ch === "；" || ch === "\n") {
        if (buf.trim()) out.push(buf.trim());
        buf = "";
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* 抽取式回答：从命中的证据块里挑与问句词重叠最高的句子。
     分数 = 命中词数 / √(句子词数) —— 除以根号是为了不让长句天然占优，
     再加一个很小的名次奖励（越靠前的证据块越可能对题）。 */
  function composeAnswer(question, results) {
    var qset = Object.create(null);
    FinTok.tokenize(question).forEach(function (t) { qset[t] = true; });

    var scored = [];
    results.forEach(function (r, ri) {
      splitSentences(r.text).forEach(function (s) {
        if (s.length < 8) return;
        var toks = FinTok.tokenize(s), hit = 0;
        toks.forEach(function (t) { if (qset[t]) hit++; });
        scored.push({
          sent: s,
          score: hit / Math.sqrt(toks.length || 1) + 0.35 / (ri + 1),
          ref: ri + 1
        });
      });
    });
    scored.sort(function (a, b) { return b.score - a.score; });

    var picked = [], seen = Object.create(null);
    for (var i = 0; i < scored.length && picked.length < 4; i++) {
      var key = scored[i].sent.slice(0, 30);
      if (seen[key]) continue;
      seen[key] = true;
      picked.push(scored[i]);
    }
    return picked;
  }

  /* 一道题需要在哪几家的语料里找。
     点名了公司就只带那几家（问句里的公司名直接对着 A 清单的 name 匹配，
     和 a/search.js 里 searchAll 给同名词加权的口径是同一个字符串）；
     一家都没点名，说明是跨公司题，那就全量。 */
  function scopeFor(q) {
    var man = manifest();
    if (!man || !man.shards) return [];
    var M = metricsAll() || {};
    var named = man.shards.filter(function (s) {
      var n = (M[s.code] && M[s.code].company && M[s.code].company.name) || s.name;
      return n && q.indexOf(n) >= 0;
    });
    var pick = named.length ? named : man.shards;
    return pick.map(function (s) { return s.code; });
  }

  function ensureScopeFor(q) {
    return Promise.all(scopeFor(q).map(function (c) {
      return loadShard(c).catch(function () { return null; });   // 单家失败不阻塞其余
    }));
  }

  function runQuery(text) {
    text = (text || "").trim();
    if (!text) return;

    var status = refs.qaStatus;
    if (!status) return;
    clear(status);
    clear(refs.qaAnswer);
    clear(refs.qaEvidence);

    if (!loadedCodes().length) {
      /* 一句话都没载入时，别让用户对着「还没有载入任何一家」发呆 ——
         默认把看板上选中的那家读进来再答。这是 page 1 唯一一处
         「不点也会读文件」的地方，只读一家（≤ 2.2 MB）。 */
      if (!current) {
        status.appendChild(ui.el("span", "qa-hint",
          "还没有可检索的年报 —— 先在上面的看板里点一家公司，或直接用上面的预设题。"));
        return;
      }
      var meta = findMeta(current);
      status.appendChild(ui.el("span", "qa-hint",
        "先读入 " + ((meta && meta.name) || current) + " 的年报正文…"));
      loadShard(current).then(go, function (e) {
        clear(status);
        status.appendChild(ui.el("span", "qa-hint", "读入失败：" + e.message));
      });
      return;
    }
    go();

    function go() {
      var codes = loadedCodes();
      if (!codes.length) {
        status.appendChild(ui.el("span", "qa-hint", "没有可检索的语料。"));
        return;
      }

      /* 同步算完再渲染。一次 searchAll 在 600 个块上约几十毫秒，
         不值得为它做异步状态机；「检索中…」这一行是给重问九家时兜的。 */
      var now = function () { return (window.performance && performance.now) ? performance.now() : Date.now(); };
      var t0 = now();
      var vec = queryVector(text);
      var list = codes.map(function (c) { return prepared[c]; });
      var results = FinSearch.searchAll(list, text, vec, { topN: 8, pool: 200 });
      var ms = Math.round(now() - t0);
      var chunks = list.reduce(function (a, s) { return a + (s.meta.n_chunks || 0); }, 0);

      clear(status);
      status.appendChild(ui.el("span", "qa-mode " + (vec ? "is-vec" : "is-bm25"),
        vec ? "BM25 + 向量 双路融合" : "BM25 单路"));
      status.appendChild(ui.el("span", "qa-hint",
        (vec
          ? "这道题在 A 的预置题里，带着预计算向量 —— 语义与关键词两路都跑。"
          : "自由提问在 file:// 下算不了向量（要 A 的 serve.py 的 /embed），所以只有关键词一路；" +
            "换用上面的预置题可以走到双路。") +
        " 本次在 " + codes.length + " 家、" + chunks + " 个块里找，用时 " + ms + " ms。"
      ));

      renderAnswer(text, results);
    }
  }

  function renderAnswer(question, results) {
    var picked = composeAnswer(question, results);
    var ans = refs.qaAnswer;
    if (!ans) return;
    clear(ans);

    ans.appendChild(ui.el("div", "ans-note",
      "以下答案由检索到的证据块抽取拼接，未做生成式改写；每条末的角标对应下方证据块，证据块带页码。"));

    if (!picked.length) {
      ans.appendChild(ui.el("p", "ans-empty", "没有找到足够相关的证据。换一种说法，或先把相关公司载入。"));
    } else {
      picked.forEach(function (p) {
        var line = ui.el("p", "ans-line");
        line.appendChild(document.createTextNode(p.sent));
        line.appendChild(ui.el("sup", "cite", "[" + p.ref + "]"));
        ans.appendChild(line);
      });
    }

    /* ---- 证据块 ---- */
    var ev = refs.qaEvidence;
    clear(ev);
    if (!results.length) return;

    ev.appendChild(ui.subhead("证据块（" + results.length + "）"));

    results.forEach(function (r) {
      var box = ui.el("div", "ev");

      var h = ui.el("div", "ev-head");
      h.appendChild(ui.el("b", null, "[" + r.fused_rank + "]"));
      h.appendChild(ui.el("span", "ev-name", r.company_name || r.company_code));
      if (r.section) h.appendChild(ui.el("span", "ev-dim", r.section));
      h.appendChild(ui.el("b", "ev-page", "第 " + (r.printed_page == null ? "?" : r.printed_page) + " 页"));
      if (r.is_table) h.appendChild(ui.el("span", "badge tb", "表格"));
      box.appendChild(h);

      var meta = ui.el("div", "ev-meta");
      meta.appendChild(ui.el("span", null, "BM25 名次 " + (r.bm25_rank || "—")));
      meta.appendChild(ui.el("span", null, "向量名次 " + (r.vec_rank || "—")));
      meta.appendChild(ui.el("span", null, "融合分 " + r.fused_score.toFixed(4)));
      box.appendChild(meta);

      /* 长块先截 420 字，给一个「展开全文」把它换出来 ——
         直接铺全文会让一整页都是正文，反而看不到有几条证据。
         截断这件事要说出来（写「共 N 字」），不能悄悄切。 */
      var full = String(r.text || "");
      var textEl = ui.el("div", "ev-text", full.slice(0, 420));
      box.appendChild(textEl);

      if (full.length > 420) {
        var more = ui.el("button", "btn-link", "展开全文（共 " + full.length + " 字）");
        more.type = "button";
        more.addEventListener("click", function () {
          if (textEl.textContent.length > 420) {
            textEl.textContent = full.slice(0, 420);
            more.textContent = "展开全文（共 " + full.length + " 字）";
          } else {
            textEl.textContent = full;
            more.textContent = "收起";
          }
        });
        box.appendChild(more);
      }

      ev.appendChild(box);
    });
  }

  /* ==================================================================== */
  /* 小动作                                                                */
  /* ==================================================================== */

  function scrollTo(el) {
    if (!el) return;
    var r = el.getBoundingClientRect();
    window.scrollTo(0, Math.max(0, r.top + window.scrollY - 24));
  }

  /* ---- 打印前把截断的证据全文展开 ----
     与 app.js 里那个 expandAll（展开折叠的风险卡）同一个道理：
     「先给 420 字、想看全文再点」是**屏幕上的省地方设计**，
     印到纸上就变成「内容真的只有这些」—— 那是一种很坏的错法，
     全文和截断在纸上长得一模一样。所以印前先替读者点开。

     ★ 用 click() 而不是直接改 DOM：按钮自己的文案（展开全文 ↔ 收起）
       要跟着同步，绕过去会印出一个写着「展开全文」的按钮配一整段全文。
     只点 .ev-list 里的（问答证据块）；看板抽屉里的原文本来就不截断。 */
  function expandEv() {
    var btns = document.querySelectorAll(".ev-list .btn-link");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].textContent.indexOf("展开全文") === 0) btns[i].click();
    }
  }

  window.addEventListener("beforeprint", expandEv);
  /* ★ Chrome 在部分场景不触发 beforeprint，用媒体查询兜一道 ——
     app.js 里对风险卡也是这么兜的，两处保持同一种写法。 */
  if (window.matchMedia) {
    var mq = window.matchMedia("print");
    var onMq = function (e) { if (e.matches) expandEv(); };
    if (mq.addEventListener) mq.addEventListener("change", onMq);
    else if (mq.addListener) mq.addListener(onMq);
  }
})();

</script>
<script>
/* ================= js/pages/p2-overview.js ================= */
/* ============================================================================
 * p2-overview.js —— 页面2 公司概览
 * ----------------------------------------------------------------------------
 * 职责：公司抬头 + 三个核心大数（营收 / 归母净利润 / ROE）+ 主要财务数据表。
 * 数据来源：company / financials（D 定义、A 抽全）、
 *          ratios.profitability.roe_weighted（B）
 *
 * 【2026-10-13 对齐 D 之后，本页撤掉了两块】
 *   主营构成（business_mix）与多期趋势（history）**没有源** ——
 *   A 的抽取结果顶层只有 company / financials / extraction_meta 三段，
 *   四个队友谁也不产出这两个字段。E 原来按「A 以后会给」把界面做完了、
 *   跑着 mock，那是把不存在的接口当既有接口在用。按授权从 E 撤掉。
 *
 *   代价要说清楚：本页因此从「五块」变成「三块」，比原来薄。
 *   ★ 2026-10-13：用 D 给的 prior_value / prior_period 把密度补回来了 ——
 *   财务数据表加一列「上期」+ 一行表头，五列：科目 / 本期 / 上期 / 相对大小 / 出处。
 *   上期值走 dataLoader 已打包的 r.prior，**E 不自己找上期、更不算同比**
 *   （同比是 B 的成长性维度）。整块一个 prior 都没有时自动退回四列。
 *
 * 【版式定案 2026-10-10】
 *   1. 本页讲一句话：**数字必须可验证**（DEMO_SCRIPT.md:42 的演示台词）。
 *      所以版面重心不是「几个好看的数」，是「每个数旁边都有一条能点开的页码」。
 *   2. **本页零 tone**。曾经想过给三个大数配同比的涨跌色，否掉了：
 *      卡片顶边和右上角健康度标签已经在用 status 色，再加一套红涨绿跌，
 *      同一张卡上红色会同时表示「上涨」和「差」。同比归页面 3 的成长性维度讲，
 *      那里已经是它的主场。（base.css 的 tone 因此全站无使用，保留待用）
 *   3. **主要财务数据分三块，每块保留报表自身的形状**，不套同一个模板：
 *      利润表有缩进与「减：」，资产负债表有「其中：」的从属关系，
 *      现金流量表的三项净额沿零点线分左右（正负号是流向，不是大小）。
 *      分组顺序与形状定义见 dataLoader 的 FINANCIAL_BOOK。
 *   4. **每行配一条比例条**，条长按本块内最大科目归一。这是显示缩放，
 *      不是金融比率 —— 脚注里写明了，免得被读成「占营收比」。
 *      「快慢两条车道」也在这里：头条科目大一号，其余退到次级，
 *      16 行一样的粗细等于没有重点。
 *   5. **出处一律低调**：小一号、灰色、虚线，紧贴在它支撑的那个数字右侧。
 *      全站原则见 css/components.css 的 .page-link 注释。
 *   6. 大数缺失时显示「未提取」而不是破折号 —— 破折号分不清「没有」和「是零」。
 *
 * 注意：ROE 来自 B，**没有单一页码**（它是几个科目算出来的），
 *       所以它的来源行写「由财务数据计算得出」，不显示成缺数据。
 *       ★ 且它不能走 fmt.metric() —— 见 HEADLINE 下面的注释。
 * ==========================================================================*/

(function () {
  "use strict";
  var F = (window.FinScope = window.FinScope || {});
  F.pages = F.pages || {};

  /* --------------------------------------------------------------------------
     三个核心大数
     --------------------------------------------------------------------------
     kind 决定取值与格式化走哪条路，**这两条路不能混**：
       · "fin"   财报科目 → data.item(path) → fmt.metric()，
                 单位由 D 的 unit 字段决定（元 → money() 归一到亿元）；
       · "ratio" 比率项   → data.ratioValue(key, item)，
                 单位的口径由 dataLoader 的 RATIO_META 逐条声明。
     ★ 这里踩过一次：roe_weighted 的 unit 是 "小数"、value 是 0.3446，
       而 "小数" 是个混装桶（既装百分数也装真倍数），fmt.metric() 分不出来，
       会显示成 "0.345" —— 一个毛利 91% 的公司，ROE 看着像 0.3%。
       所以比率项一律走 ratioValue，**永远不要**对它调 fmt.metric。 */
  var HEADLINE = [
    { label: "营业收入",   kind: "fin",   path: "financials.revenue",         metric: "营业收入" },
    { label: "归母净利润", kind: "fin",   path: "financials.net_income_parent", metric: "归母净利润" },
    { label: "ROE",        kind: "ratio", group: "profitability", key: "roe_weighted", metric: null }
  ];

  F.pages.p2 = {
    id: "p2",
    index: 2,
    title: "公司概览",
    subtitle: "Overview",

    spec: [
      "ROE 的 page 字段：D 的比值项目前一律 page = null（它是几个科目算出来的，"
        + "原本就不对应某一页）。页面因此写「由财务数据计算得出」，不显示成缺数据",
      "上期对照：D 已给 financials.*.prior_value / prior_period，"
        + "dataLoader 也已打包成 r.prior。★ 2026-10-13 已上版：五列为"
        + "科目 / 本期 / 上期 / 相对大小 / 出处，列宽改走 <colgroup>。"
        + "整块一个 prior 都没有时自动退回四列（不留 16 行破折号的空壳）"
    ],

    render: function (root) {
      var ui = F.ui, fmt = F.fmt, data = F.data;

      root.appendChild(ui.section(
        this.title,
        "公司基本面与核心财务数据一览。每一个数字都可以点开，回到它在年报里的位置。"
      ));

      root.appendChild(companyHead(ui, fmt, data));
      root.appendChild(headlineRow(ui, fmt, data));
      root.appendChild(financialTable(ui, fmt, data));

      /* ---- 待实现清单（.dev-card：演示模式会整张隐藏） ---- */
      var block = ui.card("dev-card");
      block.appendChild(ui.subhead("本页待实现"));
      block.appendChild(ui.todoList(this.spec));
      root.appendChild(block);
    }
  };

  /* ------------------------------------------------------------------ */
  /* 公司抬头                                                            */
  /* ------------------------------------------------------------------ */
  function companyHead(ui, fmt, data) {
    var head = ui.card();
    head.classList.add("company-head");

    var nameRow = ui.el("div", "company-name-row");
    nameRow.appendChild(ui.el("h2", "company-name",
      fmt.text(data.get("company.name"), "（公司名称未提供）")));
    nameRow.appendChild(ui.el("span", "ticker", fmt.text(data.get("company.ticker"), "—")));
    head.appendChild(nameRow);

    /* 四个属性芯片。字段名一律用 D 的（对齐方案决定 #2）：
         · 报告期用 report_period（"2025"），不是拼接出来的标题；
         · 报告类型用 report_type（"年度报告"）；
         · 交易所用 exchange。
       ★ 撤掉的 company.report_title / company.business / company.business_page
         三个字段 D 和 A 都不产出 —— 上一版那句「一句话业务定位」整块删除。
         它是本页唯一一段不是数字的内容，删除后抬头只剩名字和属性，
         这是「没有源就不画」的直接代价，不拿别的话去填。 */
    var meta = ui.el("div", "company-meta");
    addChip(ui, fmt, meta, "行业", data.get("company.industry"));
    addChip(ui, fmt, meta, "报告期", data.get("company.report_period"));
    addChip(ui, fmt, meta, "报告类型", data.get("company.report_type"));
    addChip(ui, fmt, meta, "交易所", data.get("company.exchange"));
    head.appendChild(meta);

    return head;
  }

  /* 一个属性芯片。值为空时**整格不出现** ——
     一排「行业：— 报告期：— 」比少一格更难看，也没多告诉人任何事。 */
  function addChip(ui, fmt, row, label, value) {
    if (fmt.isNil(value)) return;
    row.appendChild(ui.el("span", "meta-chip", label + "：" + value));
  }

  /* ------------------------------------------------------------------ */
  /* 三个核心大数                                                        */
  /* ------------------------------------------------------------------ */
  function headlineRow(ui, fmt, data) {
    var row = ui.el("div", "metric-row");

    HEADLINE.forEach(function (m) {
      /* 取值：两条路各走各的。ratio 那条要同时拿到 item（判有无、取页码）
         和格式化好的文字（口径在 RATIO_META 里）。 */
      var path = m.kind === "fin" ? m.path : ("ratios." + m.group + "." + m.key);
      var item = data.item(path);
      var text = null;
      if (item) {
        text = m.kind === "fin" ? fmt.metric(item) : data.ratioValue(m.key, item);
      }

      var c = ui.el("div", "metric-card");
      c.appendChild(ui.el("div", "metric-label", m.label));

      /* 大数缺失时写「未提取」，不写破折号 ——
         「—」分不清是没有这个数、还是这个数就是零。 */
      if (!item) {
        c.appendChild(ui.el("div", "metric-value is-missing", "未提取"));
      } else {
        c.appendChild(ui.el("div", "metric-value", text));
      }

      /* 来源行分两种情况：
         A 抽出来的财务数据项带页码 → 做成可点击的溯源链接；
         B 算出来的比率没有单一页码（是几个科目算出来的）→ 说明来源方式即可，
         不能显示成「—」，那会让人以为数据缺失。 */
      var srcBox = ui.el("div", "metric-source");
      if (!item) {
        srcBox.textContent = "无数据可溯源";
      } else if (item.page !== null && item.page !== undefined) {
        srcBox.appendChild(ui.sourceLink(fmt.source(item), {
          metric: m.metric,
          page: item.page,
          item: item
        }));
      } else {
        srcBox.textContent = m.kind === "ratio"
          ? "由财务数据计算得出"
          : "未标注页码";
      }
      c.appendChild(srcBox);

      /* 健康度色只用 status 系统，本页不出现 tone。
         ★ D 的比值 status 是 ok / not_evaluable / not_meaningful，
           含义是「算不算得出来」不是「好不好」，statusClass 因此不给
           ok / found 上色（见 format.js 的长注释）。这里照传即可。
         ⚠️ 必须走 ui.addClass 而不是 classList.add —— 上面那几档
           statusClass 返回的是**空串**，直接喂给 classList 会抛异常。
           这一条踩过：页面 2 曾经整页白屏，就出在这一行。 */
      if (item && item.status) {
        ui.addClass(c, fmt.statusClass(item.status));
        if (!fmt.statusQuiet(item.status)) {
          c.appendChild(ui.el("span", "metric-status", fmt.statusLabel(item.status)));
        }
      }

      row.appendChild(c);
    });

    return row;
  }

  /* ------------------------------------------------------------------ */
  /* 主要财务数据：三张报表，各有各的形状                                */
  /* ------------------------------------------------------------------ */
  /* 这是本页撑起「可验证」那句话的地方：16 个科目每个都带年报页码。
     但**把 16 行排成一张同样的表，等于没排** —— 一样的字号、一样的颜色、
     一样的列宽，眼睛没有落点。所以这里做三件事：
       ① 按报表自身形状排（缩进层级 / 其中： / 净额分流），不套同一个模板；
       ② 每行配一条比例条，大小关系不用读数字就看得出来；
       ③ 每张表一行头条科目（字号大一档），其余退到次一级 —— 快慢两条车道。
     条长按**本表内**最大科目归一（纯显示缩放，与画柱状图算刻度同类）
     不是金融比率，脚注里写清楚了，免得被读成「占营收比」。 */
  function financialTable(ui, fmt, data) {
    var groups = data.financialGroups();

    /* 挂 card-dense：这张卡有 16 行科目 + 比例条，是站上最密的一张。
       毛玻璃默认那档（0.60）让背景透上来，行底色会随渐变轻微漂移。
       加这个类走强玻璃（0.82）。**.card 用不了 :has()** ——
       file:// 下不知道对面是什么浏览器，不敢赌，所以在 JS 里显式标。 */
    var card = ui.card("card-dense");
    card.appendChild(ui.subhead("主要财务数据"));

    var total = groups.reduce(function (n, g) { return n + g.items.length; }, 0);
    if (!total) {
      card.appendChild(ui.empty("financials 字段尚未提供，主要财务数据表暂无法生成。"));
      return card;
    }

    groups.forEach(function (g) { card.appendChild(statementBlock(ui, fmt, g)); });

    card.appendChild(ui.note(
      "条形长度按本表内最大科目等比缩放，只用于比较同一张报表内的相对大小，"
        + "不是任何比率。点任意一行的页码，可以看这个数字来自年报的哪一节、哪一页。"
        + "页面 3 的比率、页面 4 的证据链、页面 5 的估值对象都建立在这些数之上。",
      "info"
    ));

    return card;
  }

  /* 一张报表 = 一个块 */
  function statementBlock(ui, fmt, g) {
    var block = ui.el("div", "fin-block");

    /* 表头：报表名 + 该表的头条科目。看一眼就知道这块是什么、多大。 */
    var head = ui.el("div", "fin-block-head");
    head.appendChild(ui.el("span", "fin-block-name", g.label));
    var top = g.items.filter(function (r) { return r.key === g.headline; })[0] || g.items[0];
    head.appendChild(ui.el("span", "fin-block-flag",
      top.name + " " + fmt.metric(top.item)));
    block.appendChild(head);

    /* 归一基准：本表内绝对值最大的科目（不跨表比 —— 利润表和资产负债表
       根本不是一个量纲，跨表比条形毫无意义） */
    var max = 0;
    g.items.forEach(function (r) {
      var v = fmt.toNum(r.item);
      if (v !== null && Math.abs(v) > max) max = Math.abs(v);
    });

    /* ★ 2026-10-13 新增「上期」列。取值走 dataLoader 已经打包好的 r.prior
       （= { value, period, unit }，来自 D 的 prior_value / prior_period），
       **E 不自己去找上期、也不自己算同比** —— 同比是 B 的活。
       prior 是整列存在与否的判断依据，不是逐行判断：
       D 要么每个科目都给 prior_value，要么都不给。
       一个都没有时**整列不画**（也不画表头那一格），免得出现 16 行破折号的空壳。 */
    var hasPrior = g.items.some(function (r) { return !!r.prior; });

    var tb = ui.el("table", "fin-table" + (hasPrior ? "" : " is-4col"));

    /* 列宽走 colgroup 而不是 td 类名 —— 见 css/components.css 的注释：
       table-layout: fixed 按第一行取列宽，有了表头行之后第一行就是表头。 */
    var cols = ["c-name", "c-value"];
    if (hasPrior) cols.push("c-prior");
    cols.push("c-bar", "c-source");
    var cg = ui.el("colgroup");
    cols.forEach(function (c) { cg.appendChild(ui.el("col", c)); });
    tb.appendChild(cg);

    /* 表头行。期间（本期 2025 / 上期 2024）是从数据里读的，**不写死年份** ——
       D 换一份年报，这里得跟着变。整列都没有 Period 就只写「本期 / 上期」。 */
    tb.appendChild(finHeadRow(ui, fmt, g, hasPrior));

    var tbody = ui.el("tbody");

    g.items.forEach(function (r) {
      var it = r.item || {};
      var v = fmt.toNum(it);

      var tr = ui.el("tr", "fin-row");
      if (r.key === g.headline) tr.classList.add("is-headline");
      if (r.gap) tr.classList.add("is-gap");

      /* 科目：缩进层级 + 行前缀（减： / 其中：） */
      var tdName = ui.el("td", "fin-name");
      if (r.op) tdName.appendChild(ui.el("span", "fin-op", r.op));
      if (r.indent) tdName.classList.add("indent-" + r.indent);
      tdName.appendChild(ui.el("span", "fin-label", r.name));
      tr.appendChild(tdName);

      /* 本期值。status 不是 found 时给个淡色小字 ——
         不标出来的话，读者会以为这一格是 E 没填。
         ⚠️ 这个分支**只接得住「进来了的行」**。not_applicable（这一项对这家
           公司不成立，如茅台没有商誉）已经在 dataLoader 的 financialGroups
           里整行滤掉了，走不到这里 —— 所以下面的例子举的是别的档。
         见 dataLoader.js 的 isNotApplicable。 */
      var tdVal = ui.el("td", "fin-value");
      tdVal.appendChild(ui.el("span", null, fmt.metric(it)));
      if (it.status && it.status !== "found") {
        tdVal.appendChild(ui.el("span", "dim",
          "（" + fmt.statusLabel(it.status) + "）"));
      }
      tr.appendChild(tdVal);

      /* 上期值：跟本期**同一条格式化路径**（fmt.metric + 同一个 unit），
         两列的数字必须是一个模子刻出来的，否则对照就无从谈起。
         D 没给这一格的值时给破折号 —— 不写 0，也不留空。 */
      if (hasPrior) tr.appendChild(priorCell(ui, fmt, r));

      /* 比例条。diverging 表（现金流量表）用零点线分左右；
         其余从左端起算。**行可以覆写所在块的形状** ——
         现金流量表里的资本开支是流出额、不是净额，不参与左右分流。
         数值取不到就不画条，不留一根空轨道。 */
      var tdBar = ui.el("td", "fin-bar-cell");
      tdBar.appendChild(barFor(ui, r.shape || g.shape, v, max));
      tr.appendChild(tdBar);

      /* 出处：有页码才给链接，没有就给灰破折号 —— **不编一个链接出来** */
      var tdSrc = ui.el("td", "col-source");
      if (it.page !== null && it.page !== undefined) {
        tdSrc.appendChild(ui.sourceLink(fmt.page(it.page), {
          metric: r.name, page: it.page, item: it
        }));
      } else {
        tdSrc.appendChild(ui.el("span", "dim", fmt.MISSING));
      }
      tr.appendChild(tdSrc);

      tbody.appendChild(tr);
    });

    tb.appendChild(tbody);

    /* ★ 2026-10-13：整张表包一层横向滚动壳（.table-scroll）。
       窄窗口下这张五列表放不下 —— 数字是 nowrap 的，放不下就直接溢出、
       压到隔壁的上期列和比例条上（实测窗口 1000px 有 4 处、950px 有 20 处）。
       为什么是滚动而不是换行/裁切，见 css/components.css 的 .fin-table
       { min-width } 那条注释。宽屏下这层壳不产生任何滚动条。 */
    var scroller = ui.el("div", "table-scroll");
    scroller.appendChild(tb);
    block.appendChild(scroller);
    return block;
  }

  /* 表头行：科目 / 本期（2025）/ 上期（2024）/ 相对大小 / 出处。
     为什么值得占一行，见 css/components.css 的 .fin-head-row 注释。 */
  function finHeadRow(ui, fmt, g, hasPrior) {
    var thead = ui.el("thead");
    var tr = ui.el("tr", "fin-head-row");

    tr.appendChild(ui.el("th", "h-name", "科目"));

    /* 期间只在**整块第一行**取一次。D 的 prior_period 是全表同一个年份
       （实测 17 个科目里 16 个带值、period 一律 "2025"、prior_period 一律 "2024"），
       逐行重复写等于 17 遍噪声。 */
    var period = null, priorPeriod = null;
    g.items.forEach(function (r) {
      var it = r.item || {};
      if (period === null && !fmt.isNil(it.period)) period = it.period;
      if (priorPeriod === null && r.prior && !fmt.isNil(r.prior.period)) {
        priorPeriod = r.prior.period;
      }
    });

    tr.appendChild(ui.el("th", "h-value", "本期" + (period ? "（" + period + "）" : "")));
    if (hasPrior) {
      tr.appendChild(ui.el("th", "h-prior", "上期" + (priorPeriod ? "（" + priorPeriod + "）" : "")));
    }
    tr.appendChild(ui.el("th", "h-bar", "相对大小"));
    tr.appendChild(ui.el("th", "h-source", "出处"));

    thead.appendChild(tr);
    return thead;
  }

  /* 一格里放上期值。走 fmt.metric 而不是 fmt.num：
     单位、千分位、元→亿元全都得跟本期同一套，手工拼字符串迟早会岔开。 */
  function priorCell(ui, fmt, r) {
    var td = ui.el("td", "fin-prior");
    if (!r.prior || fmt.isNil(r.prior.value)) {
      td.appendChild(ui.el("span", "dim", fmt.MISSING));
      return td;
    }
    td.appendChild(ui.el("span", null, fmt.metric(r.prior)));
    return td;
  }

  /* 一根比例条。pct 是占本表最大值的百分比，四舍五入到 2 位 ——
     不取整的话内联样式里会出现 16.666666666666664% 这种噪声。 */
  function barFor(ui, shape, v, max) {
    var track = ui.el("div", "fin-track" + (shape === "diverging" ? " is-diverging" : ""));
    track.title = "条长按本表内最大科目等比缩放";

    if (v === null || max <= 0) return track;

    var pct = Math.round((Math.abs(v) / max) * 10000) / 100;
    var bar = ui.el("div", "fin-bar");
    if (v < 0) bar.classList.add("is-neg");

    /* 定位一律写在行内：绝对定位下 left / right / width 三者同时存在会过约束，
       CSS 里留一个默认值就会让负向条跑到右边去。所以两条分支都把 left 或 right
       显式定死，CSS 里不设默认。 */
    if (shape === "diverging") {
      /* 零点线在轨道正中，正数往右、负数往左 */
      bar.style.width = (pct / 2) + "%";
      if (v < 0) bar.style.right = "50%";
      else bar.style.left = "50%";
    } else {
      /* 普通幅度条：从左边起算，取绝对值 —— 资本开支是流出额，
         与净额不是同一类数，只用来看「多大」，不用来看「流向」。 */
      bar.style.left = "0";
      bar.style.width = pct + "%";
    }
    track.appendChild(bar);
    return track;
  }
})();

</script>
<script>
/* ================= js/pages/p3-diagnosis.js ================= */
/* ============================================================================
 * p3-diagnosis.js —— 页面3 财务诊断
 * ----------------------------------------------------------------------------
 * 职责：五维能力（成长性 / 盈利能力 / 偿债能力 / 营运能力 / 现金流质量）
 *       的指标明细。
 * 数据来源：ratios（B 算、D 统一）。每项
 *   { value, unit, period, formula, page, prev, delta, inputs, status, higher_is_better }
 *
 * 【2026-10-13 对齐 D：这一页改了三个根本假设】
 *
 *   ① **没有得分了。** 上一版整页建立在 `ratios.<维度>._score` 上 —— 一张
 *      五维雷达图 + 每个维度块右上角的大号得分。D 的 ratios **不产出 _score**，
 *      而且这不是「忘了给」，是它压根不做打分这件事：D 给的是
 *      `status: ok / not_evaluable / not_meaningful`，含义是
 *      「**这一项算不算得出来**」，不是「好不好」。
 *      所以雷达图整块删除、得分显示整块删除。**不自己凑一个分数出来** ——
 *      那既不是 B 的判断也不是 D 的判断，是 E 的判断，越权了。
 *
 *   ② **一个维度不是 3–4 项，是 10–18 项。** D 的 ratios 一共 68 项
 *      （growth 10 / profitability 18 / solvency 14 / efficiency 12 /
 *      cashflow_quality 14）。全平铺的话五个块各十几行，一屏读不完，
 *      而且「哪几个是重点」这件事被摊平掉了。
 *      改法：**核心指标常显，其余折进「其余 N 项」**。
 *      核心名单来自 js/contract.js 的 INDICATORS —— 不在这里另抄一份。
 *      ★ 2026-10-13 第六轮更正：这一段原来写着「复用已有的 .ratio-detail +
 *      .is-open 机制，没有新增 CSS」——**是错的**，而且错得刚好藏住了 bug。
 *      .ratio-detail 是**另一件事**（点开看公式的那一行），
 *      被折叠的主行是 .ratio-row，而 .ratio-row.is-open 只改背景色，
 *      收不起来。CSS 里没有 .is-folded 这条规则，等于折叠一直是死的：
 *      五个块全部平铺 10–18 行，「其余 N 项（点这里展开）」插在中间被读成分节线。
 *      现在补上了 .ratio-row.is-folded { display: none } 与它的 .is-open 分支。
 *
 *   ③ **status 的语义换了，颜色映射跟着换。** 见 format.js 的 statusClass：
 *      ok 不上色（算出来了不等于好）、not_evaluable 上橙（需要有人去做点什么）、
 *      not_meaningful 不上色（不是问题，是事实）。
 *      所以本页的橙只出现在「待核验」上 —— 橙出现即「这里有活要干」。
 *
 * 【沿用上一版的版式定案】
 *   1. **本页零 tone**。得分和比率都是水平值，没有涨跌方向。
 *   2. **出处贴在被支撑的数据旁边**：有 page 的指标在指标名下挂一行灰色
 *      可点页码。★ 2026-10-13 更正：这一段原来写着「D 的比值项一律 page = null，
 *      所以本页一个页码链接都没有」——**与实测不符**。真数据里 68 项有 2 项带了
 *      page（现金流质量的 ocf @6、capex @13），页面也确实把它们渲染出来了。
 *      绝大多数比值项仍然是 page = null，那是对的（比率由几个科目算出，
 *      本来就不对应某一页），但这个「有则渲染、无则整格不放」的行为
 *      不该被写成「一律没有」。也不为此写提示条 —— 缺的是可选字段，不是缺口。
 *   3. **五个维度块两栏并排**，一屏看全五维。窄屏自动退回单栏。
 *   4. **每块给一句话结论**，只报例外（「14 项指标中 4 项待核验」），
 *      全算得出时才报总数。
 *   5. **待核验行左边加一道 2px 状态色**。其余行不涂 —— 对比才是指示。
 *
 * 注意：E 不判断指标好坏。颜色与结论全部来自数据里的 status 字段。
 * ==========================================================================*/

(function () {
  "use strict";
  var F = (window.FinScope = window.FinScope || {});
  F.pages = F.pages || {};

  F.pages.p3 = {
    id: "p3",
    index: 3,
    title: "财务诊断",
    subtitle: "Diagnosis",

    spec: [
      "比值项的 page 字段：D 只给得出 2 项（ocf / capex），其余 66 项都是 null，"
        + "这是对的 —— 比率由几个科目算出，本来就不对应某一页。"
        + "本页按「有则渲染、无则整格不放」处理，不写提示条（可选字段缺 ≠ 缺口）。"
        + "★ 但 D 若哪天想支持「点开看是哪几个科目」，要的是 inputs（已有），不是 page；"
        + "两个标准混用的结果是读者以为只有那两项能溯源",
      "三张偿债能力指标（current_ratio / quick_ratio / interest_coverage）"
        + "在 D 的交付里是 not_evaluable —— 缺的是流动负债、利息支出等科目，"
        + "那要 A 多抽几行。E 侧已经按「待核验」如实显示，不去替它算",
      "维度间联动（点一个维度高亮）—— 页面本身不长，收益小于复杂度，暂缓"
    ],

    render: function (root) {
      var ui = F.ui, fmt = F.fmt, data = F.data;

      root.appendChild(ui.section(
        this.title,
        "从成长性、盈利能力、偿债能力、营运能力、现金流质量五个维度看公司财务。"
             + "指标值、公式与状态均来自财务诊断模块，前端只做呈现。"
      ));

      var groups = data.ratioGroups();

      if (!groups.length) {
        root.appendChild(emptyCard(ui));
        return;
      }

      /* 顶部说清这一页读什么。★ 原来这条注释讲的是「得分不是我们算的」，
         现在没有得分了，注释改成讲**状态词的含义** ——
         这是读这一页最容易读错的地方：看到一片灰以为「都好」。 */
      var intro = ui.card();
      intro.appendChild(ui.note(
        "每项指标后面若跟着「待核验」，意思是「这一项算不出来」（缺上游科目），"
          + "不是「这一项很差」；「不适用」意思是这项对该公司没有意义"
          + "（如无商誉的公司算不出商誉占比）。算得出来的项不标注 ——"
          + "一片素净才是正常，有橙色才说明有活要干。",
        "info"
      ));
      root.appendChild(intro);

      /* 两栏并排：一屏看全五维。
         原先五个维度块竖着排，要滚两屏才看完，而且每块都是同一个形状，
         读到第三块就没有分辨度了。 */
      var grid = ui.el("div", "dim-grid");
      groups.forEach(function (g) {
        grid.appendChild(dimBlock(ui, fmt, data, g));
      });
      root.appendChild(grid);

      /* ---- 待实现清单（.dev-card：演示模式会整张隐藏） ---- */
      var block = ui.card("dev-card");
      block.appendChild(ui.subhead("本页待实现"));
      block.appendChild(ui.todoList(this.spec));
      block.appendChild(ui.note(
        "指标中文名的唯一来源是 dataLoader.js 的 RATIO_META（68 项逐条登记）。"
             + "D 的比值项「不带 name 字段」，所以这不是兜底表，是唯一来源 ——"
             + "D 加了新指标，这里必须跟着加一行，否则显示成英文键名。",
        "info"
      ));
      root.appendChild(block);
    }
  };

  function emptyCard(ui) {
    var c = ui.card();
    c.appendChild(ui.empty("ratios 字段尚未提供，财务诊断暂无法生成。"));
    return c;
  }

  /* ------------------------------------------------------------------ */
  /* 一个维度 = 一块                                                     */
  /* ------------------------------------------------------------------ */
  function dimBlock(ui, fmt, data, g) {
    var items = data.ratioItems(g.key);

    var block = ui.el("div", "card dim-block");

    /* ---- 表头 ---- */
    /* 右上角原来是一个大号的「/ 100」得分。得分没了之后这里改放
       **这一维度有活要干的项数** —— 它是这一块里唯一一个跨行才数得出来的数，
       放在表头才不用逐行扫。全算得出时这个位置不占。 */
    var head = ui.el("div", "dim-head");
    head.appendChild(ui.el("h3", "dim-name", g.label));

    var counts = countByStatus(items);
    if (counts.not_evaluable) {
      var flag = ui.el("span", "status-chip is-watch",
        counts.not_evaluable + " 项待核验");
      flag.title = "这几项因为缺上游科目算不出来，需要补数据";
      head.appendChild(flag);
    }
    block.appendChild(head);

    /* ---- 健康分布色条 ---- */
    /* 色条上只画「待核验」。理由：ok 与 not_meaningful 都**不需要动作**，
       把它们也涂成颜色，色条就永远满着，橙色就不再是信号了。
       全维度没有待核验项时给一条空槽 —— 空槽本身就是「这块没事」。 */
    var barRow = ui.el("div", "dim-bar-row");
    var bar = ui.el("div", "status-bar");
    if (counts.not_evaluable) {
      var seg = ui.el("span", "status-seg is-watch");
      seg.style.flex = counts.not_evaluable;
      seg.title = "待核验：" + counts.not_evaluable + " 项";
      bar.appendChild(seg);
      var rest = ui.el("span", "status-seg is-empty");
      rest.style.flex = Math.max(items.length - counts.not_evaluable, 0.001);
      rest.title = "已算出或本项不适用：" + (items.length - counts.not_evaluable) + " 项";
      bar.appendChild(rest);
    } else {
      bar.appendChild(ui.el("span", "status-seg is-empty"));
    }
    barRow.appendChild(bar);

    /* 一句话结论。颜色取**本维度最差**的那一档 —— 这只是把同一组里
       最严重的那个标签抬到句子上，没有新增任何判断。 */
    var meta = ui.el("div", "dim-meta" + (counts.not_evaluable ? " is-watch" : ""),
      dimConclusion(counts, items.length));
    barRow.appendChild(meta);
    block.appendChild(barRow);

    /* ---- 指标表 ---- */
    if (!items.length) {
      block.appendChild(ui.empty("该维度暂无指标数据。"));
      return block;
    }

    var core = items.filter(function (x) { return x.isCore; });
    var rest = items.filter(function (x) { return !x.isCore; });

    var tb = ui.el("table", "ratio-table");
    var tbody = ui.el("tbody");

    core.forEach(function (x) { addRow(ui, fmt, tbody, x, true); });

    /* 其余项：折起来。一个「点一下展开」的行，展开的是一组行。
       ★ 折叠组挂 .is-folded（见 addRow），CSS 里对应 .ratio-row.is-folded。
       没有核心名单时（契约没加载）core 为空，这里就不会出现折叠头，
       全部指标常显 —— 退化成「平铺」，能读，只是没有主次。 */
    if (rest.length) {
      var folded = [];
      rest.forEach(function (x) {
        addRow(ui, fmt, tbody, x, false, folded);
      });

      var toggle = ui.el("tr", "ratio-row");
      var td = ui.el("td", "ratio-name");
      td.colSpan = 3;
      var toggleLabel = ui.el("span", "ratio-label dim",
        "其余 " + rest.length + " 项指标（点这里展开）");
      td.appendChild(toggleLabel);
      toggle.appendChild(td);

      toggle.addEventListener("click", function () {
        var open = !folded[0].classList.contains("is-open");
        folded.forEach(function (r) { r.classList.toggle("is-open", open); });
        toggle.classList.toggle("is-open", open);
        toggleLabel.textContent = open
          ? "收起 " + rest.length + " 项指标"
          : "其余 " + rest.length + " 项指标（点这里展开）";
      });

      tbody.insertBefore(toggle, folded[0]);
    }

    tb.appendChild(tbody);
    block.appendChild(tb);

    return block;
  }

  /* 一行指标。openable=true 时行下方挂一条可展开的公式行。
     collect 不为空时，这一行会被收进折叠组（加了 is-open 才显示）。 */
  function addRow(ui, fmt, tbody, x, openable, collect) {
    var it = x.item;

    var tdName = ui.el("td", "ratio-name");
    tdName.appendChild(ui.el("span", "ratio-label", x.label));
    if (x.page !== null && x.page !== undefined) {
      var sl = ui.el("span", "ratio-src");
      sl.appendChild(ui.sourceLink(fmt.page(x.page), {
        metric: x.label, page: x.page, item: it
      }));
      tdName.appendChild(sl);
    }

    var tr = ui.el("tr", "ratio-row");
    /* 状态类名用 st-* 前缀，不复用全局的 is-good/is-watch/is-bad ——
       那三个是**文字颜色**类，挂到 tr 上会把整行文字染色。
       这里要的是左边那一道 2px 色条，只作用于第一个单元格。
       ★ D 只会给出 not_evaluable 一种需要着色的值，所以实际只有 st-watch。 */
    if (it.status) tr.classList.add("st-" + it.status);
    tr.appendChild(tdName);

    /* 值。取不到值时紧跟着一个淡色说明（「不适用」/「待核验」）——
       光一个破折号分不清是「E 没填」还是「这项本来就没有」。
       ★ 用 x.text，不要用 fmt.metric(it)：比率的口径按 RATIO_META 逐条声明。 */
    var tdVal = ui.el("td", "ratio-value");
    tdVal.appendChild(ui.el("span", null, x.text));
    if (!x.quiet) {
      tdVal.appendChild(ui.el("span", "dim", "（" + fmt.statusLabel(it.status) + "）"));
    }
    tr.appendChild(tdVal);

    /* 状态胶囊**只在待核验时出现**。D 没有「好/差」这一档，
       给 ok 挂一个「正常」胶囊等于给 68 行里的 35 行挂同一个标签 ——
       挂满等于没挂（format.js 的 statusQuiet 就是在管这件事）。 */
    var tdStatus = ui.el("td");
    if (it.status === "not_evaluable") {
      tdStatus.appendChild(ui.el("span", "status-chip is-watch", "待核验"));
    }
    tr.appendChild(tdStatus);

    tbody.appendChild(tr);

    /* 展开行：怎么算的。默认隐藏，点主行切换。
       出处已经上移到主行，这里不再重复。
       ⚠️ 折叠组里的行**不给展开行** —— 折叠本来就是「这些先不看」，
       再套一层展开，点起来的层级就乱了。 */
    if (!openable) {
      if (collect) {
        /* ★ 2026-10-13 第六轮补的 is-folded。原来这里只 push 不挂类，
           而 CSS 里**根本没有一条规则收得起来** —— .ratio-row.is-open 只改背景色，
           被折叠的 7–14 行于是全部常显，「其余 N 项指标（点这里展开）」那行
           插在中间，被读成一条分节线。点它只会变一下底色，什么也不收。
           于是这一页的五个块全部平铺 10–18 行，再加上 grid-auto-rows: 1fr
           拉齐高度，短的块底下空出一大片 —— 就是「可读性不高」的真因。 */
        tr.classList.add("is-folded");
        collect.push(tr);
      }
      return;
    }

    var dr = ui.el("tr", "ratio-detail");
    var dc = ui.el("td");
    dc.colSpan = 3;

    if (x.formula) {
      dc.appendChild(ui.el("div", "detail-line", "计算公式：" + x.formula));
    }
    /* D 的比值项**没有 threshold 字段** —— 它不做「好/差」的阈值判断，
       只做「算不算得出来」。所以这里不再写「判断标准」那一行。 */
    if (it.higher_is_better === true) {
      dc.appendChild(ui.el("div", "detail-line dim", "方向：该指标越高越好"));
    } else if (it.higher_is_better === false) {
      dc.appendChild(ui.el("div", "detail-line dim", "方向：该指标越低越好"));
    }
    if (dc.children.length === 0) {
      dc.appendChild(ui.el("div", "detail-line dim", "该指标未提供公式。"));
    }

    dr.appendChild(dc);
    tr.addEventListener("click", function () {
      var open = dr.classList.toggle("is-open");
      tr.classList.toggle("is-open", open);
    });
    tbody.appendChild(dr);
  }

  /* ------------------------------------------------------------------ */
  /* 统计                                                                */
  /* ------------------------------------------------------------------ */
  /* D 的三档 + 认不出的兜底。认不出的键单列出来而不是塞进某一档 ——
     塞错档会让「待核验 N 项」这个数撒谎。 */
  function countByStatus(items) {
    var c = { ok: 0, not_evaluable: 0, not_meaningful: 0, other: 0 };
    items.forEach(function (x) {
      var s = x.status;
      if (Object.prototype.hasOwnProperty.call(c, s)) c[s]++;
      else c.other++;
    });
    return c;
  }

  /* 一句话结论。只报**例外**，没事时才报总数 ——
     「14 项指标全部算得出」是一句结论，「ok 10 / 不适用 4」是两个数。 */
  function dimConclusion(counts, n) {
    if (!n) return "暂无指标";
    var bits = [];
    if (counts.not_evaluable) bits.push(counts.not_evaluable + " 项待核验");
    if (counts.other)         bits.push(counts.other + " 项状态未知");
    if (!bits.length) return n + " 项指标全部算得出";
    return n + " 项指标中 " + bits.join(" · ");
  }
})();

</script>
<script>
/* ================= js/pages/p4-risk.js ================= */
/* ============================================================================
 * p4-risk.js —— 页面4 风险雷达
 * ----------------------------------------------------------------------------
 * 职责：风险点列表。每条风险摊开证据链，从原始数据到结论可逐层复核。
 * 数据来源：risks[] + rules_evaluated[]（B 定规则、D 统一）
 *
 * 【2026-10-13 对齐 D：这一页的取证方式整个换了】
 *
 *   上一版 E 自己写了一个「公式代入层」：B 给一个 formula 字符串 + 一个 inputs
 *   对象，E 去拆字符串、按中文名反查每一侧对应哪个键、拼成
 *   「A 41.2% − B 18.4% = 22.8%」。难点全在「公式字符串与 inputs 对象的顺序
 *   不保证一致」，所以 E 写了一堆校验、拼不可靠就返回 null 让页面回落三行式。
 *   很谨慎，但很绕 —— 而且**整个是多余的**。
 *
 *   D 的 risks[].evidence_chain[] 直接给的就是**已经分好步骤的结构**：
 *     step: "数据" | "计算" | "出处" | "判断" | "归因" | "建议"
 *   每一步自带字段，没有任何东西需要 E 再拆字符串。所以那一整层删掉了，
 *   本页改成**顺着 evidence_chain 走**。
 *
 * 【D 的 risks 与 B 的 rules 是两份东西，都要用】
 *   · risks[]           —— **只装已触发的**（D 已按 status == "triggered" 过滤）。
 *                          一条风险 = 一张卡。
 *   · rules_evaluated[] —— **全部已评估的规则**（含通过的和算不出的）。
 *                          它回答的是「一共扫了几条」。600519 是 36 条里 4 条触发。
 *   ★ 少了后者，页面上只有 4 张卡会被读成「这家公司只有 4 个问题」；
 *     有了它才是「扫了 36 条，命中 4 条」。这是完全不同的两句话，
 *     所以概览条上必须写出来。
 *
 * 【版式定案 2026-10-10，沿用】
 *   1. 高风险卡片**默认展开**。这一页最值钱的就是证据链，不能藏在一次点击后面。
 *   2. 颜色只用 status 系统。本页零 tone —— 这里的数字是水平值。
 *      ★ 严重度三档：high → 红，medium → 橙，low → 灰。
 *        D 的 severity 就是 high / medium / low（并另给中文 severity_tag）。
 *   3. 三层用「链条」版式：左侧一条竖线，节点挂在线上。
 *      前面几层是事实（中性色），最后一层是结论（状态色）。
 *   4. **出处不单独占一层**。它是数据的附属属性，不是与数据平级的结论，
 *      所以并进「数据」那一层、以低调的可点击页码紧贴其支撑的那个数字。
 *   5. ③ 内部再分主次：解释是背景（灰底小字），建议是行动项（蓝底大字）。
 *
 * 注意：风险的触发与解释都是 B 的判断，E 只负责把证据链摊开给人看。
 * ==========================================================================*/

(function () {
  "use strict";
  var F = (window.FinScope = window.FinScope || {});
  F.pages = F.pages || {};

  F.pages.p4 = {
    id: "p4",
    index: 4,
    title: "风险雷达",
    subtitle: "Risk Radar",

    spec: [
      "evidence_chain 的六个 step（数据／计算／出处／判断／归因／建议）已按序渲染；"
        + "D 若新增 step，本页会「静默跳过」它 —— 这是刻意的，"
        + "画一个不认识的步骤不如不画（见本文件 stepRenderer 的 return null 分支）",
      "「算不出来的规则」目前只能数出条数，说不出「缺哪个变量」 ——"
        + "B 的 review_queue 里有 missing_inputs，但 D 的统一对象没透传。"
        + "若要显示「P03 待核验：缺 wacc」，需要 D 补这一节",
      "text_evidence.quote 在 600519 上全部是 null。字段在，但没有可用引文 ——"
        + "有值的样本会自动显示成引文块，前端零改动"
    ],

    render: function (root) {
      var ui = F.ui, data = F.data;

      root.appendChild(ui.section(
        this.title,
        "逐条规则扫描后的命中项。每条风险都摊开证据链，"
             + "从原始数据到结论可逐层复核。重大条目默认展开。"
      ));

      var risks = data.sortedRisks();
      var scan = data.rulesSummary();

      if (!risks.length) {
        var empty = ui.card();
        empty.appendChild(ui.empty(scan
          ? "已扫描 " + scan.total + " 条规则，无一触发。"
          : "未触发风险规则，或 risks 字段尚未提供。"));
        root.appendChild(empty);
      } else {
        root.appendChild(overviewBar(ui, data, scan));
        var list = ui.el("div", "risk-list");
        risks.forEach(function (r) { list.appendChild(riskCard(r, ui, data)); });
        root.appendChild(list);
      }

      var detail = scanDetail(ui, data, scan);
      if (detail) root.appendChild(detail);

      /* ---- 待实现清单（.dev-card：演示模式会整张隐藏） ---- */
      var block = ui.card("dev-card");
      block.appendChild(ui.subhead("本页待办"));
      block.appendChild(ui.todoList(this.spec));
      block.appendChild(ui.note(
        "证据链的每一层都直接来自 D 的 evidence_chain[]，E 只做排版与单位换算，"
             + "不重算、不补写、不排序。某个 step 缺字段时那一小段会降级为提示文字"
             + "（不静默留白），整条链的其余部分照常显示。",
        "info"
      ));
      root.appendChild(block);
    }
  };

  /* ==================================================================== */
  /* 概览条                                                                */
  /* -------------------------------------------------------------------- */
  /* 只说「各有几条」。刻意不写「优先处理：XX」这种提示 ——                 */
  /* 三色已经说清了严重性，再点一遍风险名是重复强调，反而稀释了颜色的信息量。 */
  /* ==================================================================== */
  function overviewBar(ui, data, scan) {
    var s = data.riskSummary();
    var bar = ui.el("div", "risk-overview");

    var stats = ui.el("div", "ro-stats");
    [
      { n: s.high,   sev: "high",   cls: "is-bad"   },
      { n: s.medium, sev: "medium", cls: "is-watch" },
      { n: s.low,    sev: "low",    cls: "is-good"  }
    ].forEach(function (x) {
      var it = ui.el("div", "ro-item");
      it.appendChild(ui.el("span", "ro-num " + x.cls, String(x.n)));
      it.appendChild(ui.el("span", "ro-label", F.fmt.severityLabel(x.sev)));
      stats.appendChild(it);
    });
    bar.appendChild(stats);

    /* ★ 这一句是这一页最容易缺、也最要紧的一句。
       只有 4 张卡时，读者的默认理解是「4 个问题」；
       加上「共扫描 36 条」之后，才是「扫了 36 条、命中 4 条」——
       后者同时说明了扫描的覆盖面和结论的克制。
       没有 rules_evaluated 时退化成只报触发数，但那种情况下要说明。 */
    var note = ui.el("div", "ro-note");
    if (scan) {
      var bits = ["已扫描 " + scan.total + " 条规则，触发 " + scan.triggered + " 条"];
      if (scan.passed) bits.push("通过 " + scan.passed + " 条");
      if (scan.other)  bits.push(scan.other + " 条因缺变量无法判断");
      note.appendChild(ui.el("span", "ro-hint-text", bits.join(" · ")));
    } else {
      note.appendChild(ui.el("span", "ro-hint-text",
        "共 " + s.total + " 条风险（D 未提供 rules_evaluated，无法给出扫描总数）"));
    }
    bar.appendChild(note);

    return bar;
  }

  /* 规则扫描明细。放在风险列表**下面** ——
     它讲的是「没触发的那些」，属于补充材料，不该压在结论前面。
     36 行确实长，但这一节回答的是「你们到底查了多少」，
     是这一页可信度的底账，不能只给一个数字。 */
  function scanDetail(ui, data, scan) {
    if (!scan) return null;

    var card = ui.card("card-dense");
    card.appendChild(ui.subhead("规则扫描明细"));

    var tb = ui.el("table", "mini-table");
    var thead = ui.el("thead");
    var hr = ui.el("tr");
    ["规则", "名称", "结果", "触发条件"].forEach(function (h) {
      hr.appendChild(ui.el("th", null, h));
    });
    thead.appendChild(hr);
    tb.appendChild(thead);

    var tbody = ui.el("tbody");
    (data.get("rules_evaluated", []) || []).forEach(function (r) {
      var tr = ui.el("tr");
      tr.appendChild(ui.el("td", "strong", F.fmt.text(r.rule_id)));
      tr.appendChild(ui.el("td", null, F.fmt.text(r.rule_name)));
      var tdSt = ui.el("td");
      tdSt.appendChild(ui.el("span", "status-chip " + ruleStatusClass(r.status),
        ruleStatusLabel(r.status)));
      tr.appendChild(tdSt);
      tr.appendChild(ui.el("td", "dim", F.fmt.text(r.trigger)));
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);
    card.appendChild(tb);

    card.appendChild(ui.note(
      "以上是全部被评估过的规则，含「没有触发」的那些 ——"
        + "「通过」和「无法判断」同样是结论：通过 = 查过了没问题，"
        + "无法判断 = 上游缺变量、这一条还欠着。不列出来的话，"
        + "读者没法区分「没查」和「查了没事」这两件事。",
      "info"));
    return card;
  }

  /* 只认三档：通过 = 绿，无法判断 = 橙（有活要干），不适用 = 素净。
     ★ 这里**没有** is-bad 这一档 —— D 不会把一条规则标成「失败」，
       只标「触发」（那是 risks[] 里的事）或「算不出」。 */
  function ruleStatusClass(s) {
    if (s === "passed") return "is-good";
    if (s === "not_evaluable") return "is-watch";
    return "";
  }

  /* D 的 rules_evaluated[].status 是 passed / not_evaluable / not_applicable
     （risks[] 里的那条则一定是 triggered）。 */
  function ruleStatusLabel(s) {
    return {
      passed: "通过",
      not_evaluable: "无法判断",
      not_applicable: "不适用",
      triggered: "已触发"
    }[s] || F.fmt.text(s, "—");
  }

  /* ==================================================================== */
  /* 单条风险卡片                                                          */
  /* ==================================================================== */
  function riskCard(r, ui, data) {
    var fmt = F.fmt;
    var sev = fmt.severityClass(r.severity) || "sev-normal";
    var isHigh = r.severity === "high";

    var box = ui.el("div", "risk-card " + sev);

    /* --- 头部 --- */
    var head = ui.el("div", "risk-head");
    /* 严重度标签优先用 D 给的 severity_tag（中文，如「重大」「关注」），
       severity 只是英文枚举。两个都给不出时才显示破折号。 */
    head.appendChild(ui.el("span", "sev-chip",
      !fmt.isNil(r.severity_tag) ? r.severity_tag : fmt.severityLabel(r.severity)));

    var ht = ui.el("div", "risk-head-text");
    /* 规则编号 + 类别缀在风险名下面。编号是这条风险与 B 的规则库之间的凭据 ——
       页面上要能对着下面那张「规则扫描明细」查回去。 */
    var tagline = [r.risk_id, r.category].filter(function (x) { return !fmt.isNil(x); });
    if (tagline.length) {
      ht.appendChild(ui.el("div", "dim", tagline.join(" · ")));
    }
    ht.appendChild(ui.el("div", "risk-name", fmt.text(r.risk_name)));
    if (r.trigger) ht.appendChild(ui.el("div", "risk-trigger", "触发规则：" + r.trigger));
    head.appendChild(ht);

    var toggle = ui.el("button", "risk-toggle");
    toggle.type = "button";
    head.appendChild(toggle);
    box.appendChild(head);

    /* --- 证据链 --- */
    var body = ui.el("div", "risk-body");
    var chain = ui.el("div", "risk-layers");
    /* 归因层可能整层不存在（D 的归因步是空的）—— 那时它返回 null，
       直接跳过。**不留一个空节点**：空节点会照常吃掉 .layer 的
       margin-top 和左边那条竖线，视觉上像少画了一段。 */
    [layerData(r, ui, fmt, data),
     layerCalc(r, ui, fmt, data),
     layerAttribution(r, ui, fmt, data),
     layerExplain(r, ui, fmt)].forEach(function (L) {
      if (L) chain.appendChild(L);
    });
    body.appendChild(chain);
    box.appendChild(body);

    /* --- 展开 / 收起 --- */
    function setOpen(open) {
      box.classList.toggle("is-open", open);
      toggle.textContent = open ? "收起证据链" : "展开证据链";
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }
    setOpen(isHigh);                       /* 重大条目默认展开 */

    toggle.addEventListener("click", function (e) {
      e.stopPropagation();
      setOpen(!box.classList.contains("is-open"));
    });
    /* 整个头部可点，命中区域大一些；按钮自身已在上面拦掉 */
    head.addEventListener("click", function () {
      setOpen(!box.classList.contains("is-open"));
    });

    return box;
  }

  /* ==================================================================== */
  /* 证据链分层                                                            */
  /* ==================================================================== */
  /* D 的 evidence_chain 是**按序排列的步骤数组**，同一个 step 可能出现多次
     （比如 C01 有两个「数据」步骤）。所以这里按 step 名归并，
     而不是按下标取 —— 下标会随规则不同而变。 */
  function stepsOf(r, name) {
    var chain = r.evidence_chain;
    if (!Array.isArray(chain)) return [];
    return chain.filter(function (s) { return s && s.step === name; });
  }

  /* 层骨架：左侧节点 + 右侧内容 */
  function layer(ui, num, title, kind) {
    var root = ui.el("div", "layer " + kind);
    root.appendChild(ui.el("div", "layer-mark", num));
    var content = ui.el("div", "layer-content");
    content.appendChild(ui.el("div", "layer-title", title));
    root.appendChild(content);
    return { root: root, content: content };
  }

  /* ---- ① 数据与出处 ----
     数据步：每一条是一个年报科目（revenue / ocf / net_income_parent…），
     带本期值、上期值、出处页码。
     ★ 上期值是 D 直接给的 prev_value，**不是 E 算的同比**；
       本页连增长率都不显示，因为那是页面 3 成长性维度的事。 */
  function layerData(r, ui, fmt, data) {
    var L = layer(ui, "1", "数据与出处", "is-fact");
    var rows = stepsOf(r, "数据");

    if (!rows.length) {
      L.content.appendChild(ui.note(
        "证据链里没有「数据」步骤 —— 这一层无法渲染。", "warn"));
    } else {
      var tb = ui.el("table", "mini-table");
      var thead = ui.el("thead");
      var hr = ui.el("tr");
      ["科目", "本期", "上期", "出处"].forEach(function (h) {
        hr.appendChild(ui.el("th", null, h));
      });
      thead.appendChild(hr);
      tb.appendChild(thead);

      var tbody = ui.el("tbody");
      rows.forEach(function (s) {
        var tr = ui.el("tr");
        tr.appendChild(ui.el("td", "strong", data.metricLabel(s.item)));
        tr.appendChild(ui.el("td", "metric-value",
          data.riskValue(s.item, s.value, s.unit)));
        tr.appendChild(ui.el("td", "dim",
          (s.prev_value === null || s.prev_value === undefined)
            ? fmt.MISSING
            : data.riskValue(s.item, s.prev_value, s.unit)));

        var tdSrc = ui.el("td", "col-source");
        if (s.page === null || s.page === undefined) {
          /* 没有页码就只能是灰破折号 —— 不编一个链接出来 */
          tdSrc.appendChild(ui.el("span", "dim", fmt.MISSING));
        } else {
          tdSrc.appendChild(ui.sourceLink(fmt.page(s.page), {
            metric: data.metricLabel(s.item),
            page: s.page,
            item: { value: s.value, unit: s.unit, page: s.page,
                    source: s.source, period: s.period }
          }));
        }
        tr.appendChild(tdSrc);
        tbody.appendChild(tr);
      });
      tb.appendChild(tbody);
      L.content.appendChild(tb);
    }

    /* 原文证据。600519 上 quote 全是 null，所以整块不出现 ——
       留一个「暂无引文」的占位反而让人以为本该有。 */
    var te = r.text_evidence;
    if (te && !fmt.isNil(te.quote)) {
      var srcs = (te.sources || []).join("、");
      var pages = (te.pages || []).join("、");
      var byline = [srcs, pages ? "P." + pages : ""].filter(Boolean).join("　");
      L.content.appendChild(ui.note(
        "年报原文：「" + String(te.quote) + "」" + (byline ? "　—— " + byline : ""),
        "info"));
    }

    return L.root;
  }

  /* ---- ② 计算与判断 ---- */
  /* 「计算」步给的是 rule 的触发表达式 + 代进去的变量值；
     「判断」步给的是这条规则的完整条件、结果、以及它自己的严重度。
     ★ 两处都直接是结构化字段，E 不需要拆字符串 ——
       上一版那个 buildEquation 就是在这里被删掉的。 */
  function layerCalc(r, ui, fmt, data) {
    var L = layer(ui, "2", "计算与判断", "is-fact");
    var calcSteps = stepsOf(r, "计算");
    var judgeSteps = stepsOf(r, "判断");

    if (!calcSteps.length && !judgeSteps.length) {
      L.content.appendChild(ui.note(
        "证据链里没有「计算」与「判断」步骤 —— 只能看到结论，看不到复核路径。",
        "warn"));
      return L.root;
    }

    var box = ui.el("div", "calc-box");

    calcSteps.forEach(function (c) {
      if (c.formula) box.appendChild(ui.el("div", "calc-formula", c.formula));

      var vals = c.values && typeof c.values === "object" ? Object.keys(c.values) : [];
      if (vals.length) {
        var line = ui.el("div", "calc-eq");
        line.appendChild(ui.el("span", "ce-term", vals.map(function (k) {
          return data.metricLabel(k) + " " + data.riskValue(k, c.values[k], "小数");
        }).join("　")));
        box.appendChild(line);
      }
    });

    judgeSteps.forEach(function (j) {
      var meta = ui.el("div", "calc-meta");
      meta.appendChild(ui.el("span", "calc-threshold", fmt.text(j.item)));
      if (!fmt.isNil(j.result)) {
        meta.appendChild(ui.el("span",
          "calc-flag " + (j.result === "触发" ? "is-triggered" : "is-quiet"),
          j.result));
      }
      box.appendChild(meta);
    });

    L.content.appendChild(box);
    return L.root;
  }

  /* ---- ③ 归因：这一层是 D 白送的 ----
     杜邦三因子拆解 + 现金流桥。D 在每条风险的证据链里都带了一个「归因」步，
     说明「这个数字变动是由什么驱动的」。上一版没有这一层（B 没给），
     所以本层整块是新增的 —— 它也是这一页现在最有分量的一段：
     它把「收入下滑」从一句话变成三个可核对的因子。 */
  function layerAttribution(r, ui, fmt, data) {
    var steps = stepsOf(r, "归因");
    if (!steps.length) return null;

    var L = layer(ui, "3", "变动归因", "is-fact");
    var any = false;

    steps.forEach(function (s) {
      var dup = s.dupont;
      if (dup && typeof dup === "object") {
        var dk = Object.keys(dup).filter(function (k) { return dup[k] !== null; });
        if (dk.length) {
          any = true;
          var DUP_LABEL = {
            net_margin_effect:      "净利率变动影响",
            asset_turnover_effect:  "资产周转变动影响",
            leverage_effect:        "权益乘数变动影响",
            roe_delta:              "ROE 合计变动"
          };
          var tb = ui.el("table", "mini-table");
          var h = ui.el("thead"), hrow = ui.el("tr");
          ["杜邦拆解", "影响（百分点）"].forEach(function (x) {
            hrow.appendChild(ui.el("th", null, x));
          });
          h.appendChild(hrow); tb.appendChild(h);
          var tbody = ui.el("tbody");
          dk.forEach(function (k) {
            var tr = ui.el("tr");
            tr.appendChild(ui.el("td", "strong", DUP_LABEL[k] || k));
            tr.appendChild(ui.el("td", "metric-value", fmt.signedPercent(dup[k])));
            tbody.appendChild(tr);
          });
          tb.appendChild(tbody);
          L.content.appendChild(tb);
        }
      }

      var items = s.cash_flow_bridge_items_yi;
      if (Array.isArray(items) && items.length) {
        var live = items.filter(function (x) { return x && x.amount_yi !== null; });
        if (live.length) {
          any = true;
          L.content.appendChild(ui.el("div", "block-sub", "经营现金流桥（亿元）"));
          var tb2 = ui.el("table", "mini-table");
          var t2 = ui.el("tbody");
          live.forEach(function (x) {
            var tr = ui.el("tr");
            tr.appendChild(ui.el("td", "strong", fmt.text(x.item)));
            tr.appendChild(ui.el("td", "metric-value", fmt.signed(x.amount_yi, 2)));
            if (/倒轧|其他/.test(String(x.item))) tr.classList.add("is-gap");
            t2.appendChild(tr);
          });
          if (s.cash_gap_yi !== null && s.cash_gap_yi !== undefined) {
            var trg = ui.el("tr");
            trg.appendChild(ui.el("td", "strong", "现金缺口"));
            trg.appendChild(ui.el("td", "metric-value", fmt.signed(s.cash_gap_yi, 2)));
            t2.appendChild(trg);
          }
          tb2.appendChild(t2);
          L.content.appendChild(tb2);
        }
      }
    });

    if (!any) return null;
    if (steps[0].unit_note) {
      L.content.appendChild(ui.el("div", "detail-line dim", steps[0].unit_note));
    }
    return L.root;
  }

  /* ---- ④ 解释与建议 ----
     版式上有主次：解释是背景说明（中性底、小字），建议是行动项（强调底、大字）。
     演示时被记住的应该是「要做什么」，不是「这是什么意思」。 */
  function layerExplain(r, ui, fmt) {
    var L = layer(ui, "4", "解释与建议", "is-conclusion");

    if (r.explanation) {
      L.content.appendChild(ui.el("p", "risk-explain", r.explanation));
    } else {
      L.content.appendChild(ui.note(
        "未提供 explanation 字段 —— 此层无法渲染。", "warn"));
    }

    /* 建议直接取 D 的 suggested_action 整段。
       ★ 证据链的「建议」步里另有一个 actions 数组（拆成三条），
         但那一份是**同一段话的切分版**（D 用它自己把三条用「；」连起来
         写成 suggested_action）。E 拿哪一份都行，取整段是因为
         **不必由 E 决定这几条之间是什么关系**（并列？递进？先后？）——
         D 连好的那一份已经把关系写在标点里了。
       两处都没有时才降级为提示。 */
    var text = !fmt.isNil(r.suggested_action) ? String(r.suggested_action) : null;
    if (!text) {
      var acts = [];
      stepsOf(r, "建议").forEach(function (s) {
        if (Array.isArray(s.actions)) {
          s.actions.forEach(function (a) { if (!fmt.isNil(a)) acts.push(String(a)); });
        }
      });
      if (acts.length) text = acts.join("；");
    }

    if (text) {
      var sug = ui.el("div", "risk-suggest");
      sug.appendChild(ui.el("div", "sug-tag", "应对建议"));
      sug.appendChild(ui.el("p", "sug-text", text));
      L.content.appendChild(sug);
    }
    return L.root;
  }
})();

</script>
<script>
/* ================= js/pages/p5-valuation.js ================= */
/* ============================================================================
 * p5-valuation.js —— 页面5 估值分析
 * ----------------------------------------------------------------------------
 * 职责：让「两条估值区间差在哪」一眼可见。
 *
 * Comps（可比公司法）与 DCF（现金流折现法）是用两套完全不同的逻辑回答
 * 同一个问题。所以这页的核心不是某一家算出来的数字，而是
 * **两条区间落在同一把尺子上的相对位置** —— 演示脚本原话就是
 * 「指出 Comps 和 DCF 两条区间，讲两者差异」（docs/DEMO_SCRIPT.md:68）。
 *
 * 数据来源：valuation.* —— D 的统一数据对象（data/real_data.js）
 *
 * 【2026-10-13 全量重写：字段名全线对不上，且原来等的东西 D 已经给了】
 *
 *   旧版读的都是 C 那一版的字段名，D 交付的是另一套：
 *     comps.range            → comps.valuation_range（★ 自带 currency:"元/股"）
 *     comps.range.unit       → valuation_range.currency
 *     comps.target           → comps.inputs
 *     comps.peers            → comps.peer_companies
 *     dcf.range              → dcf.valuation_range
 *     dcf.assumptions        → dcf.inputs
 *   旧版的 spec 列了三条「待 C 补」，**D 已经全部补上了**：
 *     ① 没有 current_price → 现在 valuation.market_data.price 与
 *        blended.current_price 都有，标尺上画得出「现价」竖线（本版新增）；
 *     ② comps.target 没有倍数 → 现在 comps.implied_value_per_share 直接给出
 *        每种倍数推出来的每股价值，不必 E 自己乘；
 *     ③ 没有 WACC × g 的敏感性矩阵 → 现在 dcf.sensitivity.matrix 是 5×5 现成的。
 *   另外 D 还多给了三块旧契约里根本没有的东西：blended（融合估值）、
 *   scenarios（三情景）、dcf.forecast[]（逐年预测）。本页按「D 有就渲染」处理。
 *
 *   所以「A/B/C/D 没有的部分从 E 撤掉」在这页的具体含义是：
 *   删掉三个画不出来的降级分支、删掉所有对 C 的字段名引用，
 *   同时把 spec 换成**现在真的还缺的那几条**（见 spec）。
 *
 * 【版式定案 2026-10-10，2026-10-13 修订】
 *   1. 顺序是「结论 → 证据 → 细节」：
 *      ① 融合估值头条（D 的 blended，三个大数）
 *      ② 估值标尺（两条区间 + 现价竖线）
 *      ③ 两法细节（可比公司表 / DCF 假设）
 *      ④ 逐年预测与敏感性
 *      旧版把标尺放第一，因为当时没有 blended。现在有了 ——
 *      「贵还是便宜」这个问题有直接答案，让人先看到答案再去看推导。
 *   2. 标尺用 DOM + CSS 画，不用 Chart.js。三条理由：
 *      ① 浮动条 + 贯穿网格 + 跨行阴影，在 canvas 里要靠自定义插件，DOM 里
 *         就是几个绝对定位的 div；② 导出 PDF / 打印时 DOM 清晰、canvas 发虚；
 *      ③ 条形上的文字是真实文本，可选中、可被测试断言。
 *      代价是没有 tooltip —— 所以所有数值都直接写在行头上，不需要悬停。
 *   3. 本页零 tone。估值高低不是涨跌，用不到红涨绿跌。详见 css/base.css 顶部。
 *   4. 颜色只用 status/primary 系统，**不新造第二种"方法色"**。
 *      两条区间条长得一样，靠位置区分；视觉重点是重叠段，不是"哪条是哪条"。
 *      给 DCF 单独配一个颜色会暗示它有独立语义，而它没有。
 *
 * 【E 不重算估值 —— 本页的四种运算全是绘制行为】
 *   ① 刻度选择与取整（niceScale / logScale）—— 与画柱状图要算坐标同类
 *   ② 两条已给区间的重叠段（overlapOf）
 *   ③ 标尺上「现价」竖线的左右位置
 *   ④ 把 D 已给的数值按显示口径格式化（元 → 亿元、小数 → 百分数）
 *   以上都不产出新的估值结论。结论性的句子一律引用 D 的原文（warnings / verdict）。
 * ==========================================================================*/

(function () {
  "use strict";
  var F = (window.FinScope = window.FinScope || {});
  F.pages = F.pages || {};

  /* 两种方法的固定身份。key 必须与 valuation 下的字段名一致。 */
  var METHODS = [
    { key: "comps", label: "Comps 相对估值", tag: "可比公司法" },
    { key: "dcf",   label: "DCF 绝对估值",   tag: "现金流折现法" }
  ];

  /* 两法区间跨度到这个倍数，线性刻度就没法用了 —— 见 chooseScale。 */
  var LOG_THRESHOLD = 10;

  F.pages.p5 = {
    id: "p5",
    index: 5,
    title: "估值分析",
    subtitle: "Valuation",

    spec: [
      "两法区间跨度 60 倍（相对估值 413.91–660.13，DCF 1,267.32–24,654.14）——"
        + "线性刻度下窄的那条会被压成一根看不见的线，本页改用对数刻度并在标尺上标注。"

  /* ==================================================================== */
  /* 数值规整                                                              */
  /* ==================================================================== */

  function num(v) {
    if (v === null || v === undefined || v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }

  /* 每股价值的显示值，统一走 fmt.price（2 位小数 + 千分位 + 元/股）。
     矩阵和表格里用 fmt.grouped（只补千分位，单位在表头写一次）。 */
  function ps(fmt, v) { return fmt.price(v); }
  function cell(fmt, v) { return fmt.grouped(v, 2); }

  /* 金额：D 的 valuation 里所有钱都是**原始元**，而且底下**没有逐字段的
     unit**（Schema 只对 company.amount_unit 和 financials.*.unit 声明了「元」，
     valuation 下的钱一个单位字段都没有）。
     ------------------------------------------------------------------
     ★ 这里踩过一个坑，写下来免得再犯：
       直接把裸数丢给 fmt.money()，它会走默认单位「亿元」，于是
       dcf.inputs.revenue_base = 168838102514.79 显示成
       "168,838,102,514.8 亿元" —— 差了整整一亿倍，而且看起来还挺像个数。
       fmt.money 认单位，所以**必须把单位补上再交给它**。
     单位取「元」的依据：同一批数字（revenue_base 与 comps.inputs.revenue
     是同一个 168838102514.79）在 D 自己的投研简报里写成「1,688.38 亿元」，
     E 跟着 D 的口径走。这不是 E 重算数据，是显示刻度 —— 与股 → 亿股同类。 */
  function moneyOf(fmt, v) {
    var n = num(v);
    return n === null ? null : fmt.money({ value: n, unit: "元" });
  }

  /**
   * 把 D 的 valuation_range 规整成可画的形式。
   * 返回 null 表示「画不了」—— 这时候宁可整条落选，也不猜一个值出来。
   *
   * ★ 2026-10-13：单位从 r.unit 改成 r.currency。
   *   D 的字段名就是 currency（"元/股"），旧代码读 unit 读的是 C 的口径。
   *   两个都认是有意的：只要将来谁改回 unit，这页不会静默丢掉单位。
   */
  function normaliseRange(r) {
    if (!r || typeof r !== "object") return null;
    var low = num(r.low), high = num(r.high), mid = num(r.mid);
    if (low === null || high === null) return null;

    var reversed = false;
    if (low > high) {                       /* 数据写反了：照样画，但要报出来 */
      var t = low; low = high; high = t;
      reversed = true;
    }
    var unit = (typeof r.currency === "string" && r.currency)
            || (typeof r.unit === "string" && r.unit) || null;
    return { low: low, high: high, mid: mid, unit: unit, reversed: reversed };
  }

  /* ==================================================================== */
  /* 刻度                                                                  */
  /* ==================================================================== */
  /* 纯函数，好测。选 1 / 2 / 2.5 / 5 / 10 × 10^k 作步长 —— 这样刻度上
     出现的都是 12.5、15、17.5 这种读得下去的数，不会冒出 13.37。 */
  function niceScale(lo, hi, wantTicks) {
    wantTicks = wantTicks || 5;
    lo = num(lo);
    hi = num(hi);
    if (lo === null || hi === null) return null;
    if (lo > hi) { var t = lo; lo = hi; hi = t; }

    var span = hi - lo;
    if (!(span > 0)) {
      /* 区间退化成一个点（low === high）：人为撑开，否则除零 */
      var pad0 = Math.abs(lo) * 0.1 || 1;
      lo -= pad0; hi += pad0; span = hi - lo;
    }

    /* 两端各留 5% 余量，条形不会顶到尺子边缘 */
    var pad = span * 0.05;
    lo -= pad; hi += pad;
    span = hi - lo;

    var raw = span / wantTicks;
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var norm = raw / mag;
    var stepUnit = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    var step = stepUnit * mag;

    var min = Math.floor(lo / step) * step;
    var max = Math.ceil(hi / step) * step;

    var ticks = [];
    for (var x = min; x <= max + step * 1e-9; x += step) {
      ticks.push(Math.round(x * 1e6) / 1e6);     /* 抹掉浮点累加的尾数 */
    }
    return {
      min: min, max: max, step: step, ticks: ticks, log: false,
      pos: linearPos(min, max)
    };
  }

  /* 对数刻度：等比的量要在同一把尺上比，只能取对数。
     刻度取 1 / 2 / 5 × 10^k —— 与 niceScale 同一套「读得下去的数」原则。 */
  function logScale(lo, hi) {
    lo = num(lo); hi = num(hi);
    if (lo === null || hi === null) return null;
    if (lo > hi) { var t = lo; lo = hi; hi = t; }
    if (!(lo > 0)) return null;              /* 对数刻不容 0 与负数 → 放弃 */
    if (lo === hi) { lo /= 2; hi *= 2; }

    var lmin = Math.log10(lo), lmax = Math.log10(hi);
    var pad = (lmax - lmin) * 0.05;
    lmin -= pad; lmax += pad;

    var ticks = [];
    var dmin = Math.pow(10, lmin), dmax = Math.pow(10, lmax);
    for (var e = Math.floor(lmin); e <= Math.ceil(lmax); e++) {
      [1, 2, 5].forEach(function (m) {
        var val = m * Math.pow(10, e);
        if (val >= dmin && val <= dmax) ticks.push(val);
      });
    }
    var lg = function (x) { return x > 0 ? Math.log10(x) : lmin; };
    return {
      min: dmin, max: dmax, ticks: ticks, log: true,
      pos: function (x) { return (lg(x) - lmin) / (lmax - lmin) * 100; }
    };
  }

  function linearPos(min, max) {
    var span = max - min;
    return function (x) { return (x - min) / span * 100; };
  }

  /**
   * 选刻度类型。
   *
   * ★ 为什么需要这一步（不是炫技，是这页能不能读的问题）：
   *   600519 的相对估值是 413.91–660.13，DCF 是 1,267.32–24,654.14，
   *   跨度 60 倍。线性刻度下那条相对估值的条只有整幅宽度的 **0.95%** ——
   *   视觉上等于不存在，而它恰恰是这页要展示的两条之一。
   *   对数刻度下两条都看得见（相对估值约 11% 宽，DCF 约 71%）。
   *
   *   这是**坐标轴的选择**（与 niceScale 取整同类），不是重新估值；
   *   标尺上会明确标出「对数刻度」，不会让读者误读成线性比例。
   *   两个区间量级相当（跨度 < 10 倍）时仍走线性 —— 那才是默认读法。
   */
  function chooseScale(lo, hi) {
    var a = num(lo), b = num(hi);
    if (a === null || b === null) return null;
    if (a > b) { var t = a; a = b; b = t; }
    if (a > 0 && b / a >= LOG_THRESHOLD) return logScale(a, b);
    return niceScale(a, b, 5);
  }

  /* 数值显示：留够精度再抹掉末尾的 0。
     直接用步长的小数位去格式化会出事 —— 步长 2.5 时 15.8 会被舍成 15.8→没问题，
     但 20.15 会被舍成 20.2，精度就丢了。所以统一按 4 位格式化再 trim：
     15.8 → "15.8"，20 → "20"，20.15 → "20.15"。 */
  function trimNum(fmt, v) {
    var s = fmt.num(v, 4);
    if (s === fmt.MISSING) return s;
    if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s;
  }

  /* 刻度标签：先 trim 再补千分位 —— 对数的 10000 该读作 "10,000" */
  function tickLabel(fmt, v) {
    return fmt.group(trimNum(fmt, v));
  }

  /* 两个区间的重叠段；不重叠返回 null（那是个结论，不是错误） */
  function overlapOf(a, b) {
    var lo = Math.max(a.low, b.low);
    var hi = Math.min(a.high, b.high);
    return hi > lo ? { low: lo, high: hi } : null;
  }

  /* ==================================================================== */
  /* ① 结论：D 的 blended                                                  */
  /* ==================================================================== */
  /* D 原话（写进 contract.js 的注释里）：「融合每股价值、相对现价的上行空间、
     低估或高估的结论，**E 页面的头条数字**，最有用的一块」。
     所以这一块排在最前 —— 先回答「贵还是便宜」，再给推导。 */
  function conclusionCard(ui, fmt, v) {
    var box = ui.card();
    box.appendChild(ui.subhead("估值结论"));

    var b = v.blended;

      box.appendChild(ui.note(

    /* --- 三个大数 --- */
    /* 落点走 .ro-stats：只有字号没有背景，是全站「大而不用玻璃」的唯一写法。

    var stats = ui.el("div", "ro-stats");

    [

    /* --- 估值构成：融合数是怎么拼出来的 --- */
    /* 这一段是这页最该有的东西 —— 它让「1,431.30」不再是凭空一个数：
       一半来自 DCF（2,325.59），一半来自相对估值（537.02），

        hr.appendChild(ui.el("th", null, h));

      b.components.forEach(function (c) {
        var tr = ui.el("tr");
        tr.appendChild(ui.el("td", "strong", fmt.text(c.label)));
        tr.appendChild(ui.el("td", "num metric-value", ps(fmt, c.per_share)));
        tr.appendChild(ui.el("td", "num",

      var sum = ui.el("tr");
      sum.appendChild(ui.el("td", "strong", "融合"));
      sum.appendChild(ui.el("td", "num metric-value", ps(fmt, b.blended_per_share)));
      sum.appendChild(ui.el("td", "num", "100.0%"));

               + (b.most_bearish ? "，最保守的是「" + b.most_bearish + "」" : "") + "。", "info"));
