  }

  /* ==================================================================== */
  /* ② 估值标尺                                                            */
  /* ==================================================================== */
  function rulerCard(ui, fmt, v) {
    var box = ui.card();
    box.appendChild(ui.subhead("估值区间对比"));

    var rows = [];
    var problems = [];
    METHODS.forEach(function (m) {
      var mod = v[m.key];
      var raw = mod && mod.valuation_range;
      var r = normaliseRange(raw);
      if (r) {
        r.label = m.label;
        r.tag = m.tag;
        rows.push(r);
      } else if (raw && (raw.low !== null || raw.high !== null)) {
        problems.push(m.label + " 的 valuation_range 缺 low / high，画不了标尺。");
      }
    });

    if (!rows.length) {
      box.appendChild(ui.empty(
        "两条估值区间都未提供（valuation.comps.valuation_range 与 "
             + "valuation.dcf.valuation_range 都没有 low / high）。"
             + "D 会在 valuation.warnings 里说明原因，见本页末尾。"));
      if (problems.length) box.appendChild(ui.note(problems.join(" "), "warn"));
      return box;
    }

    /* --- 单位口径：必须一致，且必须给出来 --- */
    var units = rows.map(function (r) { return r.unit; });
    var sameUnit = units.every(function (u) { return u === units[0]; });
    var unit = sameUnit ? units[0] : null;

    if (!sameUnit) {
      /* 单位不一致绝不能硬画 —— 那等于把两把不同刻度的尺子叠在一起 */
      box.appendChild(ui.note(
        "两条区间的单位不一致（" + units.map(function (u, i) {
          return rows[i].label + "：" + (u || "未标注");
        }).join("；") + "），无法画在同一把尺上。", "warn"));
      box.appendChild(rangeFallbackTable(ui, fmt, rows));
      return box;
    }
    if (!unit) {
      box.appendChild(ui.note(
        "valuation.*.valuation_range.currency 缺失 —— 本页不知道这些数字是"
             + "「元/股」还是「亿元总市值」，两种口径下图与结论都不是一回事。"
             + "已按无单位渲染。", "warn"));
    }

    /* 现价：D 给了才画。blended.current_price 与 market_data.price 是同一个数，
       前者在、后者缺时说得出「现价是多少但不知道是哪天的」，所以优先前者。 */
    var price = num(v.blended && v.blended.current_price);
    if (price === null) price = num(v.market_data && v.market_data.price);
    var priceDate = (v.market_data && v.market_data.price_date) || null;

    box.appendChild(ruler(ui, fmt, rows, unit, price, priceDate));
    box.appendChild(legend(ui, fmt, rows, unit, price));

    if (problems.length) box.appendChild(ui.note(problems.join(" "), "warn"));
    return box;
  }

  /* ---------------------------------------------------------------------
     标尺本体
     ---------------------------------------------------------------------
     分层顺序是这页的关键，写下来免得后面改坏：
       .vr-band       z-index 0 —— 最底层的重叠阴影
       .vr-track      **必须透明** —— 一旦给它填色，压在它下面的阴影就全被挡住了，
                                   整页的落点会无声消失（这个坑踩过一次）
       .vr-bar        半透明填充，压在两者之上 —— 重叠处 band+bar 自然更深
       .vr-dot        在条内，位置按 (mid-low)/(high-low) 换算
       .vr-priceline  在条内、**只在轨道高度内** —— 见下面注释
     行头文字（方法名 + 区间值）直接写出来，不靠 tooltip —— 这是不用 canvas
     换来的代价，也是它的好处：所有数字都是可选中的真文本，打印清晰。 */
  function ruler(ui, fmt, rows, unit, price, priceDate) {
    /* 刻度域 = 两条区间 ∪ 现价。
       现价必须进定义域，否则它可能落在尺子外面 —— 「比区间高还是低」
       正是这条线要回答的问题，画到框外就白画了。 */
    var lo = Math.min.apply(null, rows.map(function (r) { return r.low; }));
    var hi = Math.max.apply(null, rows.map(function (r) { return r.high; }));
    if (price !== null) { lo = Math.min(lo, price); hi = Math.max(hi, price); }

    var sc = chooseScale(lo, hi);
    /* sc 为 null 只可能发生在数值不是有效数字时，而那种行已经被
       normaliseRange 滤掉了。留个兜底，免得万一崩掉整页。 */
    if (!sc) return ui.note("刻度计算失败：区间数值不是有效数字。", "warn");

    /* 位置一律取 2 位小数再拼进 inline style。
       不这样做的话会写出 left:16.666666666666664% 这种噪声，虽然浏览器能认，
       但审查代码和读数时都是干扰。 */
    var pos = function (x) { return Math.round(sc.pos(x) * 100) / 100; };

    var box = ui.el("div", "vr");

    /* --- 单位与刻度说明 + 现价图例 --- */
    var cap = ui.el("div", "vr-unit");
    var parts = ["单位：" + (unit || "未标注")];
    if (sc.log) parts.push("刻度：对数（两法区间跨度过大，线性刻度会让窄的那条消失）");
    if (price !== null) {
      parts.push("竖线＝现价 " + ps(fmt, price) + (priceDate ? "（" + priceDate + "）" : ""));
    }
    cap.textContent = parts.join("　·　");
    box.appendChild(cap);

    /* --- 刻度条 --- */
    var tickStrip = ui.el("div", "vr-ticks");
    sc.ticks.forEach(function (t, i) {
      var cls = "vr-tick";
      if (i === 0) cls += " is-first";
      if (i === sc.ticks.length - 1) cls += " is-last";
      var lab = ui.el("span", cls, tickLabel(fmt, t));
      lab.style.left = pos(t) + "%";
      tickStrip.appendChild(lab);
    });
    box.appendChild(tickStrip);

    /* --- 绘图区：网格线 + 重叠带 + 两行区间条 --- */
    var plot = ui.el("div", "vr-plot");

    var grid = ui.el("div", "vr-grid");
    sc.ticks.forEach(function (t) {
      var g = ui.el("span", "vr-gridline");
      g.style.left = pos(t) + "%";
      grid.appendChild(g);
    });
    plot.appendChild(grid);

    /* 重叠段：画在最底层，两条半透明的区间条压上去，
       重叠处的颜色自然更深 —— 这就把「两个方法都认这个价」画出来了。 */
    var ov = null;
    if (rows.length === 2) ov = overlapOf(rows[0], rows[1]);
    if (ov) {
      var band = ui.el("div", "vr-band");
      band.style.left = pos(ov.low) + "%";
      band.style.width = (pos(ov.high) - pos(ov.low)) + "%";
      plot.appendChild(band);
    }

    var list = ui.el("div", "vr-rows");
    rows.forEach(function (r) {
      var row = ui.el("div", "vr-row");

      var head = ui.el("div", "vr-row-head");
      head.appendChild(ui.el("span", "vr-name", r.label));
      var vals = ui.el("span", "vr-vals");
      vals.appendChild(ui.el("span", "vr-range",
        cell(fmt, r.low) + " – " + cell(fmt, r.high) + (unit ? " " + unit : "")));
      if (r.mid !== null) {
        vals.appendChild(ui.el("span", "vr-mid", "中枢 " + cell(fmt, r.mid)));
      }
      head.appendChild(vals);
      row.appendChild(head);

      var track = ui.el("div", "vr-track");

      /* 现价竖线画在**轨道里**，不贯穿整幅高度：
         贯穿全高会从行头的方法名和区间值上切过去，读的时候正是干扰。
         位置与网格线同一套 pos()，所以线和刻度是对齐的。 */
      if (price !== null) {
        var pl = ui.el("span", "vr-priceline");
        pl.style.left = pos(price) + "%";
        track.appendChild(pl);
      }

      var bar = ui.el("div", "vr-bar");
      bar.style.left = pos(r.low) + "%";
      bar.style.width = (pos(r.high) - pos(r.low)) + "%";
      /* 中枢点：画在条内，位置按 (mid-low)/(high-low) 换算 */
      if (r.mid !== null && r.high > r.low) {
        var dot = ui.el("span", "vr-dot");
        dot.style.left = (Math.round((r.mid - r.low) / (r.high - r.low) * 10000) / 100) + "%";
        bar.appendChild(dot);
      }
      track.appendChild(bar);
      row.appendChild(track);
      list.appendChild(row);
    });
    plot.appendChild(list);
    box.appendChild(plot);

    if (rows.some(function (r) { return r.reversed; })) {
      box.appendChild(ui.note(
        "有区间的 low 大于 high（数据疑似写反），标尺已按大小顺序画，"
             + "但请核对原始数据。", "warn"));
    }
    return box;
  }

  /* 标尺下面的图例：把「阴影是什么」写成一句话，不让读者猜 */
  function legend(ui, fmt, rows, unit, price) {
    var lg = ui.el("div", "vr-legend");
    var suf = unit ? " " + unit : "";

    if (rows.length === 2) {
      var ov = overlapOf(rows[0], rows[1]);
      if (ov) {
        lg.appendChild(ui.el("span", "vr-legend-key is-band"));
        var txt = ui.el("span", "vr-legend-text");
        txt.appendChild(ui.el("strong", null,
          "两法重叠 " + cell(fmt, ov.low) + " – " + cell(fmt, ov.high) + suf));
        txt.appendChild(ui.el("span", "dim",
          "　两种估值方法都覆盖的价位，可信度相对更高"));
        lg.appendChild(txt);
      } else {
        /* ★ 用局部变量而不是 lg.lastChild —— 上一步刚 append 进去就回头取
           lastChild 是能跑，但那让这一段的正确性取决于「前面一行没被改」。
           直接拿着引用，改起来不会断。 */
        var ntxt = ui.el("span", "vr-legend-text");
        ntxt.appendChild(ui.el("strong", null, "两条区间不重叠："));
        ntxt.appendChild(ui.el("span", null,
          rows[0].label + " " + cell(fmt, rows[0].low) + " – " + cell(fmt, rows[0].high) + suf
            + "，"
            + rows[1].label + " " + cell(fmt, rows[1].low) + " – " + cell(fmt, rows[1].high) + suf
            + "，中间没有交集。市场法与绝对法给出的结论分歧到这个程度，"
            + "本身就是个值得讲的发现 —— D 已把它记进 warnings。"));
        lg.appendChild(ntxt);
      }
    } else {
      lg.appendChild(ui.el("span", "vr-legend-text dim",
        "当前只有一种方法的区间（另一种的 valuation_range 没有 low / high）。"
             + "单法区间照样能对着现价读高低。"));
    }

    /* 现价落在哪：这是标尺唯一的「结论性」读法，且完全是几何事实，
       不含 E 的判断 —— 竖线在条左侧就是区间高于现价，反之亦然。 */
    if (price !== null && rows.length) {
      var below = rows.filter(function (r) { return r.low > price; });
      var above = rows.filter(function (r) { return r.high < price; });
      var cover = rows.filter(function (r) { return r.low <= price && price <= r.high; });
      var seg = [];
      if (below.length) seg.push(below.map(function (r) { return r.label; }).join("、") + " 整段高于现价");
      if (cover.length) seg.push(cover.map(function (r) { return r.label; }).join("、") + " 覆盖现价");
      if (above.length) seg.push(above.map(function (r) { return r.label; }).join("、") + " 整段低于现价");
      if (seg.length) {
        lg.appendChild(ui.el("span", "vr-legend-text dim", "　现价 " + ps(fmt, price) + "：" + seg.join("；") + "。"));
      }
    }
    return lg;
  }

  /* 单位不一致时的降级：画不了尺子，就把两条区间并排列出来 */
  function rangeFallbackTable(ui, fmt, rows) {
    var tb = ui.el("table", "mini-table");
    var thead = ui.el("thead");
    var hr = ui.el("tr");
    ["方法", "区间", "中枢", "单位"].forEach(function (h) {
      hr.appendChild(ui.el("th", null, h));
    });
    thead.appendChild(hr);
    tb.appendChild(thead);

    var tbody = ui.el("tbody");
    rows.forEach(function (r) {
      var tr = ui.el("tr");
      tr.appendChild(ui.el("td", "strong", r.label));
      tr.appendChild(ui.el("td", "num metric-value",
        cell(fmt, r.low) + " – " + cell(fmt, r.high)));
      tr.appendChild(ui.el("td", "num", r.mid === null ? fmt.MISSING : cell(fmt, r.mid)));
      tr.appendChild(ui.el("td", "dim", r.unit || fmt.MISSING));
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);
    return tb;
  }

  /* ==================================================================== */
  /* ③ 两栏细节                                                            */
  /* ==================================================================== */

  /* 一行多格的键值条。值为空的格整格不出现 —— 一排「—」比少一格更难看，
     而且会让人以为「这里该有数但没取到」，其实那项对这家公司没意义
     （如茅台没有 EBITDA / 净债务）。 */
  function strip(ui, headLabel, pairs) {
    var keep = pairs.filter(function (p) {
      return p[1] !== null && p[1] !== undefined && p[1] !== "";
    });
    if (!keep.length) return null;
    var line = ui.el("div", "v-target");
    line.appendChild(ui.el("span", "v-target-label", headLabel));
    keep.forEach(function (p) {
      var it = ui.el("span", "v-target-item");
      it.appendChild(ui.el("span", "v-target-k", p[0]));
      it.appendChild(ui.el("span", "v-target-v", String(p[1])));
      line.appendChild(it);
    });
    return line;
  }

  /* 可比公司法。D 给了三样旧契约没有的东西：inputs（估值对象）、
     implied_value_per_share（每种倍数推出的每股价值）、peer_multiples（同行中位数）。
     旧版最缺的「本公司比同行贵还是便宜」这一行，现在直接用 implied 表回答。 */
  function compsCard(ui, fmt, comps) {
    var box = ui.card();
    box.appendChild(ui.subhead("相对估值 Comps"));

    if (!comps) {
      box.appendChild(ui.empty("Comps 数据未提供。"));
      return box;
    }

    /* --- 估值对象 --- */
    var inp = comps.inputs || {};
    var obj = strip(ui, "估值对象", [
      ["营业收入", moneyOf(fmt, inp.revenue)],
      ["归母净利润", moneyOf(fmt, inp.net_income)],
      /* 股 → 亿股：D 给的是原始股数（1,252,270,215 股），除以 1e8 再显示。
         与 moneyOf 把「元」归一到「亿元」同性质 —— 单位换算是显示刻度，
         不是重新算数据。（D 的 shares_unit 已注明单位是「股」。） */
      ["总股本", num(inp.shares_outstanding) === null
                   ? null : fmt.grouped(inp.shares_outstanding / 1e8, 2) + " 亿股"],
      ["市值", moneyOf(fmt, inp.market_cap)],
      ["股价", num(inp.share_price) === null ? null : ps(fmt, inp.share_price)]
    ]);
    if (obj) box.appendChild(obj);

    /* --- 倍数法推出来的每股价值 --- */
    /* 这张表是「本公司相对同行贵还是便宜」的答案本身：
       用同行的 PE 中位数乘本公司的盈利，得到 660.13 元/股。
       数值全部来自 D 的 implied_value_per_share，E 不做乘法。 */
    var imp = comps.implied_value_per_share || null;
    var impRows = [];
    if (imp) {
      [["pe", "PE"], ["pb", "PB"], ["ps", "PS"], ["ev_ebitda", "EV/EBITDA"]].forEach(function (m) {
        var o = imp[m[0]];
        if (!o) return;
        var mid = num(o.mid), lo = num(o.low), hi = num(o.high);
        if (mid === null && lo === null && hi === null) return;
        var med = comps.peer_multiples && comps.peer_multiples[m[0]]
                ? num(comps.peer_multiples[m[0]].median) : null;
        impRows.push([
          { text: m[1], cls: "strong" },
          { text: med === null ? fmt.MISSING : fmt.multiple(med), cls: med === null ? "dim" : "num" },
          { text: mid === null ? fmt.MISSING : ps(fmt, mid), cls: mid === null ? "dim" : "num metric-value" },
          { text: (lo === null && hi === null) ? fmt.MISSING
                  : (lo === null ? "≤ " : cell(fmt, lo) + " – ") + (hi === null ? "" : cell(fmt, hi)), cls: "num dim" }
        ]);
      });
    }
    if (impRows.length) {
      box.appendChild(ui.el("div", "block-sub", "同行倍数推出的每股价值"));
      /* ★ 2026-10-13：这张表和下面的「可比公司」原来是本卡里**唯一两张
         没套 .table-scroll 的表**。窄屏（vw ≈1050–1130）卡内容区只剩 276px，
         6 列挤不下时它们不会滚，而是从卡片右边漏出去压住隔壁的 DCF 卡 ——
         用户报的「两个面板重合」。补上外层容器，与本卡其余表一致。 */
      box.appendChild(scrollWrap(ui, miniTable(ui, ["倍数", "同行中位数", "隐含每股价值（元/股）", "区间"], impRows)));
      box.appendChild(ui.note(
        "「隐含每股价值」是 D 用同行倍数算出来的，E 不做乘法。"
             + "只有填了中位数的倍数才有隐含值 —— 空的那几行不是算错，是同行样本不足。", "info"));
    }

    /* --- 可比公司明细 --- */
    var peers = comps.peer_companies;
    if (peers && peers.length) {
      box.appendChild(ui.el("div", "block-sub", "可比公司"));
      var rows = peers.map(function (p) {
        return [
          { text: fmt.text(p.name), cls: "strong" },
          { text: fmt.text(p.ticker), cls: "dim" },
          { text: fmt.multiple(p.pe), cls: "num" },
          { text: fmt.multiple(p.pb), cls: "num" },
          { text: fmt.multiple(p.ev_ebitda), cls: "num" },
          { text: fmt.multiple(p.ps), cls: "num" }
        ];
      });
      box.appendChild(scrollWrap(ui, miniTable(ui, ["可比公司", "代码", "PE", "PB", "EV/EBITDA", "PS"], rows)));
      box.appendChild(ui.note(
        "倍数口径（静态 / TTM / 前瞻）D 未标注。本表 5 家的倍数齐全，"
             + "但推出来的每股价值只有 PE 与 PS 两个 —— 差额在同行样本的聚合口径上。", "info"));
    } else {
      box.appendChild(ui.empty("可比公司清单未提供。"));
    }
    /* 这里**刻意不再重复一遍估值区间** —— 标尺的行头已经写了。
       两张卡回答的是「这个数怎么来的」，标尺回答「这个数在哪」，
       同一个数字在一屏里出现两次会稀释标尺的分量。 */
    return box;
  }

  /* 绝对估值法：买什么假设、这些假设把终值推到多重 */
  function dcfCard(ui, fmt, dcf) {
    var box = ui.card();
    box.appendChild(ui.subhead("绝对估值 DCF"));

    if (!dcf) {
      box.appendChild(ui.empty("DCF 数据未提供。"));
      return box;
    }

    var a = dcf.inputs || dcf.assumptions || null;
    if (a) {
      box.appendChild(ui.kv([
        ["WACC",        a.wacc === null || a.wacc === undefined ? fmt.MISSING : fmt.percent(a.wacc)],
        ["永续增长率",   a.terminal_growth === null || a.terminal_growth === undefined ? fmt.MISSING : fmt.percent(a.terminal_growth)],
        ["预测期",       a.forecast_years === null || a.forecast_years === undefined ? fmt.MISSING : a.forecast_years + " 年"],
        ["所得税率",     a.tax_rate === null || a.tax_rate === undefined ? fmt.MISSING : fmt.percent(a.tax_rate)],
        ["收入基数",     moneyOf(fmt, a.revenue_base) || fmt.MISSING],
        ["EBIT 利润率",  a.ebit_margin === null || a.ebit_margin === undefined ? fmt.MISSING : fmt.percent(a.ebit_margin)]
      ]));
    }

    /* 终值假设：DCF 的成败八成在这一格。
       tv_pct_of_ev（终值占企业价值 87%）是读者最该看到的一个数 ——
       它说明这个模型实质上是在押几年以后的事。 */
    var t = dcf.terminal_assumptions || null;
    if (t) {
      var pairs = [
        ["终值占企业价值", t.tv_pct_of_ev === null || t.tv_pct_of_ev === undefined ? fmt.MISSING : fmt.percent(t.tv_pct_of_ev)],
        ["永续期自由现金流", moneyOf(fmt, t.terminal_fcff)],
        ["终值（现值）", moneyOf(fmt, t.pv_terminal_value)],
        ["退出倍数", t.exit_multiple === null || t.exit_multiple === undefined ? fmt.MISSING : fmt.multiple(t.exit_multiple)]
      ];
      var line = strip(ui, "永续期假设", pairs);
      if (line) box.appendChild(line);

      /* 两种终值算法的偏离度 —— 这是 D 自己算的，也是它 warnings 的第一条。 */
      if (t.tv_gordon !== null && t.tv_gordon !== undefined
          && t.tv_exit !== null && t.tv_exit !== undefined) {
        var d = ui.el("div", "v-target");
        d.appendChild(ui.el("span", "v-target-label", "终值两种算法"));
        [["Gordon 增长模型", moneyOf(fmt, t.tv_gordon) || fmt.MISSING],
         ["退出倍数法", moneyOf(fmt, t.tv_exit) || fmt.MISSING],
         ["两者偏离", t.tv_divergence === null || t.tv_divergence === undefined
                        ? fmt.MISSING : fmt.percent(t.tv_divergence)]
        ].forEach(function (p) {
          var it = ui.el("span", "v-target-item");
          it.appendChild(ui.el("span", "v-target-k", p[0]));
          it.appendChild(ui.el("span", "v-target-v", p[1]));
          d.appendChild(it);
        });
        box.appendChild(d);
      }
    }

    box.appendChild(ui.note(
      "假设值由 D 给定，E 不调整。终值偏离与占比的具体判断见本页末尾「估值告警」"
           + "—— D 已经把这些写成告警了，这里不重述。", "info"));
    /* 同 compsCard：区间交给标尺，这里不重复 */
    return box;
  }

  /* ==================================================================== */
  /* ④ DCF 逐年预测                                                        */
  /* ==================================================================== */
  /* 放在整幅宽度上：六列数字在 half-width 里会挤成一团。
     这张表回答的是「DCF 的钱从哪几年折出来的」。 */
  function forecastCard(ui, fmt, dcf) {
    var list = dcf && dcf.forecast;
    if (!Array.isArray(list) || !list.length) return null;

    var box = ui.card();
    box.appendChild(ui.subhead("DCF 逐年预测"));

    var rows = list.map(function (f) {
      return [
        { text: f.year === null || f.year === undefined ? "第 " + f.year_index + " 年" : String(f.year), cls: "strong" },
        { text: f.growth === null || f.growth === undefined ? fmt.MISSING : fmt.signedPercent(f.growth), cls: "num" },
        { text: moneyOf(fmt, f.revenue) || fmt.MISSING, cls: "num" },
        { text: moneyOf(fmt, f.ebit) || fmt.MISSING, cls: "num" },
        { text: moneyOf(fmt, f.fcff) || fmt.MISSING, cls: "num" },
        { text: f.discount_factor === null || f.discount_factor === undefined ? fmt.MISSING : fmt.num(f.discount_factor, 3), cls: "num dim" },
        { text: moneyOf(fmt, f.pv_fcff) || fmt.MISSING, cls: "num metric-value" }
      ];
    });
    box.appendChild(miniTable(ui,
      ["年度", "收入增速", "营业收入（亿元）", "EBIT（亿元）",
       "自由现金流（亿元）", "折现因子", "现值（亿元）"], rows));
    box.appendChild(ui.note(
      "预测期内的现值合计只占 DCF 结论的一小部分 —— 剩下的大头在永续终值，"
           + "也就是上面「终值占企业价值」那一格。", "info"));
    return box;
  }

  /* ==================================================================== */
  /* ⑤ 敏感性与三情景                                                      */
  /* ==================================================================== */
  /* 两件事放一张卡：都在回答「结论对假设有多敏感」，只是问法不同 ——
     前者问「WACC 与永续增长各动 1%，每股价值怎么变」，
     后者问「三套打包好的假设各给出什么价」。 */
  function sensitivityCard(ui, fmt, v) {
    var s = v.dcf && v.dcf.sensitivity;
    var scen = v.scenarios;
    var hasSens = s && Array.isArray(s.matrix) && s.matrix.some(function (r) {
      return Array.isArray(r) && r.some(function (x) { return num(x) !== null; });
    });
    var hasScen = scen && ["bull", "base", "bear"].some(function (k) {
      var o = scen[k];
      return o && (num(o.per_share) !== null || num(o.equity_value) !== null);
    });
    if (!hasSens && !hasScen) return null;

    var box = ui.card();
    box.appendChild(ui.subhead("假设的敏感性"));

    /* --- 5×5 矩阵 --- */
    if (hasSens) {
      var waccs = s.wacc_values || [];
      var tgs = s.terminal_growth_values || [];
      var baseW = num(s.base_wacc), baseG = num(s.base_growth);
      /* 基准格的下标：在 D 给的坐标轴数组里找出等于 base 的那一格。
         找不到就不标 —— 猜一个下标去高亮是最容易埋错的地方。 */
      var bRow = -1, bCol = -1;
      waccs.forEach(function (w, i) { if (num(w) === baseW) bRow = i; });
      tgs.forEach(function (g, i) { if (num(g) === baseG) bCol = i; });

      /* 表头：第一列是行轴名（WACC），其余是永续增长的各档。
         纵轴与横轴的角色从 D 的矩阵形状定死：matrix 的一行对应一个 WACC，
         一行里的各格对应 terminal_growth_values 的各档。
         靠这个约定才敢把 base_wacc 的下标拿去标记 —— 见下面的 bRow/bCol。

         ★ 2026-10-13 第六轮起，这张表的基准标记改过四稿，过程记在
         components.css 的 .cell-tag 上面。**这一轮（第八轮）的结论是：
         标记从数据格整体挪到两条轴的表头上。**
         基准列的表头挂一个「基准」，基准行的行轴格挂一个「基准」——
         交叉那一格被两把尺子同时指到，格子里不需要再有任何记号。
         这样拆的理由：数据格只有一列宽（≈150px），塞进任何东西都会
         把等宽矩阵挤变形（实测基准列会从 159 撑到 225px），
         而两条轴的表头本来就有富余（第一列 238px@1600 … 165px@1200，
         数字表头 150px 上下）。挪的代价是零。 */
      var headers = ["WACC ＼ 永续增长"];
      tgs.forEach(function (g, ci) {
        headers.push({ text: fmt.percent(g), tag: ci === bCol ? "基准" : null });
      });

      var rows = waccs.map(function (w, ri) {
        var cells = [{
          text: fmt.percent(w), cls: "strong",
          tag: ri === bRow ? "基准" : null
        }];
        tgs.forEach(function (g, ci) {
          var val = (s.matrix[ri] || [])[ci];
          cells.push({
            text: num(val) === null ? fmt.MISSING : cell(fmt, val),
            cls: "num" + (num(val) === null ? " dim" : "")
          });
        });
        return cells;
      });
      box.appendChild(ui.el("div", "block-sub",
        "每股价值对 WACC × 永续增长率（" + (s.unit || "元/股") + "）"));
      if (bRow >= 0 && bCol >= 0) {
        /* ★ 2026-10-13 第八轮：说明里不再出现「框住的那一格」——
           两条轴上各挂了一个写着「基准」的标签，说明不必再当图例使唤。
           它现在只干图例干不了的那件事：**说清其余各格是什么**。
           （前七轮这段越写越长，正是因为它在替一个没有字的标记做解释。） */
        box.appendChild(ui.note(
          "带「基准」标签的那一行和那一列（WACC " + fmt.percent(baseW)
               + " × 永续增长 " + fmt.percent(baseG) + "）是 D 的基准假设，"
               + "也就是 DCF 主口径用的那一组，两轴交点就是主口径算出的价。"
               + "其余各格是 D 按同一套模型换一组假设得到的价 ——"
               + "表格读的是「结论对假设有多敏感」，不是「哪一格更好」。", "info"));
      }
      box.appendChild(scrollWrap(ui, miniTable(ui, headers, rows)));
    }

    /* --- 三情景 --- */
    if (hasScen) {
      box.appendChild(ui.el("div", "block-sub", "三情景"));
      var rows2 = ["bull", "base", "bear"].map(function (k) {
        var o = scen[k];
        if (!o) return null;
        return [
          { text: (o.label || { bull: "乐观", base: "基准", bear: "悲观" }[k]), cls: "strong" },
          { text: num(o.per_share) === null ? fmt.MISSING : ps(fmt, o.per_share),
            cls: "num metric-value" + (num(o.per_share) === null ? " dim" : "") },
          { text: moneyOf(fmt, o.equity_value) || fmt.MISSING, cls: "num" },
          { text: num(o.growth_y1) === null ? fmt.MISSING : fmt.signedPercent(o.growth_y1), cls: "num" },
          { text: num(o.ebit_margin) === null ? fmt.MISSING : fmt.percent(o.ebit_margin), cls: "num" },
          { text: num(o.wacc) === null ? fmt.MISSING : fmt.percent(o.wacc), cls: "num" },
          { text: num(o.terminal_growth) === null ? fmt.MISSING : fmt.percent(o.terminal_growth), cls: "num" }
        ];
      }).filter(Boolean);

      box.appendChild(scrollWrap(ui, miniTable(ui,
        ["情景", "每股价值", "隐含股权价值（亿元）", "首年增速", "EBIT 利润率", "WACC", "永续增长"], rows2)));

      /* 情景的杠杆单独列 —— 塞进表格会撑爆列宽，而它恰恰是「这三套假设
         差在哪」的答案，不能省。 */
      var lev = ui.el("ul", "warn-list");
      ["bull", "base", "bear"].forEach(function (k) {
        var o = scen[k];
        if (!o || !o.levers) return;
        var li = ui.el("li", null, (o.label || k) + "：" + o.levers);
        lev.appendChild(li);
      });
      /* 用 children 而不是 childNodes —— 这里数的是**元素**，不是文本节点，
         而且 children 在渲染桩里也有。 */
      if (lev.children.length) box.appendChild(lev);
    }
    return box;
  }

  /* ==================================================================== */
  /* ⑥ 告警与来源                                                          */
  /* ==================================================================== */
  /* 契约注释写得很清楚：「warnings 是结论的一部分，不是报错」。
     缺行情、缺可比公司、跳过 SOTP 这些**都写在这里**。必须显示它们 ——
     否则用户看到一片空白，不知道是「这家公司不值钱」还是「数据没取到」。
     这两者天差地别。
     所以 valuation.sotp 不另起一块：它的 skip 理由就在这张清单里，
     同一句话在一屏出现两次是噪声。 */
  function warningsCard(ui, fmt, v) {
    var warns = Array.isArray(v.warnings) ? v.warnings : [];
    var sources = Array.isArray(v.sources) ? v.sources : [];
    var disc = v.disclaimer;
    if (!warns.length && !sources.length && !disc) return null;

    var box = ui.card();
    box.appendChild(ui.subhead("估值告警与数据来源"));

    if (warns.length) {
      /* 用 .warn-title + .warn-list 而不是逐条 .note-warn：
         7 条带左边框和底纹的段落连排会变成一堵墙，
         而要的只是「这里有 7 件事你该知道」的语气。 */
      box.appendChild(ui.el("div", "warn-title",
        "D 记录的估值告警（" + warns.length + " 项）"));
      var ul = ui.el("ul", "warn-list");
      warns.forEach(function (w) { ul.appendChild(ui.el("li", null, String(w))); });
      box.appendChild(ul);
    }

    if (sources.length) {
      box.appendChild(ui.el("div", "block-sub", "数据来源"));
      var rows = sources.map(function (s) {
        return [
          { text: fmt.text(s.name), cls: "strong" },
          { text: fmt.text(s.purpose), cls: "dim" },
          { text: fmt.text(s.as_of), cls: "num dim" },
          { text: s.official === true ? "官方" : "第三方", cls: "dim" }
        ];
      });
      box.appendChild(scrollWrap(ui, miniTable(ui, ["来源", "用途", "取数日期", "性质"], rows)));
    }

    if (disc) box.appendChild(ui.note(String(disc), "info"));
    return box;
  }

  /* ==================================================================== */
  /* 表格小工具                                                            */
  /* ==================================================================== */

  /* 表。一格可以是三种东西：
       · 字符串         → 直出
       · { text, cls }  → 带类名的文字
     空值统一显示成破折号并挂 .dim —— 不是留白，是明确地说「这里没有」。 */
  /* 表头和表体的每一格都可以是字符串，也可以是 {text, cls, tag}。
     tag = 格内小标签（现在只有敏感性矩阵的基准行 / 基准列在用）。
     ★ 不带 tag 的格子仍走纯 textContent，DOM 结构和以前一模一样 ——
       「顺手把所有格子都包一层 <span>」会改动另外三张表的输出，
       那些表有测试钉着，没有必要为一条新特性去动它们。 */
  function miniTable(ui, headers, rows) {
    var tb = ui.el("table", "mini-table");
    var thead = ui.el("thead");
    var hr = ui.el("tr");
    headers.forEach(function (h) {
      var th = ui.el("th");
      var text = (h && typeof h === "object") ? h.text : h;
      th.textContent = String(text);
      if (h && typeof h === "object" && h.tag) {
        th.appendChild(ui.el("span", "cell-tag", h.tag));
      }
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    tb.appendChild(thead);

    var tbody = ui.el("tbody");
    rows.forEach(function (cells) {
      var tr = ui.el("tr");
      cells.forEach(function (c) {
        var td = ui.el("td");
        var text = (c && typeof c === "object") ? c.text : c;
        var cls = (c && typeof c === "object") ? c.cls : null;
        if (text === null || text === undefined || text === "") {
          text = "—";
          cls = "dim";
        }
        if (cls) td.className = cls;
        td.textContent = String(text);
        /* 标签排在值**后面**：它只挂在行轴那一格上，那格是左对齐的，
           「4.63% 基准」顺着读下来才对。数值列里没有标签，无关对齐。 */
        if (c && typeof c === "object" && c.tag) {
          td.appendChild(ui.el("span", "cell-tag", c.tag));
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);
    return tb;
  }

  /* 列多的表在窄屏/打印时会溢出，套一层横向滚动。
     .mini-table 自己是 overflow:hidden，直接溢出会被裁掉。 */
  function scrollWrap(ui, node) {
    var w = ui.el("div", "table-scroll");
    w.appendChild(node);
    return w;
  }
})();

</script>
<script>
/* ================= js/pages/p6-memo.js ================= */
/* ============================================================================
 * p6-memo.js —— 页面6 投研报告
 * ----------------------------------------------------------------------------
 * 职责：把 D 的投研简报**绑定表**（memo.json）排成一页报告。
 * 数据来源：data/memo 走 FinScope.data 的 memo* 系列取值器 → ctx.memo
 *
 * 【2026-10-13 全量重写：这一页原来等的东西根本不会来】
 *
 *   旧版读 `report.title / rating / target_price / summary / sections[]`，
 *   并在空状态下列了一份「E 向 D 建议的报告字段结构」。那份结构**没有
 *   被采纳，也不会被采纳** —— D 的交法是另一种：它不交「报告对象」，
 *   它交一张**占位符 → 已格式化字符串的绑定表**：
 *
 *     meta                     抬头（公司名 / 代码 / 报告期 / 生成时间 / 引擎）
 *     columns[7]               七节标题的**原文**（D 写的，E 不自己起标题）
 *     scalars[]                56 条 { placeholder, source_path, raw_value, formatted }
 *     collections[12]          12 张具名列表，每格同样是 { formatted }
 *     numbers[]                151 个数字 token 及其来源路径（合规扫描用）
 *     compliance / validation  D 自己的合规闸门结果
 *
 *   所以这一页的读法是：**直出 formatted**。这是全站唯一一页 E 不做数字
 *   格式化 —— D 已经把 168838102514.79 写成 "1,688.38 亿元" 了，E 再走一遍
 *   fmt.money 只会制造两处口径。**E 也不连句**：正文的句子（「综合估值结论：
 *   低估。融合每股价值…」）在 memo.md / memo.html 里，**不在 memo.json 里**，
 *   而授权是「页面 6 从 D 的 memo.json 读」—— 所以本页呈现的是数字与列表，
 *   不是成段的叙述。要成段叙述，得请 D 把那些句子也做成绑定项。见 spec。
 *
 * 【七节怎么对应】
 *   columns[0..6] 原样做标题；内容按**下标**分发。下标是硬约定 ——
 *   D 若调换章节顺序，这里会静默错位，所以 spec 里写明了「columns 顺序即契约」。
 *
 * 【版式定案】
 *   1. 用 .paper（报告纸）：这一页是文档，不是仪表盘。46em 居中。
 *   2. **不嵌套玻璃**。.paper 本身是强玻璃，页内不再放 .card / .metric-card ——
 *      玻璃叠玻璃会互相取样。行内小构件一律走**实底/底纹**那一档：
 *      .v-target（一行多格的键值条）、.mini-table（表）、.risk-*（风险卡）。
 *   3. 落点在第一节：三个大数（结论 / 融合每股价值 / 相对现价空间）走
 *      .ro-stats —— 它只有字号没有背景，是站上唯一「大而不用玻璃」的写法。
 *   4. **缺值不涂色、不解释**。D 把缺失写成 "数据缺失"，本页照原样显示，
 *      只挂一个 .dim 让它退后（改文案就是改 D 的内容）。
 *
 * 注意：E 不撰写报告内容，也不重算任何数。本页唯一的运算有两处，都是
 *       绘制行为：① 把 D 给的 " | " 分隔字符串拆回表格列（敏感性矩阵）；
 *       ② 给每股数值补一个单位后缀（D 的 scalars 不带 unit 字段）。
 *       两处都在 spec 里记了对 D 的请求。
 * ==========================================================================*/

(function () {
  "use strict";
  var F = (window.FinScope = window.FinScope || {});
  F.pages = F.pages || {};

  /* ------------------------------------------------------------------ */
  /* 常量                                                                */
  /* ------------------------------------------------------------------ */

  /* D 的缺失标记。memo.json 里所有取不到的值都被 D 写成这一串 ——

  var SCALARS = {

  /* memo 的 risks / top_risks 集合只给 severity_tag（中文），

  var SEV_BY_TAG = {

  F.pages.p6 = {

    spec: [
      "「正文句子不在 memo.json 里」。D 的 memo.md 有「综合估值结论：低估。"
        + "融合每股价值 1,431.30 元/股……」这样的成段叙述，但那是 D 的模板"

        + "所以本页现在是数字与列表，不是叙述。若要在页面上读成段的结论，"
        + "需要 D 把那些句子也做成集合项（如 sections[]），E 侧不需要改结构",
      "scalars[] 不带 unit 字段 → 每股类数值的单位（元/股）由 E 在 SCALARS 表里"
        + "逐条硬写。D 若给 scalars 补一个 unit 字段，这张表就能收掉一半",

      "「columns[7] 的顺序是硬约定」：本页按下标 0–6 分发七节内容。"
        + "D 若调整章节顺序，页面会静默错位（不报错、只是内容跑错节）。"
        + "若 D 打算动顺序，需要先同步 E",

      "risks / top_risks 集合没有 severity 代码（只有中文 severity_tag），"
        + "卡片染色靠 E 的反查表。D 若在集合里带上 severity，这张表就能删",

      "估值构成（DCF / 相对估值 两行）的「方法名」是 E 按 memo.md 的措辞写死的。"
        + "D 若愿意把 blended.components[] 也做成集合（blend_components），"
        + "这一处硬编码可以撤掉",

      "敏感性矩阵：D 把每行压成 \"a | b | c | d | e\" 一个字符串，本页按 \" | \" "
        + "拆回列。表头 sens_header_cells 用的是同一个分隔符，所以两边对得上 ——"
        + "但这是 E 在解析 D 的展示串，属于绘制行为。更好的做法是 D 直接给数组",

      "打印 / 导出 PDF（window.print）已可用；本页的风险卡默认全展开，"
        + "不需要依赖 app.js 的 beforeprint 展开逻辑"
    ],

    render: function (root) {
      var ui = F.ui, fmt = F.fmt, data = F.data;

      root.appendChild(ui.section(
        this.title,
        "由 D 的报告生成模块自动汇总前述分析结果，输出完整投研简报。"
             + "本节文字与数字全部来自该简报的绑定表，前端只做排版与导出。"
      ));

      if (!data.hasMemo()) {
        root.appendChild(emptyPaper(ui));
        root.appendChild(actions(ui));
        root.appendChild(specCard(this.spec, ui,
          "memo 绑定表未到场。本页读的是 D 的 out_data/reports/<key>/memo.json，"
               + "统一数据对象到不到位都不影响它 —— 两份是独立产物。"));
        return;
      }

      var meta = data.memoMeta() || {};
      var cols = data.memoColumns();

      var paper = ui.el("div", "paper");
      paperHead(ui, fmt, data, paper, meta);
      gateRow(ui, fmt, data, paper);

      secConclusion(ui, fmt, data, paper, cols[0]);
      secDashboard(ui, fmt, data, paper, cols[1]);
      secOperation(ui, fmt, data, paper, cols[2]);
      secRisks(ui, fmt, data, paper, cols[3]);
      secValuation(ui, fmt, data, paper, cols[4]);
      secReview(ui, fmt, data, paper, cols[5]);
      secSources(ui, fmt, data, paper, cols[6]);

      root.appendChild(paper);
      root.appendChild(actions(ui));
      root.appendChild(specCard(this.spec, ui, null));
    }
  };

  /* ==================================================================== */
  /* 通用小件                                                             */
  /* ==================================================================== */

  function isMiss(v) { return v === null || v === undefined || v === MISS_TEXT; }

  /* 读一个标量，补上 E 声明的单位后缀。取不到就返回 null，
     调用方据此**整格不放**（一排「—」比少一格更难看）。 */
  function val(data, key) {
    var s = data.memoValue(key);
    if (s === null || s === undefined || s === "") return null;
    var spec = SCALARS[key];
    if (!spec || !spec.unit) return s;
    return s + " " + spec.unit;
  }

  function labelOf(key) { return (SCALARS[key] && SCALARS[key].label) || key; }

  /* 一行多格的键值条。值为 null 的格整格不出现。 */
  function strip(ui, headLabel, pairs) {
    var keep = pairs.filter(function (p) { return !isMiss(p[1]); });
    if (!keep.length && !headLabel) return null;
    var box = ui.el("div", "v-target");
    if (headLabel) box.appendChild(ui.el("span", "v-target-label", headLabel));
    keep.forEach(function (p) {
      var item = ui.el("span", "v-target-item");
      item.appendChild(ui.el("span", "v-target-k", p[0]));
      item.appendChild(ui.el("span", "v-target-v" + (isMiss(p[1]) ? " dim" : ""), p[1]));
      box.appendChild(item);
    });
    return box;
  }

  /* 表。一格可以是三种东西：
       · 字符串                      → 直出
       · 一个 DOM 节点               → 直接放进去（状态胶囊那类）
       · { text, cls }               → 带类名的文字
     缺值的格（"数据缺失"）挂 .dim —— 只改视觉权重，不改文案。 */
  function table(ui, headers, rows) {
    var tb = ui.el("table", "mini-table");
    var thead = ui.el("thead");
    var hr = ui.el("tr");
    headers.forEach(function (h) { hr.appendChild(ui.el("th", null, h)); });
    thead.appendChild(hr);
    tb.appendChild(thead);

    var tbody = ui.el("tbody");
    rows.forEach(function (cells) {
      var tr = ui.el("tr");
      cells.forEach(function (c) {
        var td = ui.el("td");
        if (c && c.nodeType === 1) {
          td.appendChild(c);
        } else {
          var text = (c && typeof c === "object") ? c.text : c;
          var cls = (c && typeof c === "object") ? c.cls : null;
          if (isMiss(text)) { text = MISS_TEXT; cls = "dim"; }
          if (cls) td.className = cls;
          td.textContent = (text === null || text === undefined) ? "" : String(text);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);
    return tb;
  }

  /* 一行 memo 集合项 → 已格式化的字符串数组 */
  function rowOf(data, item, cols) {
    var r = data.memoRow(item, cols);
    return cols.map(function (c) { return r[c]; });
  }

  /* 节标题。**用 D 的 columns[i] 原文** —— E 不自己起标题。
     兜底（D 没给这一列时）才用 E 的通用词。 */
  function secHead(ui, title, fallback) {
    var t = (title === undefined || title === null || title === "") ? fallback : title;
    return ui.el("h2", "paper-h2", t);
  }

  /* 一小段灰字说明。**不用 .note**（它带左边框 + 底纹，在一页纸里太响），
     也不用 .block-sub（上边距是负数，本页的段落间距不都是小标题配的，
     套上去会撞到上面的表格边线）。朴素的灰段落在纸面上最不打扰。 */
  function muted(ui, text) { return ui.el("p", "dim", text); }

  /* ==================================================================== */
  /* 报告纸：抬头 + 合规闸门                                              */
  /* ==================================================================== */

  function paperHead(ui, fmt, data, paper, meta) {
    var name = meta.company_name || "（公司名称未提供）";
    var ticker = meta.ticker;
    paper.appendChild(ui.el("h1", "paper-title",
      ticker ? name + "（" + ticker + "）" : name));

    var row = ui.el("div", "paper-meta");
    [
      ["报告期", meta.report_period],
      ["行业", data.memoValue("industry")],
      ["上市地", data.memoValue("exchange")],
      ["币种", data.memoValue("currency_label")],
      ["生成时间", meta.generated_at],
      /* 引擎也走这一行：它是**可信度信息**不是身份信息 ——
         「数字全部代码注入、不经过语言模型」这句话决定了读者该怎么读
         这份简报，所以它必须在抬头就被看到，而不是埋在页脚。
         单起一行会撑高三行，塞进这条会自动换行的横排里最省。 */
      ["渲染引擎", meta.engine]
    ].forEach(function (kv) {
      if (kv[1] === null || kv[1] === undefined || kv[1] === "") return;
      row.appendChild(ui.el("span", null, kv[0] + "：" + kv[1]));
    });
    paper.appendChild(row);
  }

  /* D 自己的合规闸门。顶在正文最上面：「这份简报能信吗」得先回答。
     全绿时也只给一个胶囊 —— 一页报告不该在开头堆三个绿标。 */
  function gateRow(ui, fmt, data, paper) {
    var g = data.memoValidation();
    if (!g) return;

    var box = ui.el("div", "v-target");
    box.appendChild(ui.el("span", "v-target-label", "数字校验"));

    if (g.passed === true) {
      var n = (g.allowedCount !== null && g.allowedCount !== undefined)
        ? g.allowedCount + " 项全部可溯源" : "通过";
      box.appendChild(ui.el("span", "status-chip is-good", n));
    } else if (g.passed === false) {
      box.appendChild(ui.el("span", "status-chip is-bad", "未通过"));
    }

    if (g.violations.length) {
      box.appendChild(ui.el("span", "status-chip is-bad",
        g.violations.length + " 处越界数字"));
    }
    if (g.hits.length) {
      box.appendChild(ui.el("span", "status-chip is-watch",
        "合规命中 " + g.hits.length + " 处"));
    }
    /* 三个都没有时不摆一条空条 —— 那会让「没有闸门结果」和「闸门通过」
       长得一样。 */
    if (box.children.length > 1) paper.appendChild(box);
  }

  /* ==================================================================== */
  /* ① 结论摘要                                                           */
  /* ==================================================================== */
  function secConclusion(ui, fmt, data, paper, col) {
    paper.appendChild(secHead(ui, col, "结论摘要"));

    /* 落点：三个大数。走 .ro-stats —— 站上唯一「大而不用玻璃」的写法，
       放进 .paper 里不会造成玻璃叠玻璃。 */
    var stats = ui.el("div", "ro-stats");
    [
      ["verdict", "估值结论"],
      ["blended_ps", "融合每股价值"],
      ["upside", "相对现价空间"]
    ].forEach(function (s) {
      var v = val(data, s[0]);
      if (v === null) return;
      var it = ui.el("div", "ro-item");
      it.appendChild(ui.el("span", "ro-num", v));
      it.appendChild(ui.el("span", "ro-label", s[1]));
      stats.appendChild(it);
    });
    if (stats.children.length) paper.appendChild(stats);

    var s2 = strip(ui, "口径", [
      ["当前股价", val(data, "current_price")],
      ["终值占企业价值", val(data, "tv_pct")],
      ["触发风险", val(data, "risk_count")]
    ]);
    if (s2) paper.appendChild(s2);

    /* 估值构成。方法名是 E 按 memo.md 的措辞写的，见 spec。 */
    var comp = [];
    if (!isMiss(val(data, "dcf_ps")) || !isMiss(val(data, "comps_ps"))) {
      comp.push(["DCF（收益法）", val(data, "dcf_ps"), val(data, "dcf_weight")]);
      comp.push(["相对估值（市场法）", val(data, "comps_ps"), val(data, "comps_weight")]);
    }
    if (comp.length) {
      paper.appendChild(ui.subhead("估值构成"));
      paper.appendChild(table(ui, ["方法", "每股价值", "权重"], comp));
    }

    /* 主要风险（top_risks 是 D 从 risks 里挑出来的前几条，不是 E 挑的） */
    var top = data.memoCollection("top_risks");
    if (top.length) {
      paper.appendChild(ui.subhead("主要风险"));
      paper.appendChild(table(ui, ["编号", "等级", "风险", "评分"],
        top.map(function (it) {
          var r = data.memoRow(it, ["risk_id", "severity_tag", "risk_name", "score"]);
          return [r.risk_id, { text: r.severity_tag, cls: sevCell(r.severity_tag) },
                  r.risk_name, r.score];
        })));
    }
  }

  function sevCell(tag) {
    var code = SEV_BY_TAG[tag];
    if (code === "high") return "strong";
    return null;
  }

  /* ==================================================================== */
  /* ② 关键指标仪表盘                                                     */
  /* ==================================================================== */
  function secDashboard(ui, fmt, data, paper, col) {
    var items = data.memoCollection("dashboard");
    paper.appendChild(secHead(ui, col, "关键指标仪表盘"));
    if (!items.length) {
      paper.appendChild(muted(ui, "仪表盘数据未提供。"));
      return;
    }
    var COLS = ["label", "category", "value_str", "prev_str", "delta_str", "status_str"];
    paper.appendChild(table(ui, ["指标", "类别", "本期", "上期", "变动", "状态"],
      items.map(function (it) {
        var r = data.memoRow(it, COLS);
        return [r.label, r.category, r.value_str, r.prev_str, r.delta_str,
                statusCell(ui, r.status_str)];
      })));
  }

  /* D 已经把状态写成中文（"正常" / "数据缺失·待核验"）。E 不翻译、不改写，
     只在它含「待核验」时换成一个橙胶囊 —— 那是这一节唯一需要动作的格。
     十一个指标里正常的那十个不挂胶囊：挂满等于没挂。 */
  function statusCell(ui, s) {
    if (isMiss(s)) return { text: MISS_TEXT, cls: "dim" };
    if (s.indexOf("待核验") >= 0) return ui.el("span", "status-chip is-watch", s);
    return { text: s, cls: "dim" };
  }

  /* ==================================================================== */
  /* ③ 经营情况与变化归因                                                 */
  /* ==================================================================== */
  function secOperation(ui, fmt, data, paper, col) {
    paper.appendChild(secHead(ui, col, "经营情况与变化归因"));

    var lines = [
      ["收入线", [["营业收入", val(data, "revenue")],
                  ["同比", val(data, "revenue_growth")],
                  ["归母净利润", val(data, "ni_parent")],
                  ["同比", val(data, "ni_growth")]]],
      ["成本费用线", [["营业成本", val(data, "operating_cost")],
                      ["同比", val(data, "cost_growth")],
                      ["毛利率", val(data, "gross_margin")],
                      ["较上期", val(data, "gross_margin_delta")]]],
      ["现金流线", [["经营现金流净额", val(data, "ocf")],
                    ["同比", val(data, "ocf_growth")],
                    ["净现比", val(data, "cfo_to_ni")],
                    ["自由现金流", val(data, "fcf")]]]
    ];
    lines.forEach(function (L) {
      var s = strip(ui, L[0], L[1]);
      if (s) paper.appendChild(s);
    });

    /* 变化归因：杜邦分解 + 现金流桥。两块的原始出处都是 B 的证据链「归因」层，
       D 从那里搬过来的（memo.md 里写着「D 不新增叙述、不改写措辞」）。 */
    var dupont = [
      ["ROE 变动合计", val(data, "dupont_roe_delta")],
      ["净利率贡献", val(data, "dupont_net_margin")],
      ["总资产周转贡献", val(data, "dupont_asset_turnover")],
      ["权益乘数贡献", val(data, "dupont_leverage")]
    ].filter(function (p) { return !isMiss(p[1]); });

    if (dupont.length) {
      paper.appendChild(ui.subhead("变化归因 · 杜邦分解"));
      paper.appendChild(table(ui, ["项目", "贡献（个百分点）"], dupont));
    }

    var bridge = data.memoCollection("cashflow_bridge");
    if (bridge.length) {
      paper.appendChild(ui.subhead("现金流桥"));
      paper.appendChild(table(ui, ["项目", "金额（亿元）"],
        bridge.map(function (it) {
          var r = data.memoRow(it, ["item", "amount_yi"]);
          return [r.item, r.amount_yi];
        })));
    }
  }

  /* ==================================================================== */
  /* ④ 风险雷达                                                           */
  /* ==================================================================== */
  /* 复用页面 4 的 .risk-card 结构。**同一件东西在全站长一个样**：
     页面 4 是风险的工作台，这里是它的报告版，读者不该在两页之间重新学一遍。
     差别有两处：
       ① 这里不给折叠按钮 —— 报告是从上往下读的，
          而且打印时展开逻辑（app.js 的 beforeprint）也就不必参与；
       ② **卡片要摊平**（.is-flat）：这些卡压在报告纸上，而报告纸自己
          就是一张强玻璃。玻璃里再叠一层玻璃，四张卡会连成一片没有边界。
          摊平这件事以前是 CSS 用 `.paper .risk-card` 偷偷补的，
          挪出 .paper 就会静默失效；现在写在调用点上。 */
  function secRisks(ui, fmt, data, paper, col) {
    var items = data.memoCollection("risks");
    paper.appendChild(secHead(ui, col, "风险雷达"));
    if (!items.length) {
      paper.appendChild(muted(ui, "本报告未列出已触发的风险。"));
      return;
    }
    items.forEach(function (it) { paper.appendChild(riskCard(ui, fmt, data, it)); });
  }

  function riskCard(ui, fmt, data, item) {
    var r = data.memoRow(item, RISK_COLS);

    /* is-flat：压在报告纸上，见 secRisks 上面的注释 ② */
    var card = ui.el("div", "risk-card is-open is-flat");
    /* ⚠️ 走 ui.addClass，不写 classList.add：
       severityClass 对**没映射上的等级**返回空串，而空串喂进 classList 是抛异常
       不是无操作。原来是 `var code = SEV_BY_TAG[...]; if (code) add(...)` ——
       那个 if 挡的是「标签认不出来」，挡不住「标签认得、等级没映射上」，
       两件事不是同一个判断。现在两个失败点都归 addClass 兜。 */
    ui.addClass(card, fmt.severityClass(SEV_BY_TAG[r.severity_tag]));

    /* --- 头 --- */
    var head = ui.el("div", "risk-head");
    head.appendChild(ui.el("span", "sev-chip", r.severity_tag || fmt.MISSING));

    var text = ui.el("div", "risk-head-text");
    var tagline = [r.risk_id, r.category].filter(function (x) { return !isMiss(x); });
    if (!isMiss(r.score)) tagline.push("评分 " + r.score);
    if (tagline.length) text.appendChild(ui.el("div", "dim", tagline.join(" · ")));
    text.appendChild(ui.el("div", "risk-name", isMiss(r.risk_name) ? fmt.MISSING : r.risk_name));
    if (!isMiss(r.trigger)) text.appendChild(ui.el("div", "risk-trigger", "触发规则：" + r.trigger));
    head.appendChild(text);
    card.appendChild(head);

    /* --- 体：三层，左侧节点挂在同一条竖线上（同页面 4） --- */
    var body = ui.el("div", "risk-body");
    var rail = ui.el("div", "risk-layers");

    /* 第一层：触发判据与涉及数值。①②是事实、③是判断 —— 与页面 4 同一套语义。 */
    var L1 = layer(ui, 1, "触发判据", "is-fact");
    if (!isMiss(r.involved_str)) {
      L1.content.appendChild(ui.el("div", "detail-line", "涉及数值：" + r.involved_str));
    }
    if (!isMiss(r.numeric_evidence)) {
      L1.content.appendChild(ui.el("div", "detail-line", "数字证据：" + r.numeric_evidence));
    }
    if (L1.content.children.length > 1) rail.appendChild(L1.root);

    var L2 = layer(ui, 2, "解释", "is-fact");
    if (!isMiss(r.explanation)) {
      L2.content.appendChild(ui.el("div", "risk-explain", r.explanation));
    }
    if (L2.content.children.length > 1) rail.appendChild(L2.root);

    var L3 = layer(ui, 3, "建议动作", "is-conclusion");
    if (!isMiss(r.suggested_action)) {
      var sug = ui.el("div", "risk-suggest");
      sug.appendChild(ui.el("span", "sug-tag", "应对"));
      sug.appendChild(ui.el("p", "sug-text", r.suggested_action));
      L3.content.appendChild(sug);
    }
    if (L3.content.children.length > 1) rail.appendChild(L3.root);

    /* 三层全空（D 只给了名字）时不留一条光秃秃的竖线 */
    if (rail.children.length) {
      body.appendChild(rail);
      card.appendChild(body);
    }
    return card;
  }

  /* 层骨架：左侧节点 + 右侧内容。与页面 4 同一实现。 */
  function layer(ui, num, title, kind) {
    var root = ui.el("div", "layer " + kind);
    root.appendChild(ui.el("div", "layer-mark", num));
    var content = ui.el("div", "layer-content");
    content.appendChild(ui.el("div", "layer-title", title));
    root.appendChild(content);
    return { root: root, content: content };
  }

  /* ==================================================================== */
  /* ⑤ 预测与估值                                                         */
  /* ==================================================================== */
  function secValuation(ui, fmt, data, paper, col) {
    paper.appendChild(secHead(ui, col, "预测与估值"));

    var assum = strip(ui, "DCF 假设", [
      ["预测期", val(data, "forecast_years")],
      ["WACC", val(data, "wacc")],
      ["永续增长率", val(data, "terminal_growth")],
      ["所得税率", val(data, "tax_rate")],
      ["收入基数", val(data, "revenue_base")],
      ["EBIT 利润率", val(data, "ebit_margin")]
    ]);
    if (assum) paper.appendChild(assum);

    var fc = data.memoCollection("forecast");
    if (fc.length) {
      paper.appendChild(ui.subhead("DCF 预测"));
      paper.appendChild(table(ui, ["年度", "营业收入", "EBIT", "FCFF"],
        fc.map(function (it) {
          return rowOf(data, it, ["year", "revenue_yi", "ebit_yi", "fcff_yi"]);
        })));
    }

    var range = strip(ui, "估值区间", [
      ["DCF", rangeText(data, "dcf_low", "dcf_high", "dcf_mid")],
      ["相对估值", rangeText(data, "comps_low", "comps_high", "comps_mid")],
      ["融合每股", val(data, "blended_ps")]
    ]);
    if (range) paper.appendChild(range);

    var sc = data.memoCollection("scenarios");
    if (sc.length) {
      paper.appendChild(ui.subhead("三情景"));
      paper.appendChild(table(ui,
        ["情景", "每股价值（元/股）", "第一年收入增速", "EBIT 利润率", "WACC"],
        sc.map(function (it) {
          return rowOf(data, it, ["label", "per_share", "growth_y1", "ebit_margin", "wacc"]);
        })));
    }

    var sens = data.memoCollection("sensitivity_rows");
    if (sens.length) {
      var headCells = data.memoValue("sens_header_cells");
      /* 表头也是 D 用 " | " 压成的一串（sens_header_cells），
         与每行的 cells 同一个分隔符 —— 两边一起拆，列数才对得上。 */
      var gCols = headCells ? splitCells(headCells) : [];
      var headers = ["WACC \\ 永续增长"].concat(gCols);
      paper.appendChild(ui.subhead("敏感性（每股价值，元/股）"));
      paper.appendChild(table(ui, headers,
        sens.map(function (it) {
          var r = data.memoRow(it, ["wacc", "cells"]);
          return [r.wacc].concat(splitCells(r.cells));
        })));
    }
  }

  /* "413.91 至 660.13，中值 537.02 元/股" —— 这是**拼串**，不是算数：
     三个数都是 D 给好的，E 只决定中间用什么字连、单位放在哪。
     理由是 .v-target 一格放不下三段标签，拆成三格会让这一行膨胀成九个格。
     ★ 单位只在末尾补一次，所以这里读的是**原始 memoValue**，
     不走 val()（那会给每个数都加一遍「元/股」）。 */
  function rangeText(data, loKey, hiKey, midKey) {
    var raw = data.memoValue, lo = raw(loKey), hi = raw(hiKey), mid = raw(midKey);
    if (isMiss(lo) && isMiss(hi) && isMiss(mid)) return null;
    var u = SCALARS[loKey].unit;
    if (isMiss(lo) || isMiss(hi)) return isMiss(mid) ? null : mid + " " + u;
    return lo + " 至 " + hi + (isMiss(mid) ? "" : "，中值 " + mid) + " " + u;
  }

  /* 把 D 压成 "a | b | c" 的展示串拆回单元格。空段保留（拆出来是空串），
     这样列数才与表头一致 —— 少一列会让整行右移。 */
  function splitCells(s) {
    if (s === null || s === undefined || s === "") return [];
    return String(s).split("|").map(function (x) {
      return x.trim() === "" ? MISS_TEXT : x.trim();
    });
  }

  /* ==================================================================== */
  /* ⑥ 待核验事项                                                         */
  /* ==================================================================== */
  function secReview(ui, fmt, data, paper, col) {
    paper.appendChild(secHead(ui, col, "待核验事项"));

    var counts = strip(ui, "统计", [
      ["规则不可评估", val(data, "n_rules")],
      ["财务科目录取异常", val(data, "n_fin")],
      ["估值警告", val(data, "n_valwarn")],
      ["运行日志警告", val(data, "n_runwarn")]
    ]);
    if (counts) paper.appendChild(counts);

    var rules = data.memoCollection("review_rules");
    if (rules.length) {
      paper.appendChild(ui.subhead("规则不可评估"));
      paper.appendChild(table(ui, ["编号", "规则", "无法判定的原因"],
        rules.map(function (it) {
          return rowOf(data, it, ["rule_id", "rule_name", "explanation"]);
        })));
    }

    var fin = data.memoCollection("review_fin");
    if (fin.length) {
      paper.appendChild(ui.subhead("财务科目录取异常"));
      paper.appendChild(table(ui, ["科目", "状态"],
        fin.map(function (it) {
          var r = data.memoRow(it, ["name", "status"]);
          /* ★ 两个字段都要过一遍前端词汇表：
             name 是 D 的**字段键名**（"goodwill"），中文名在全站统一台账
             FINANCIAL_LABELS 里（→「商誉」）；
             status 是 D 的状态码（not_applicable），中文由 statusLabel 翻。
             两处都是查表不是翻译 —— 查不到就原样显示英文，不猜。 */
          return [data.metricLabel(r.name), fmt.statusLabel(r.status)];
        })));
    }

    var vw = data.memoCollection("review_valwarn");
    if (vw.length) {
      paper.appendChild(ui.subhead("估值警告"));
      var ul = ui.el("ul", "warn-list");
      vw.forEach(function (it) {
        var r = data.memoRow(it, ["text"]);
        ul.appendChild(ui.el("li", null, r.text === null ? MISS_TEXT : r.text));
      });
      paper.appendChild(ul);
    }

    /* review_runwarn 为空是常态（D 的 run_log 没有警告），不摆一条空标题。
       它有没有值，上面那行统计里的「运行日志警告 N 项」已经回答了。 */
    var rw = data.memoCollection("review_runwarn");
    if (rw.length) {
      paper.appendChild(ui.subhead("运行日志警告"));
      var ul2 = ui.el("ul", "warn-list");
      rw.forEach(function (it) {
        var r = data.memoRow(it, ["text"]);
        ul2.appendChild(ui.el("li", null, r.text === null ? MISS_TEXT : r.text));
      });
      paper.appendChild(ul2);
    }
  }

  /* ==================================================================== */
  /* ⑦ 数据来源与免责声明                                                 */
  /* ==================================================================== */
  function secSources(ui, fmt, data, paper, col) {
    paper.appendChild(secHead(ui, col, "数据来源与免责声明"));

    var srcs = data.memoCollection("sources");
    if (srcs.length) {
      paper.appendChild(ui.subhead("数据来源"));
      /* ★ 2026-10-13 第七轮：删掉「获取时间」这一列。
         反馈原话：「数据来源部分去掉『获取时间』一列」。
         查过 D 交付的 memo.sources：**每一行的 retrieved_at 都是「未标注」**
         （12 行、12 个「未标注」）—— 这一列占着宽度、不进任何信息，
         而且「未标注」三个字会被读成「E 没填」，实际是 D 的抽取器没有这个字段。
         ★ 判据仍然落在数据上：这里不写 `if (retrieved_at)` 之类的条件渲染，
           而是**整列去掉** —— 一列全是同一个占位符，不是「有的有有的没有」，
           条件渲染只会让表头对齐随数据变。D 哪天真的补上取值时间，
           要恢复这一列是把它加回 headers，不是恢复一个空列。 */
      paper.appendChild(table(ui, ["文件名", "页码"],
        srcs.map(function (it) {
          var r = data.memoRow(it, ["file_name", "page"]);
          return [r.file_name, r.page === null ? null : "P." + r.page];
        })));
      paper.appendChild(muted(ui, "页码为年报原始印刷页码，可逐条核对。"));
    }

    var body = ui.el("div", "paper-body");
    var d1 = val(data, "disclaimer");
    var d2 = val(data, "group_disclaimer");
    if (d1 || d2) {
      body.appendChild(ui.el("h3", "blk-title", "免责声明"));
      if (d1) body.appendChild(ui.el("p", null, d1));
      if (d2) body.appendChild(ui.el("p", null, d2));
    }
    if (body.children.length) paper.appendChild(body);
  }

  /* ==================================================================== */
  /* 空状态 / 操作区 / 开发卡                                             */
  /* ==================================================================== */

  function emptyPaper(ui) {
    var paper = ui.el("div", "paper");
    var ph = ui.el("div", "paper-empty");
    ph.appendChild(ui.el("div", "paper-empty-title", "投研简报尚未生成"));
    ph.appendChild(ui.el("p", "paper-empty-text",
      "memo 绑定表未提供。本页等待 D 的简报渲染产物 "
      + "out_data/reports/<key>/memo.json。"));
    paper.appendChild(ph);
    return paper;
  }

  function actions(ui) {
    var row = ui.el("div", "action-row");
    /* ★ 2026-10-13 第七轮：按钮从 .btn-ghost 改成 .btn-primary（橙底深墨字）。
       反馈原话：「打印 / 导出 PDF 按钮调整为橙色」。
       直接复用 .btn-primary 而不是新加一个 .btn-print —— 橙色令牌**只有一个**
       （--c-watch），新开类只会再造一处「同一个橙写两遍」的地方。
       语义上它也站得住：橙 = 「强调 = 可行动 + 需关注」，
       全页只有这一个按钮，它就是这个页面上唯一要人动手的东西。 */
    var btn = ui.el("button", "btn btn-primary", "打印 / 导出 PDF");
    btn.addEventListener("click", function () { window.print(); });
    row.appendChild(btn);
    return row;
  }

  function specCard(spec, ui, note) {
    var block = ui.card("dev-card");
    block.appendChild(ui.subhead("本页待确认"));
    block.appendChild(ui.todoList(spec));
    if (note) block.appendChild(ui.note(note, "warn"));
    return block;
  }
})();

</script>
<!-- 5. 演示模式开关。★ 打包 Final.html 前改成 true ★
         打开后给 <body> 加 .app-demo，六页「本页待实现」开发卡一起隐藏。
         只隐藏不删 DOM，所以开发期和自测照常看得见那块内容。 -->
  <script>window.FINSCOPE_DEMO = true;   /* 打包时由 tools/build-final.js 置 true */</script>

  <!-- 6. 入口，必须最后加载（要等上面全部注册完） -->
<script>
/* ================= app.js ================= */
/* ============================================================================
 * app.js —— 入口 / 调度
 * ----------------------------------------------------------------------------
 * 页面加载后第一个执行的文件，干三件事：
 *   ① 调用 dataLoader 加载数据；
 *   ② 生成左侧导航 + 六段切换路由；
 *   ③ 依次叫六个页面渲染器开工（懒加载：切到哪页才渲染哪页）。
 *
 * 另外在这里提供 FinScope.ui —— 页面共用的 DOM 小工具，
 * 避免六个页面各写一遍建元素的样板代码。
 * ==========================================================================*/

(function () {
  "use strict";

  var F = (window.FinScope = window.FinScope || {});
  F.pages = F.pages || {};

  /* 六个页面的固定顺序（团队分工说明第六节） */
  var ORDER = ["p1", "p2", "p3", "p4", "p5", "p6"];

  /* ==================================================================== */
  /* FinScope.ui —— 建 DOM 的小工具                                        */
  /* ==================================================================== */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  /* 加一个类，**且只在类名非空时才加**。
     ★ 2026-10-13：这个助手是补一次线上报错补出来的 ——
     页面 2 整页白屏，控制台一句
     「Failed to execute 'add' on 'DOMTokenList': The token provided must not be empty.」
     原因是 `classList.add(fmt.statusClass(s))`，而 statusClass 对
     「不需要上色」的那几档（ok / found / not_applicable / not_meaningful）
     正是返回空串 —— 空串不是「什么都不做」，是**抛异常**。
     同理 severityClass 对没映射上的等级也返回空串。

     为什么不把 statusClass 改成返回 null：那个 "" 是有用的信号
     （调用方靠它判断「这一档不上色」），改掉要动好几处。真正该固定的是
     「空类名不能进 classList」这一条 —— 它归 DOM 层管，所以修在这里。
     ⚠️ 别为了省事写成 `n.className += " " + cls`，那会在 cls 为空时
     留下尾随空格，也绕过了下面这种用法的一致性。 */
  function addClass(n, cls) {
    if (cls) n.classList.add(cls);
    return n;
  }

  /* 区块标题：<h2> + 说明 */
  function section(title, desc) {
    var box = el("div", "sec-head");
    box.appendChild(el("h2", "sec-title", title));
    if (desc) box.appendChild(el("p", "sec-desc", desc));
    return box;
  }

  /* 小标题 */
  function subhead(title) {
    return el("h3", "blk-title", title);
  }

  /* "本页待实现" 清单：骨架阶段用来标记进度 */
  function todoList(items) {
    var ul = el("ul", "todo-list");
    items.forEach(function (t) {
      var li = el("li", "todo-item");
      li.appendChild(el("span", "todo-box", "☐"));
      li.appendChild(el("span", "todo-text", t));
      ul.appendChild(li);
    });
    return ul;
  }

  /* 键值对网格：用于数据预览 */
  function kv(pairs) {
    var grid = el("div", "kv-grid");
    pairs.forEach(function (p) {
      var cell = el("div", "kv-cell");
      cell.appendChild(el("div", "kv-key", p[0]));
      var val = el("div", "kv-val" + (p[2] ? " " + p[2] : ""));
      val.textContent = p[1];
      cell.appendChild(val);
      if (p[3]) cell.appendChild(el("div", "kv-note", p[3]));
      grid.appendChild(cell);
    });
    return grid;
  }

  /* 说明条 */
  function note(text, tone) {
    return el("p", "note" + (tone ? " note-" + tone : ""), text);
  }

  /* 空状态 */
  function empty(msg) {
    return el("div", "empty-state", msg);
  }

  /* 通用卡片 */
  /* extraClass 用来挂标记类。目前只有 "dev-card" 一种 ——
     六页的「本页待实现」开发卡靠它被演示模式一次性隐藏。 */
  function card(extraClass) {
    return el("div", "card" + (extraClass ? " " + extraClass : ""));
  }

  /* ---- 2026-10-13 撤：chartBox(canvasId) ----
     它造的是 .chart-box + <canvas>，当年给 Chart.js 的 radar() / trend() 用。
     这两张图早就撤了，全站零调用（唯一的引用是下面 ui 的导出）。
     随 vendor/chart.umd.min.js 与 js/charts.js 一起删。
     ★ 留着想恢复的话：六个页面现在**一张 canvas 都没有**，
       标尺 / 比例条 / 风险区分流都是 DOM + CSS 画的 ——
       恢复 canvas 前先读 css/components.css 里 .vr-track 那段注释
       （为什么当初选了 DOM 而不是 canvas）。 */


  /* ------------------------------------------------------------------ */
  /* 溯源弹窗                                                            */
  /* 金融场景的核心要求：任何一个数字都必须能回答「从哪来」。              */
  /* 点击 .page-link 弹出一个浮层，显示指标、数值、期间、来源文件、章节、页码。 */
  /* 页面上同时只允许存在一个弹窗；点别处或按 ESC 关闭。                   */
  /* ------------------------------------------------------------------ */

  var popoverEl = null;

  function onDocClick(e) {
    if (!popoverEl) return;
    if (popoverEl.contains(e.target)) return;
    // 点在另一个溯源链接上时不关，交给它自己的 click 处理（会先关掉再开新的）
    if (e.target && e.target.closest && e.target.closest(".page-link")) return;
    closePopover();
  }

  function onEsc(e) {
    if (e.key === "Escape") closePopover();
  }

  /* 弹窗用 fixed 定位，不跟随滚动。页面一滚就关掉，避免浮在半空对不上位置。 */
  function onScroll() {
    closePopover();
  }

  function closePopover() {
    if (popoverEl && popoverEl.parentNode) {
      popoverEl.parentNode.removeChild(popoverEl);
    }
    popoverEl = null;
    document.removeEventListener("click", onDocClick, true);
    document.removeEventListener("keydown", onEsc, true);
    window.removeEventListener("scroll", onScroll, true);
  }

  /**
   * 把「出处」解析成一个可跳转的地址，没有就返回 null。
   *
   * ★ 2026-10-13：删掉了最后一段 fallback `company.report_url`。
   *   D 的 company **没有这个字段**（它只有 name / ticker / industry /
   *   report_period / exchange / report_type / auditor / audit_opinion /
   *   currency / amount_unit），而 E 已经从所有页面撤掉对它的消费。
   *   留着一行永远取不到值的 fallback，只会让人以为数据里有年报链接。
   *
   * 取用顺序：来源条目自己的 url → 证据项自己的 url。
   * D 的 sources[] 目前只有 { name, as_of, official, purpose }，没有 url，
   * 所以实际会走 null 分支 —— 浮层照常显示，只是没有链接。这是如实反映：
   * 数据里没有的东西，界面上就不假装有。
   *
   * 页码锚点：url 里已经有 # 就不再追加，避免拼出两个 # 的坏地址。
   * 只有 Chrome 系内置 PDF 阅读器认 #page=N，认不出也只是从第 1 页开始，不会报错。
   */
  function resolveSourceUrl(src, item, page) {
    var url = (src && src.url) || (item && item.url);
    if (!url || typeof url !== "string") return null;
    if (page === null || page === undefined) return url;
    if (url.indexOf("#") >= 0) return url;
    return url + "#page=" + page;
  }

  /** rows: [[键, 值], ...]；link 可选，给了就在底部加一个「打开原文」 */
  function openPopover(anchor, rows, link) {
    closePopover();

    var p = el("div", "popover");
    p.appendChild(el("div", "popover-title", "数据溯源"));

    var body = el("div", "popover-body");
    rows.forEach(function (r) {
      if (r[1] === null || r[1] === undefined || r[1] === "") return;   // 空值不占行
      var line = el("div", "popover-row");
      line.appendChild(el("span", "popover-key", r[0]));
      line.appendChild(el("span", "popover-val", r[1]));
      body.appendChild(line);
    });
    p.appendChild(body);

    if (link && link.href) {
      var a = el("a", "popover-open", link.text || "打开原文 ↗");
      a.href = link.href;
      a.target = "_blank";
      a.rel = "noopener";
      a.addEventListener("click", function (e) { e.stopPropagation(); });
      p.appendChild(a);
    }

    p.appendChild(el("div", "popover-foot", "按 ESC 或点击空白处关闭"));

    document.body.appendChild(p);
    popoverEl = p;

    /* 定位：优先贴在锚点下方，下方放不下就翻到上方，再夹到视口内 */
    var a = anchor.getBoundingClientRect();
    var pw = p.offsetWidth;
    var ph = p.offsetHeight;
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;

    var left = a.left;
    if (left + pw > vw - 12) left = vw - pw - 12;
    if (left < 12) left = 12;

    var top = a.bottom + 8;
    if (top + ph > vh - 12) top = a.top - ph - 8;
    if (top < 12) top = 12;

    p.style.left = left + "px";
    p.style.top = top + "px";

    /* 延到下一个事件循环再挂全局监听，
       否则当前这次点击会立刻把刚打开的弹窗关掉 */
    setTimeout(function () {
      document.addEventListener("click", onDocClick, true);
      document.addEventListener("keydown", onEsc, true);
      window.addEventListener("scroll", onScroll, true);
    }, 0);
  }

  /**
   * 生成一个可点击的溯源链接。
   * @param text 链接文字（如「2025年年度报告 P.82」）
   * @param opts { metric: 中文指标名, page: 页码, item: 数据项对象 }
   */
  function sourceLink(text, opts) {
    opts = opts || {};

    var s = el("span", "page-link", text);
    s.title = "点击查看数据出处";

    s.addEventListener("click", function (e) {
      e.stopPropagation();

      var item = opts.item || null;
      var page = opts.page !== undefined ? opts.page : (item ? item.page : null);
      var src = F.data.findSource(opts.metric, page);

      openPopover(s, [
        ["指标",     opts.metric || null],
        ["数值",     item ? F.fmt.metric(item) : null],
        ["期间",     item ? item.period : null],
        ["来源文件", (src && src.source) || (item && item.source) || null],
        ["章节",     src ? src.section : null],
        ["页码",     F.fmt.page(page)]
      ], {
        href: resolveSourceUrl(src, item, page),
        text: "打开原文 ↗"
      });
    });

    return s;
  }

  F.ui = {
    el: el,
    addClass: addClass,
    section: section,
    subhead: subhead,
    todoList: todoList,
    kv: kv,
    note: note,
    empty: empty,
    card: card,
    sourceLink: sourceLink,
    resolveSourceUrl: resolveSourceUrl,     /* 导出是为了让冒烟测试能覆盖到 */
    closePopover: closePopover
  };

  /* ==================================================================== */
  /* 路由                                                                  */
  /* ==================================================================== */

  var mounted = {};     // 已渲染过的页面
  var current = null;

  function navEl() { return document.getElementById("nav"); }
  function mainEl() { return document.getElementById("main"); }

  /* 生成左侧导航 */
  function buildNav() {
    var nav = navEl();
    if (!nav) return;
    nav.innerHTML = "";

    var brand = el("div", "brand");
    brand.appendChild(el("div", "brand-mark", "FinScope"));
    brand.appendChild(el("div", "brand-sub", "财报理解 · 财务诊断 · 风险识别 · 估值分析"));
    nav.appendChild(brand);

    var ul = el("ul", "nav-list");
    ORDER.forEach(function (id) {
      var p = F.pages[id];
      if (!p) return;

      var li = el("li", "nav-item");
      var a = el("a", "nav-link");
      a.href = "#" + id;
      a.dataset.page = id;

      a.appendChild(el("span", "nav-idx", String(p.index || "").padStart(2, "0")));
      var txt = el("span", "nav-text");
      txt.appendChild(el("span", "nav-title", p.title || id));
      if (p.subtitle) txt.appendChild(el("span", "nav-sub", p.subtitle));
      a.appendChild(txt);

      li.appendChild(a);
      ul.appendChild(li);
    });
    nav.appendChild(ul);

    var foot = el("div", "nav-foot");
    var st = F.data.status();
    foot.appendChild(el("div", "nav-source", "数据源：" + st.sourceName));
    foot.appendChild(el("div", "nav-hint", st.loaded ? "已就绪" : "未就绪"));
    nav.appendChild(foot);
  }

  /* 顶部数据校验提示条 */
  function renderWarnings() {
    var main = mainEl();
    if (!main) return;
    var old = main.querySelector(".warn-bar");
    if (old) old.parentNode.removeChild(old);

    var w = F.data.status().warnings;
    if (!w.length) return;

    var bar = el("div", "warn-bar");
    bar.appendChild(el("div", "warn-title", "数据校验提醒（" + w.length + " 项，不影响页面运行）"));
    var ul = el("ul", "warn-list");
    w.slice(0, 8).forEach(function (m) { ul.appendChild(el("li", null, m)); });
    if (w.length > 8) ul.appendChild(el("li", null, "…… 其余 " + (w.length - 8) + " 项见控制台"));
    bar.appendChild(ul);
    main.insertBefore(bar, main.firstChild);
  }

  /* 确保某页的容器存在，并完成首次渲染 */
  function mount(id) {
    var main = mainEl();
    if (!main) return null;

    var sec = document.getElementById("page-" + id);
    if (!sec) {
      sec = el("section", "page");
      sec.id = "page-" + id;
      main.appendChild(sec);
    }

    var p = F.pages[id];
    if (!p) {
      sec.appendChild(empty("页面模块未加载：" + id));
      return sec;
    }

    if (!mounted[id]) {
      sec.innerHTML = "";
      try {
        p.render(sec);
      } catch (err) {
        sec.innerHTML = "";
        sec.appendChild(empty("渲染出错：" + err.message));
        console.error("[FinScope] 页面 " + id + " 渲染失败", err);
      }
      mounted[id] = true;
    }

    // 每次显示都通知一次，页面可在此 resize 图表
    if (typeof p.onShow === "function") {
      try { p.onShow(sec); } catch (e) { console.warn("[FinScope] onShow 出错", e); }
    }
    return sec;
  }

  /* 切页 */
  function show(id) {
    if (ORDER.indexOf(id) < 0) id = ORDER[0];
    if (id === current) return;

    // 隐藏旧的
    if (current) {
      var old = document.getElementById("page-" + current);
      if (old) old.classList.remove("is-active");
      var oldLink = document.querySelector('.nav-link[data-page="' + current + '"]');
      if (oldLink) oldLink.classList.remove("is-active");
    }

    var sec = mount(id);
    if (sec) sec.classList.add("is-active");

    var link = document.querySelector('.nav-link[data-page="' + id + '"]');
    if (link) link.classList.add("is-active");

    current = id;
    if (mainEl()) mainEl().scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function fromHash() {
    return (location.hash || "").replace(/^#/, "") || ORDER[0];
  }

  /* ==================================================================== */
  /* 启动                                                                  */
  /* ==================================================================== */

  function boot() {
    // ⓪ 演示模式。打包前把 index.html 里的 window.FINSCOPE_DEMO 改成 true，
    //    六页的「本页待实现」开发卡会一起隐藏。**不删 DOM** ——
    //    测试与开发期照常看得见，只是演示时不显示。
    if (window.FINSCOPE_DEMO) document.body.classList.add("app-demo");

    // ① 加载数据。换真数据时只改 index.html 里引用的那个 data/*.js
    F.data.load();

    // ② 建导航
    buildNav();
    renderWarnings();

    // ③ 路由
    window.addEventListener("hashchange", function () { show(fromHash()); });
    show(fromHash());

    // ④ 打印 / 导出 PDF 前，把折叠的证据链全部展开。
    //    否则页面上「高风险已展开、其余折叠」的层级设计会在打印稿里变成半截内容。
    function expandAll() {
      var nodes = document.querySelectorAll(".risk-card:not(.is-open)");
      for (var i = 0; i < nodes.length; i++) {
        var btn = nodes[i].querySelector(".risk-toggle");
        if (btn) btn.click();            // 走正常交互，保证按钮文案同步
        else nodes[i].classList.add("is-open");
      }
    }
    window.addEventListener("beforeprint", expandAll);
    // Chrome 下 beforeprint 在部分场景不触发，用媒体查询监听兜底
    if (window.matchMedia) {
      var mq = window.matchMedia("print");
      var onMq = function (e) { if (e.matches) expandAll(); };
      if (mq.addEventListener) mq.addEventListener("change", onMq);
      else if (mq.addListener) mq.addListener(onMq);
    }

    console.log(
      "%cFinScope 前端骨架已启动",
      "color:#4a6785;font-weight:bold",
      "\n数据源：" + F.data.status().sourceName,
      "\n校验提醒：" + F.data.status().warnings.length + " 项",
      "\n演示模式：" + (window.FINSCOPE_DEMO ? "开（开发卡已隐藏）" : "关（开发卡可见）")
    );
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
